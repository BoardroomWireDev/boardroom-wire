<!-- ALEXANDR WANG · HERO H5 · HOW MUSE WORKS · v2, the motion pass (10 Oct 2026; Ive). v1 (04-how-muse-works.html) stays as the fallback.
     An exploded two-level model in true geometry, lit, one camera through it (rule 13: it goes where the voice is):
       ground   a desk: your two phones (71.5 x 147.6 x 8.25 mm) and a 14-inch laptop (313 x 221 mm base, 313 x 210 mm lid), one scale;
       cloud    a plate above and behind it: Muse Secure VM (a slab whose screen is its desktop: dock of tools, a plan that ticks, a
                terminal, files, and for the errand a browser on Facebook Marketplace); the run trace (Muse's long, branching run as
                extruded bars against a chatbot's one reply); email and app tiles. Gold rods link the phones to the cloud.
     No glow, no haze, no particles (rule 12, REJECTIONS AI-LOOK): light is two soft pools and a rim; gold is satin, never emissive.
     Words: names only, and only inside the world (the VM's title from data.js, the chat header, Facebook Marketplace on the page).
     Steps keep v1's names and the cue sheet's ?at= order (review\dashboard_cue_sheet.md §04); in-between beats are offsets from the
     nearest step, measured on cue-map\vo-words.json, so a re-timing carries them. Overlay b034 (Meta's receipt, 4.86-9.86 s) sits on
     the left-centre band: the VM is framed right and its title high while it is up.
     Capture contract: BW.run({play, rest}); ?capture ?final ?still ?beats ?t=<step>. Needs WebGL (headless Chrome: GPU or SwiftShader). -->

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const F = BW.fig, Q = new URLSearchParams(location.search);

/* ---- steps: v1's names and order; ?at= overrides in order, ?secs= the length ---- */
const STEPS = [['phone', .2], ['cloud', 2.4], ['vm', 7.02], ['computer', 10.82], ['jolly', 23.76], ['doors', 26.48], ['whatsapp', 28],
  ['photos', 34.4], ['post', 36.06], ['fill', 38.2], ['tools', 43.56], ['out', 46.12]];
const given = (Q.get('at') || '').split(',').filter(s => s.trim() !== '').map(Number);
const ST = {}; STEPS.forEach(([n, t], i) => { ST[n] = i < given.length ? given[i] : t; });
const END = +(Q.get('secs') || 0) || 52.5;
const A = (n, dt = 0) => ST[n] + dt;

const CUTS = [[A('jolly', -.56), A('whatsapp', 2.8)], [A('post', 1.24), A('fill', 2.2)]];   /* 23.20-30.80, 37.30-40.40 */

/* ---- tokens ---- */
const css = getComputedStyle(document.documentElement);
const tok = (v) => css.getPropertyValue(v).trim();
const BG = tok('--bg'), GOLD = tok('--gold'), CR = tok('--cream-rgb'), GR = tok('--gold-rgb');
const cr = (a) => `rgba(${CR}, ${a})`, gd = (a) => `rgba(${GR}, ${a})`;
/* screen surfaces: the ink ground lifted toward cream (no typed colours; bw audit) */
const BGRGB = [1, 3, 5].map(i => parseInt(BG.slice(i, i + 2), 16)), CRRGB = CR.split(',').map(Number);
const tone = (k) => 'rgb(' + BGRGB.map((v, i) => Math.round(v + (CRRGB[i] - v) * k)).join(',') + ')';
const INK = tok('--ink'), SCREEN_BG = tone(.012);

/* ---- real material: the marks and Jolly (Meta's frame), as data URIs (WebGL cannot read file:// images) ---- */
const img = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const [IM_MUSE, IM_WA, IM_FB, IM_JOLLY] = await Promise.all([img(H5TEX.muse), img(H5TEX.whatsapp), img(H5TEX.facebook), img(H5TEX.jolly)]);
await Promise.all([document.fonts.load('500 40px Inter'), document.fonts.load('600 40px Inter')]);

/* ================= RENDERER, LIGHT ================= */
const stage = document.querySelector('.stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.max(1, window.devicePixelRatio || 1));
renderer.setSize(1920, 1080, false);
renderer.domElement.className = 'd04-gl';
stage.insertBefore(renderer.domElement, stage.firstChild);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .04).texture;

const camera = new THREE.PerspectiveCamera(30, 16 / 9, 5, 40000);

scene.add(new THREE.HemisphereLight(0xf5f1e5, 0x000000, .09));
function spot(color, I, pos, tgt, angle, shadow) {
  const s = new THREE.SpotLight(color, I, 0, angle, 1, 0);
  s.position.set(...pos); s.target.position.set(...tgt); scene.add(s, s.target);
  if (shadow) { s.castShadow = true; s.shadow.mapSize.set(2048, 2048); s.shadow.bias = -.0004; s.shadow.normalBias = .6; s.shadow.camera.near = 400; s.shadow.camera.far = 6000; }
  return s;
}
spot(0xfff0d8, 2.1, [350, 1500, 900], [1000, 0, -40], .62, true);          /* the desk: a warm key from front left */
const cloudKey = spot(0xfff3e0, 1.6, [300, 2600, 600], [300, 330, -700], .7, true);
spot(0xfff3e0, 1.5, [-1100, 2300, 500], [-1000, 330, -760], .5, true);                      /* the run's own key, over the left wing */         /* the cloud plate */
const rim = new THREE.DirectionalLight(0xdfe4ff, .55); rim.position.set(-400, 900, -3000); scene.add(rim);   /* edges, from behind */

/* ================= MATERIAL ================= */
/* a quiet matte grain (seeded, so every render is the same): the desk and the plate read as surfaces, not as void */
function grain(seed, rep) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d'), im = x.createImageData(512, 512);
  let r = seed; const rnd = () => { r = (r * 1664525 + 1013904223) >>> 0; return r / 4294967296; };
  for (let i = 0; i < 512 * 512; i++) { const v = 226 + rnd() * 26 + (rnd() < .02 ? -18 : 0); im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  x.putImageData(im, 0, 0); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); return t;
}
const M = {
  desk: new THREE.MeshStandardMaterial({ color: 0x1e1e23, map: grain(7, 900), roughness: .92, metalness: 0, envMapIntensity: .2 }),
  plate: new THREE.MeshPhysicalMaterial({ color: 0x24242b, map: grain(11, 40), roughness: .62, metalness: .35, clearcoat: .2, clearcoatRoughness: .6, envMapIntensity: .22 }),
  ti: new THREE.MeshStandardMaterial({ color: 0x3b3b41, roughness: .34, metalness: .9, envMapIntensity: .55 }),
  alu: new THREE.MeshStandardMaterial({ color: 0x3e3e44, roughness: .4, metalness: .85, envMapIntensity: .45 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x040406, roughness: .08, metalness: 0, clearcoat: 1, clearcoatRoughness: .06, envMapIntensity: .35 }),
  slab: new THREE.MeshStandardMaterial({ color: 0x1c1c22, roughness: .44, metalness: .7, envMapIntensity: .5 }),
  gold: new THREE.MeshStandardMaterial({ color: new THREE.Color(GOLD), roughness: .42, metalness: .75, envMapIntensity: .7 }),
  cream: new THREE.MeshStandardMaterial({ color: new THREE.Color(`rgb(${CR})`), roughness: .75, metalness: 0 }),
  creamDim: new THREE.MeshStandardMaterial({ color: 0x5c5a55, roughness: .8, metalness: 0 }),
  barGold: new THREE.MeshStandardMaterial({ color: new THREE.Color(GOLD), roughness: .44, metalness: .55, envMapIntensity: .6 })
};

/* ================= GEOMETRY HELPERS ================= */
function rr(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
/* a slab w (x) by d (z) by h (y), rounded in plan, bevelled edges, bottom at y = 0 */
function slab(w, d, h, r, b = 1) {
  const g = new THREE.ExtrudeGeometry(rr(w - 2 * b, d - 2 * b, Math.max(.5, r - b)), { depth: Math.max(.1, h - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 14 });
  g.rotateX(-Math.PI / 2); g.translate(0, b, 0); return g;
}
/* a flat screen facing +y with 0..1 uvs (canvas top = far, -z) */
function screenGeo(w, d, r) {
  const g = new THREE.ShapeGeometry(rr(w, d, r), 14);
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + w / 2) / w, (p.getY(i) + d / 2) / d);
  g.rotateX(-Math.PI / 2); return g;
}
const mesh = (g, m, parent, cast = true, recv = true) => { const o = new THREE.Mesh(g, m); o.castShadow = cast; o.receiveShadow = recv; (parent || scene).add(o); return o; };
function canvasTex(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  return { c, x: c.getContext('2d'), t, sig: '' };
}
const screenMat = (T) => new THREE.MeshBasicMaterial({ map: T.t, toneMapped: false });
/* a rod from a to b (a thin satin-gold cylinder) that grows from a */
function rod(a, b, r = .8, mat = M.gold) {
  const A3 = new THREE.Vector3(...a), B3 = new THREE.Vector3(...b), dir = B3.clone().sub(A3), len = dir.length();
  const g = new THREE.CylinderGeometry(r, r, len, 12); g.translate(0, len / 2, 0);
  const o = mesh(g, mat, null, true, false); o.position.copy(A3);
  o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return { o, A: A3, B: B3, at: (u) => A3.clone().lerp(B3, u) };
}

/* ================= CANVAS DRAWING (the screens) ================= */
const ICON = {
  globe: ['M-18,0 a18,18 0 1,0 36,0 a18,18 0 1,0 -36,0', 'M0,-18 C-11,-9 -11,9 0,18 C11,9 11,-9 0,-18', 'M-18,0 H18', 'M-15,-9 H15 M-15,9 H15'],
  term: ['M-20,-15 h40 v30 h-40 z', 'M-12,-5 l7,5 l-7,5', 'M1,6 h10'],
  folder: ['M-20,-13 h13 l4,5 h23 v21 h-40 z'],
  image: ['M-20,-15 h40 v30 h-40 z', 'M-12,-6 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0', 'M-20,13 L-6,0 L4,8 L10,3 L20,12'],
  mail: ['M-20,-14 h40 v28 h-40 z', 'M-20,-14 L0,2 L20,-14'],
  cursor: ['M-8,-16 L-8,14 L-1,7 L5,18 L9,16 L3,5 L12,5 Z'],
  check: ['M-12,0 L-3,9 L13,-9'],
  clock: ['M-18,0 a18,18 0 1,0 36,0 a18,18 0 1,0 -36,0', 'M0,-10 V0 L8,5'],
  chat: ['M-20,-14 h40 v24 h-26 l-8,8 v-8 h-6 z'],
  cal: ['M-18,-14 h36 v32 h-36 z', 'M-18,-5 h36', 'M-9,-19 v8 M9,-19 v8'],
  pin: ['M0,18 C-12,4 -14,-2 -14,-6 a14,14 0 0,1 28,0 c0,4 -2,10 -14,24 z', 'M-5,-6 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0'],
  cart: ['M-20,-14 h7 l5,20 h22 l4,-14 h-29', 'M-6,14 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0 M10,14 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0'],
  music: ['M-6,12 V-14 L14,-18 V8', 'M-14,12 a8,6 0 1,0 16,0 a8,6 0 1,0 -16,0', 'M6,8 a8,6 0 1,0 16,0 a8,6 0 1,0 -16,0'],
  doc: ['M-14,-18 h20 l8,8 v28 h-28 z', 'M6,-18 v8 h8'],
  reply: ['M-4,-12 L-18,0 L-4,12', 'M-18,0 H6 C14,0 18,6 18,14'],
  lock: ['M-14,-2 h28 v22 h-28 z', 'M-9,-2 V-10 a9,9 0 0,1 18,0 V-2']
};
const P2 = {}; for (const k in ICON) P2[k] = ICON[k].map(d => new Path2D(d));
function icon(x, name, cx, cy, k, col, lw = 2.2, fill) {
  x.save(); x.translate(cx, cy); x.scale(k, k); x.lineWidth = lw / k * 1.4; x.strokeStyle = col; x.lineCap = 'round'; x.lineJoin = 'round';
  P2[name].forEach(p => { if (fill) { x.fillStyle = fill; x.fill(p); } x.stroke(p); }); x.restore();
}
function rrect(x, X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function bar(x, X, Y, w, col, lw = 8) { if (w <= 0) return; x.strokeStyle = col; x.lineWidth = lw; x.lineCap = 'round'; x.beginPath(); x.moveTo(X, Y); x.lineTo(X + w, Y); x.stroke(); }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (u) => { u = clamp(u); return u * u * (3 - 2 * u); };
const easeOut = (u) => 1 - Math.pow(1 - clamp(u), 3);

/* the couch, a line drawing (760 x 330 local units): photographed on the phone, posted on the listing */
const COUCH = ['M50,160 V70 Q50,36 84,36 H676 Q710,36 710,70 V160',
  'M70,78 q0,-18 18,-18 h170 q18,0 18,18 v74 q0,18 -18,18 h-170 q-18,0 -18,-18 z', 'M276,78 q0,-18 18,-18 h170 q18,0 18,18 v74 q0,18 -18,18 h-170 q-18,0 -18,-18 z',
  'M482,78 q0,-18 18,-18 h170 q18,0 18,18 v74 q0,18 -18,18 h-170 q-18,0 -18,-18 z',
  'M0,300 V150 Q0,118 32,118 H62 Q94,118 94,150 V300 Z', 'M666,300 V150 Q666,118 698,118 H728 Q760,118 760,150 V300 Z',
  'M94,184 q0,-14 14,-14 h162 q14,0 14,14 v24 q0,14 -14,14 h-162 q-14,0 -14,-14 z', 'M285,184 q0,-14 14,-14 h162 q14,0 14,14 v24 q0,14 -14,14 h-162 q-14,0 -14,-14 z',
  'M476,184 q0,-14 14,-14 h162 q14,0 14,14 v24 q0,14 -14,14 h-162 q-14,0 -14,-14 z', 'M94,222 H666 M94,300 H666',
  'M40,300 L46,330 M720,300 L714,330 M280,300 L282,322 M480,300 L478,322'].map(d => new Path2D(d));
const CROPS = [[-30, -40, 820, 410], [-20, 40, 400, 300], [300, 20, 470, 320]];
function couch(x, X, Y, w, h, crop, lw, meet, lineA = .85) {
  x.save(); rrect(x, X, Y, w, h, Math.min(w, h) * .06); x.clip();
  x.fillStyle = tone(.03); x.fillRect(X, Y, w, h);
  /* a floor line and a wall corner, so the photo reads as a room */
  const k = (meet ? Math.min : Math.max)(w / crop[2], h / crop[3]);
  x.translate(X + w / 2, Y + h / 2); x.scale(k, k); x.translate(-(crop[0] + crop[2] / 2), -(crop[1] + crop[3] / 2));
  x.fillStyle = 'rgba(255,255,255,.035)'; x.fillRect(-400, 330, 1600, 400);
  x.strokeStyle = cr(.18); x.lineWidth = 2 / k; x.beginPath(); x.moveTo(-400, 330); x.lineTo(1200, 330); x.stroke();
  x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.ellipse(380, 332, 420, 14, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = tone(.1); COUCH.slice(1, 9).forEach(p => x.fill(p));
  x.strokeStyle = cr(lineA); x.lineWidth = lw / k; x.lineJoin = 'round'; x.lineCap = 'round'; COUCH.forEach(p => x.stroke(p));
  x.restore();
}
function avatar(x, cx, cy, r) {
  x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.clip(); x.drawImage(IM_JOLLY, cx - r, cy - r, 2 * r, 2 * r); x.restore();
}
function text(x, s, X, Y, size, col, w = 500, align = 'left') { x.font = `${w} ${size}px Inter`; x.fillStyle = col; x.textAlign = align; x.textBaseline = 'alphabetic'; x.fillText(s, X, Y); }

/* ================= THE WORLD ================= */
const desk = mesh(new THREE.PlaneGeometry(60000, 60000).rotateX(-Math.PI / 2), M.desk, null, false, true);

/* ---- phones (true size) ---- */
const PHW = 71.5, PHL = 147.6, PHT = 8.25, SCW = 64.6, SCL = 140.4;
const PXA = 930, PXB = 680;   /* 250 mm apart: each phone's close-up holds one phone */   /* the desk sits front-right of the cloud, so moves between them never cross the credit corner */
const PCW = 600, PCH = Math.round(PCW * SCL / SCW);
const mmToPhone = (px, py, X) => new THREE.Vector3(X - SCW / 2 + px / PCW * SCW, PHT + .4, -SCL / 2 + py / PCH * SCL);
function phone(X) {
  const g = new THREE.Group(); g.position.set(X, 0, 0); scene.add(g);
  mesh(slab(PHW, PHL, PHT, 11.5, 1.7), M.ti, g);
  const gl = mesh(slab(PHW - 1.6, PHL - 1.6, .7, 10.8, .25), M.glass, g); gl.position.y = PHT - .45;
  [[-PHW / 2 - .5, -36, 14], [-PHW / 2 - .5, -14, 14], [PHW / 2 + .5, -22, 22]].forEach(([bx, bz, bl]) => {
    const b = mesh(new THREE.BoxGeometry(1.4, 3, bl), M.ti, g); b.position.set(bx, PHT / 2, bz);
  });
  const T = canvasTex(PCW, PCH);
  const scr = mesh(screenGeo(SCW, SCL, 8.8), screenMat(T), g, false, false); scr.position.y = PHT + .32;
  return { g, T, scr };
}
const pa = phone(PXA), pb = phone(PXB);

/* ---- the laptop: base, keyboard deck, a lid on its hinge ---- */
const LXc = 1182, LZc = -40, LBW = 313, LBD = 221, LBT = 15.6, LLD = 210, LLT = 6;
const lap = new THREE.Group(); lap.position.set(LXc, 0, LZc); scene.add(lap);
mesh(slab(LBW, LBD, LBT, 10, 1.6), M.alu, lap);
const deckT = canvasTex(1024, Math.round(1024 * LBD / LBW));
(() => {
  const x = deckT.x, W = deckT.c.width, H = deckT.c.height;
  x.fillStyle = tone(.16); x.fillRect(0, 0, W, H);
  x.fillStyle = tone(.045); x.fillRect(70, 30, W - 140, 390);
  for (let r = 0; r < 6; r++) for (let c = 0; c < 14; c++) {
    const kw = (W - 160) / 14; rrect(x, 80 + c * kw + 3, 40 + r * 62 + 3, kw - 6, 56, 6); x.fillStyle = tone(.085); x.fill();
  }
  rrect(x, W / 2 - 200, 450, 400, 240, 14); x.fillStyle = tone(.15); x.fill(); x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 3; x.stroke();
  deckT.t.needsUpdate = true;
})();
const deck = mesh(screenGeo(LBW - 6, LBD - 6, 8), new THREE.MeshStandardMaterial({ map: deckT.t, roughness: .55, metalness: .6 }), lap, false, true); deck.position.y = LBT + .05;
const hinge = new THREE.Group(); hinge.position.set(0, LBT, -LBD / 2 + 4); lap.add(hinge);
const lidG = slab(LBW, LLD, LLT, 10, 1.2); lidG.translate(0, 0, LLD / 2);   /* closed: it lies forward over the deck */
mesh(lidG, M.alu, hinge);
const lidT = canvasTex(1024, Math.round(1024 * (LLD - 16) / (LBW - 16)));
const lidScrG = screenGeo(LBW - 16, LLD - 16, 6); lidScrG.rotateX(Math.PI); lidScrG.translate(0, -.08, LLD / 2);
const lidBezel = mesh(new THREE.PlaneGeometry(LBW - 6, LLD - 6).rotateX(Math.PI / 2).translate(0, -.04, LLD / 2), M.glass, hinge, false, false);
const lidScr = mesh(lidScrG, screenMat(lidT), hinge, false, false);
/* the lid's screen: rotateX(PI) flips it to face -y; its canvas top sits at the hinge, so draw it flipped */

/* ---- the cloud plate, above and behind ---- */
const PLY = 330, PLT = 34, PFZ = -230;   /* the plate's top, thickness and front edge */
const plate = mesh(slab(3300, 940, PLT, 30, 5), M.plate, null, true, true); plate.position.set(-50, PLY - PLT, PFZ - 470);   /* x -1700..1600: the run left of the VM, email and apps right */
const edge = mesh(new THREE.BoxGeometry(1, 1.2, 1.6), M.cream, null, false, false);   /* an inlay along its front edge, drawn on "cloud" */
edge.position.set(-700, PLY + .2, PFZ - 1);

/* ---- Muse Secure VM ---- */
const VMX = 300, VMZ = PFZ - 330, VMW = 960, VMD = 540, VMT = 24, SVW = 930, SVD = 512;
const VCW = 2048, VCH = Math.round(VCW * SVD / SVW);
