<script>
const H = HERO, s = document.getElementById('s'); defs(s);
const PART = new URLSearchParams(location.search).get('part');
const LABS = PART === 'labs';                       // P09 (16 Oct): the reprise's finished Nebius stack, then the labs and everyone else
const REPRISE = PART === 'reprise' || LABS;
const K = LABS
  ? H.steps([['openai', 1.82], ['anthropic', 2.32], ['bare', 4.58], ['everyone', 8.88], ['startups', 10.14], ['enterprises', 10.96], ['labs', 12.0], ['whole', 14.44]], 16.7)
  : REPRISE
  ? H.steps([['nebius', 2.4], ['chips', 8.0], ['software', 8.8], ['team', 10.0], ['package', 11.2], ['space', 18.4]], 20.4)
  : H.steps([['hyper', 0.8], ['couldnt', 16.4], ['open', 18.0], ['chips', 19.4], ['land', 20.6], ['electricity', 21.0], ['build', 22.2],
      ['plug', 25.8], ['wait', 32.6], ['gap', 34.0], ['cland', 38.2], ['cpower', 39.0], ['cbuild', 39.6], ['cchips', 43.2], ['rent', 44.4],
      ['coreweave', 50.0], ['equal', 58.0], ['bare', 64.0], ['buyer', 69.2], ['platform', 84.0], ['software', 85.4], ['expertise', 86.2],
      ['websites', 9.14], ['databases', 10.02], ['storage', 10.78]], 91.2);   // appended 16 Oct (N6) at the full read's board times

/* ---------- the model, exactly as the approved frame draws it ---------- */
const ZL = { land: 0, power: 20, shell: 40, chips: 62, soft: 82, team: 96 };
const BLOCK = [-44, -16, 80, 62], PLOT = [-30, -2, 64, 48];
const V = fitView({ az: 34, elv: 19, world: [...BLOCK, ZL.team + 2, -10], rect: [560, 60, 1620, 1010] });
const GOLD = 'var(--gold)', DIM = 'rgba(245,241,229,.32)', CE = V.k * Math.cos(19 * Math.PI / 180);
const hall = [[2, 4], [58, 4], [58, 36], [2, 36]];
const W = el(s, 'g', { class: 'world' });               // the world: the camera moves this
/* the camera now goes close (about 2.3x on the platform, note 4): strokes keep their drawn weight on screen, as the frame E2 drew
   them (a technical drawing does not get heavier as you look closer); the hatch is re-scaled to match in the camera step */
el(s, 'style', {}, '.world * { vector-effect: non-scaling-stroke; }');
const flat = (g) => ({ add: (d, fn) => fn(g) });       // a plate drawn straight into a group

/* each layer: a group that rides its explode offset, holding a cream and a gold drawing that cross-fade */
function layer(name, draw) {
  const g = el(W, 'g'), c = el(g, 'g'), k = el(g, 'g');
  draw(c, false); draw(k, true);
  return { name, g, c, k };
}
const risers = el(W, 'g');
[[0, 0], [60, 0], [60, 40], [0, 40]].forEach(([x, y]) => line3(risers, V, [[x, y, ZL.land], [x, y, ZL.team]], { stroke: DIM, sw: 1, dash: '3 7' }));
let landInfo;
const Lland = layer('land', (g, gold) => { const r = dcTerrain(g, V, { block: BLOCK, plot: PLOT, depth: 10, z: ZL.land, gold }); if (!gold) landInfo = r; });
const Lpower = layer('power', (g, gold) => {
  dcModel(g, V, { show: ['line', 'substation'], feeders: false, z: { substation: ZL.power }, gold: gold ? ['power'] : [] });
  line3(g, V, [[-12, 10.5, ZL.power], [-4, 10.5, ZL.power], [-4, 2, ZL.power], [0, 2, ZL.power]], { stroke: gold ? GOLD : 'rgba(245,241,229,.6)', sw: 2, dash: '7 6' });
  plate(flat(g), V, [[0, 0], [60, 0], [60, 40], [0, 40]], ZL.power, { stroke: gold ? 'rgba(212,175,55,.5)' : DIM, sw: 1, dash: '4 6' });
});
const Lshell = layer('shell', (g, gold) => dcModel(g, V, { show: ['shell'], z: { shell: ZL.shell }, gold: gold ? ['building'] : [] }));
const Lchips = layer('chips', (g, gold) => dcModel(g, V, { show: ['racks', 'gallery', 'power', 'network'], gold: gold ? ['racks'] : [], z: { racks: ZL.chips } }));
const LAYERS = [Lland, Lpower, Lshell, Lchips];

/* the connection: from the substation's feeder end up to the hall's electrical gallery, drawn in the open between the layers */
const conn = el(W, 'g');
const connLine = line3(conn, V, [[0, 2, ZL.power], [0, 2, ZL.shell], [3, 1.7, ZL.shell]], { stroke: 'rgba(245,241,229,.8)', sw: 2.4 });
const connGold = line3(conn, V, [[0, 2, ZL.power], [0, 2, ZL.shell], [3, 1.7, ZL.shell]], { stroke: GOLD, sw: 2.6 });
const [sx0, sy0] = V.P(0, 2, ZL.power), [sx1, sy1] = V.P(0, 2, ZL.shell);
const stall = el(conn, 'line', { x1: sx0 - 12, x2: sx0 + 12, y1: 0, y2: 0, stroke: 'var(--cream)', 'stroke-width': 3 });

/* the platform (master v3 notes 4 and 9; the writer picked S1 and E2, 16 Oct).
   SOFTWARE (S1): the software layer drawn as a live console lying in its own plane, registered to the hardware under it: one cell
   over every four racks (its state), job lanes along the front with a moving "now" rule, the utilisation trace along the back,
   one rack group flagged. The software is a map of the machine; no words. Cells change state on their own clock (a console is
   live), flat fills only, nothing glows.
   EXPERTISE (E2): the plate hatched, and Nebius's own footage of its engineers in a window tied to it by a gold leader.
   REPRISE (N9a, "yes but they do ultimately provide all of it right?"): what Nebius sells drawn in Nebius's own colours, its lime on
   its navy (sf.js BRAND_COL), and on "space and power" the rest of the stack takes them too: the customer buys the whole stack
   from Nebius. No ownership claim on screen. */
const NEB = REPRISE, GR = NEB ? `rgba(${BRAND_COL.limeRGB},` : 'rgba(212,175,55,', PLATEF = NEB ? `rgba(${BRAND_COL.navyRGB},.96)` : 'rgba(10,10,15,.94)';
if (NEB) { s.style.setProperty('--gold', BRAND_COL.lime);
  s.querySelectorAll('#hatchGold rect, #hatchGoldFine rect').forEach(r => r.setAttribute('fill', BRAND_COL.lime)); }   // sf.js's gold hatches, in lime
const plat = el(W, 'g'), ghostP = el(plat, 'g'), soft = el(plat, 'g'), team = el(plat, 'g');
[ZL.soft, ZL.team].forEach(z => plate(flat(ghostP), V, hall, z, { stroke: 'rgba(245,241,229,.55)', sw: 2, dash: '10 8' }));
const hashF = (i) => { let h = (i + 1) * 2654435761 % 4294967296; h ^= h >>> 13; h = h * 1274126177 % 4294967296; return (h >>> 0) / 4294967296; };
const quad = (g, x0, y0, x1, y1, z, a) => el(g, 'polygon', { points: pts(V, [[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]]), ...a });
const CELLS = [];
let NOW = null, TRACE = null;
{
  const z = ZL.soft;
  plate(flat(soft), V, hall, z, { stroke: GOLD, sw: 2.4, fill: PLATEF });
  /* three panels, as a console lays them out: the trace (back), the fleet (middle), the job lanes (front) */
  [[3, 4.1, 53, 6.8], [3, 6.6, 53, 32.4], [3, 32.6, 53, 35.9]].forEach(([a, b, c, d]) => quad(soft, a, b, c, d, z, { fill: 'none', stroke: GR + '.5)', 'stroke-width': 1.2 }));
  /* the fleet: one cell over every four racks (2.4 m of row); its level is the group's state, re-read on its own clock */
  let i = 0;
  DC.pods.forEach((y0, p) => [y0, y0 + 2.4].forEach((yr, r) => { for (let x = 4; x < 52 - 1e-6; x += 2.4) {
    const flag = p === 2 && r === 1 && Math.abs(x - 32.8) < .1, idx = i++;
    const q = quad(soft, x + .18, yr + .12, x + 2.22, yr + 1.08, z, { fill: flag ? 'var(--bg)' : GR + '.16)', stroke: flag ? 'var(--cream)' : 'none', 'stroke-width': flag ? 2 : 0 });
    if (flag) {
      line3(soft, V, [[x + .18, yr + .12, z], [x + 2.22, yr + 1.08, z]], { stroke: 'var(--cream)', sw: 1.6 });
      line3(soft, V, [[x + 2.22, yr + .12, z], [x + .18, yr + 1.08, z]], { stroke: 'var(--cream)', sw: 1.6 });
      const [fx, fy] = V.P(x + 1.2, yr + .6, z); el(soft, 'circle', { cx: fx, cy: fy, r: 7 * V.k / 8, fill: 'none', stroke: 'var(--cream)', 'stroke-width': 2 });
    } else CELLS.push({ q, i: idx, per: 1.1 + hashF(idx + 900) * 1.9, ph: hashF(idx + 1300) * 3, last: '' });
  } }));
  /* the scheduler: four job lanes along the front strip, each job a bar from its start to its end; "now" a cream rule that runs */
  for (let l = 0; l < 4; l++) {
    let x = 4 + hashF(l + 50) * 3; const y = 32.9 + l * .75;
    line3(soft, V, [[4, y + .55, z], [52, y + .55, z]], { stroke: GR + '.22)', sw: 1 });
    while (x < 51) { const w = 3 + hashF(Math.round(x * 7) + l * 31) * 11, e = Math.min(52, x + w); quad(soft, x, y, e, y + .5, z, { fill: GR + '.88)' }); x = e + .5 + hashF(Math.round(x * 3) + l) * 1.6; }
  }
  const P0 = V.P(40, 32.6, z), P1 = V.P(40, 35.9, z);
  NOW = el(soft, 'line', { x1: P0[0], y1: P0[1], x2: P1[0], y2: P1[1], stroke: 'var(--cream)', 'stroke-width': 2 });
  /* utilisation along the back strip: a trace over the same x as the fleet below it; the dip is the flagged group */
  for (let gx = 4; gx <= 52; gx += 4) line3(soft, V, [[gx, 4.3, z], [gx, 6.6, z]], { stroke: GR + '.22)', sw: 1 });
  const tr = []; for (let k = 0; k <= 96; k++) { const x = 4 + k * .5, v = .78 + .12 * Math.sin(k / 6.3) + .06 * Math.sin(k / 2.1) - (k > 56 && k < 62 ? .32 : 0); tr.push([x, 6.6 - v * 2.2, z]); }
  TRACE = el(soft, 'g'); line3(TRACE, V, tr, { stroke: GOLD, sw: 2 });
}
/* expertise. Main board: the plate hatched (the frame E2's base); the people are the footage in the window. Reprise ("the team",
   N9a as approved): the crew at true scale in the aisles over the rows they run, architectural 1.8 m figures drawn flat in
   Nebius's lime on its navy; nobody real is depicted and the figures are not a headcount. */
/* a scale figure, 1.8 m, standing at (x, y) on plane z: an architect's entourage silhouette (flat, upright, true height) */
const BODY = 'M-.03,-.85 L-.1,-.828 Q-.132,-.815 -.136,-.775 L-.146,-.53 Q-.146,-.505 -.128,-.505 Q-.114,-.507 -.115,-.53 L-.108,-.71 L-.096,-.6 L-.088,-.5 L-.068,-.03 Q-.07,0 -.04,0 L-.026,0 Q-.016,-.01 -.018,-.03 L-.006,-.42 L.006,-.42 L.018,-.03 Q.016,-.01 .026,0 L.04,0 Q.07,0 .068,-.03 L.088,-.5 L.096,-.6 L.108,-.71 L.115,-.53 Q.114,-.507 .128,-.505 Q.146,-.505 .146,-.53 L.136,-.775 Q.132,-.815 .1,-.828 L.03,-.85 Z';
const WALK = 'M-.03,-.85 L-.1,-.828 Q-.132,-.815 -.14,-.775 L-.175,-.56 Q-.18,-.535 -.162,-.53 Q-.146,-.53 -.142,-.55 L-.11,-.71 L-.096,-.6 L-.09,-.5 L-.15,-.05 Q-.158,-.01 -.12,0 L-.1,0 Q-.088,-.01 -.084,-.04 L-.004,-.4 L.004,-.4 L.07,-.04 Q.076,-.008 .1,0 L.13,0 Q.15,-.015 .13,-.05 L.09,-.5 L.096,-.6 L.11,-.71 L.14,-.56 Q.146,-.535 .164,-.538 Q.18,-.545 .176,-.57 L.136,-.775 Q.132,-.815 .1,-.828 L.03,-.85 Z';
function person(g, x, y, z, pose, col) {
  const [fx, fy] = V.P(x, y, z), H = 1.8 * V.k * Math.cos(19 * Math.PI / 180);
  const q = el(g, 'g', { transform: `translate(${fx.toFixed(1)},${fy.toFixed(1)}) scale(${H.toFixed(3)})`, fill: col });
  el(q, 'path', { d: pose === 'walk' ? WALK : BODY });
  el(q, 'ellipse', { cx: 0, cy: -.918, rx: .056, ry: .066 });
  if (pose === 'tray') { el(q, 'path', { d: 'M.1,-.74 L.26,-.64 L.25,-.615 L.09,-.69 Z' }); el(q, 'rect', { x: .2, y: -.665, width: .34, height: .05, fill: 'var(--bg)', stroke: col, 'stroke-width': .016 }); }
  if (pose === 'point') el(q, 'path', { d: 'M.1,-.8 L.3,-.86 L.305,-.835 L.105,-.76 Z' });
}
if (!REPRISE) plate(flat(team), V, hall, ZL.team, { stroke: GOLD, sw: 2.4, fill: 'url(#hatchGold)' });
else {
  const z = ZL.team;
  plate(flat(team), V, hall, z, { stroke: GOLD, sw: 2.4, fill: PLATEF });
  /* the rows they run, as footprints on the plane (the chips layer's own rows, in register) */
  DC.pods.forEach(y0 => [y0, y0 + 2.4].forEach(yr => quad(team, 4, yr, 52, yr + 1.2, z, { fill: 'none', stroke: GR + '.42)', 'stroke-width': 1.2 })));
  /* the crew in the aisles, at true scale; painter's order, far to near */
  const crew = [];
  DC.pods.forEach((y0, p) => { const n = 3 + (p % 2); for (let k = 0; k < n; k++) crew.push([8 + (k + hashF(p * 9 + k) * .7) * (42 / n), y0 + 1.8, ['stand', 'walk', 'point', 'tray'][(p + k) % 4]]); });
  [[2.8, 20, 'walk'], [55.5, 12, 'stand'], [55.5, 26, 'point'], [30, 34.2, 'walk'], [18, 34.2, 'stand']].forEach(c => crew.push(c));
  crew.sort((a, b) => V.depth(a[0], a[1]) - V.depth(b[0], b[1])).forEach(([x, y, pose]) => person(team, x, y, z, pose, GOLD));
}
/* the console is live from the moment it lands: each cell re-reads its state on its own period (a step, never a fade), and the
   "now" rule runs along the lanes at a constant rate */
function consoleLive(t0) {
  H.on((t) => {
    const u = t - t0;
    CELLS.forEach(c => { const st = u < 0 ? 0 : Math.floor((u + c.ph) / c.per), v = hashF(c.i * 37 + st * 101);
      const f = v < .14 ? GR + '.16)' : GR + (.55 + .4 * hashF(c.i + 400 + st * 7)).toFixed(2) + ')';
      if (f !== c.last) { c.q.setAttribute('fill', f); c.last = f; } });
    const nx = 36 + Math.max(0, u) * .9, A = V.P(nx, 32.6, ZL.soft), B = V.P(nx, 35.9, ZL.soft);
    NOW.setAttribute('x1', A[0].toFixed(1)); NOW.setAttribute('y1', A[1].toFixed(1)); NOW.setAttribute('x2', B[0].toFixed(1)); NOW.setAttribute('y2', B[1].toFixed(1));
  });
}

/* the dial beside the building: it runs while the building goes up, and keeps running while the hall waits for the grid */
const DX = 1478, DY = 560, DR = 34, dial = el(W, 'g');
el(dial, 'circle', { cx: DX, cy: DY, r: DR, fill: 'var(--bg)', stroke: 'var(--cream)', 'stroke-width': 2.4 });
for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; el(dial, 'line', { x1: DX + Math.sin(a) * (DR - 9), y1: DY - Math.cos(a) * (DR - 9), x2: DX + Math.sin(a) * (DR - 3), y2: DY - Math.cos(a) * (DR - 3), stroke: 'rgba(245,241,229,.6)', 'stroke-width': 1.6 }); }
const hand = el(dial, 'line', { x1: DX, y1: DY, x2: DX, y2: DY - DR + 8, stroke: GOLD, 'stroke-width': 3, 'stroke-linecap': 'round' });
el(dial, 'circle', { cx: DX, cy: DY, r: 3.5, fill: GOLD });

/* rent: the computing power leaves the hall for the customers (a line, drawn once; it does not flow) */
const [rx, ry] = V.P(58, 20, ZL.chips + 1.2), rentG = el(W, 'g');
el(rentG, 'path', { d: `M${rx + 18},${ry} H1840`, stroke: GOLD, 'stroke-width': 3, fill: 'none' });
el(rentG, 'path', { d: `M1822,${ry - 12} L1840,${ry} L1822,${ry + 12}`, stroke: GOLD, 'stroke-width': 3, fill: 'none' });

/* ---------- labels (screen space; each leader's end and its word follow the camera, so the camera can move while they show) ---------- */
const LX = 96, labs = {};
let CAM = [960, 540, 1];                                  // the camera this frame: centre x, y and scale (set below)
const toScreen = ([x, y]) => [960 + CAM[2] * (x - CAM[0]), 540 + CAM[2] * (y - CAM[1])];
function lab(key, txt, [x, y, z]) {
  const [px, py] = V.P(x, y, z), g = el(s, 'g');

  const BC = [BF[0] + 500, bsy - 50];
  H.on((t) => { const u = sm(t, K.bare + .02, 1), v = 1 - u;
    const cx = v * v * bsx + 2 * u * v * BC[0] + u * u * BF[0], cy = v * v * bsy + 2 * u * v * BC[1] + u * u * BF[1], sc = H.mix(SC, BS, u);
    bare.setAttribute('transform', `translate(${cx.toFixed(2)},${cy.toFixed(2)}) scale(${sc.toFixed(4)}) translate(${(-bcx).toFixed(2)},${(-bcy).toFixed(2)})`);
    const o = H.go(u, 0, .12); bare.setAttribute('opacity', o.toFixed(3)); bare.style.display = o < .002 ? 'none' : ''; });
  /* the customers (Ive, 16 Oct): a tile is a small console window (title bar, three short lines), one drawing in every row, cream
     at .7 with 1.6 px lines; a row differs only by its count (startups 6, enterprises 4, research labs 3). The rows share a left
     edge and one column grid, so they step in on the right and leave a clear lane under each row: each row's connector leaves the
     underside of its own tile (labs left, enterprises centre, startups right, one column apart), falls through open space and
     lands on the top plate with its dot; no line crosses a tile. */
  const TW = 78, TH = 58, PITCH = 100, LANE = [1530, 1430, 1330], ROWY = [96, 188, 280], CL = 'rgba(245,241,229,.7)';
  const TX0 = LANE[2] - 2 * PITCH - TW / 2;                            // labs' third tile sits on the left lane; the lanes land on the plate
  const plateMid = (X) => { const P = [[2, 4], [58, 4], [58, 36], [2, 36]].map(([x, y]) => toScreen(V.P(x, y, ZL.team))), ys = [];   // the plate's depth at X: the dot sits halfway in
    P.forEach((a, i) => { const b = P[(i + 1) % 4]; if ((a[0] - X) * (b[0] - X) <= 0 && a[0] !== b[0]) ys.push(a[1] + (b[1] - a[1]) * (X - a[0]) / (b[0] - a[0])); });
    return (Math.min(...ys) + Math.max(...ys)) / 2; };
  function consoleTile(p, x, y) {
    el(p, 'rect', { x, y, width: TW, height: TH, fill: 'rgba(245,241,229,.05)', stroke: CL, 'stroke-width': 1.6 });
    el(p, 'line', { x1: x, x2: x + TW, y1: y + 13, y2: y + 13, stroke: CL, 'stroke-width': 1.6 });
    [[24, 34], [35, 50], [46, 22]].forEach(([dy, w]) => el(p, 'line', { x1: x + 10, x2: x + 10 + w, y1: y + dy, y2: y + dy, stroke: CL, 'stroke-width': 1.6 }));
  }
  [['startups', K.startups, 6, 4], ['enterprises', K.enterprises, 4, 3], ['research labs', K.labs, 3, 2]].forEach(([word, at, n, src], r) => {
    const y = ROWY[r], g = el(s, 'g');
    const lab = el(g, 'text', { x: TX0 - 30, y: y + TH / 2 + 12, class: 'nm', 'font-size': 36, 'text-anchor': 'end' }, word);
    H.rise(lab, at, .5, 14);
    for (let i = 0; i < n; i++) {
      const t = el(g, 'g'); consoleTile(t, TX0 + i * PITCH, y);
      H.path(t, [[at + i * .07, 0, -34, 0], [at + i * .07 + .45, 0, 0, 1]], H.ease.out);
    }
    /* the connector: from its own tile's underside, once that tile has landed, straight down its lane to the top plate */
    const cx = LANE[r], ly = plateMid(cx), c0 = at + src * .07 + .45;
    const ln = el(g, 'line', { x1: cx, x2: cx, y1: y + TH, y2: ly, stroke: 'var(--cream)', 'stroke-width': 2.4 }), dt = el(g, 'circle', { cx, cy: ly, r: 5.5, fill: 'var(--cream)' });
    H.draw(ln, c0, .35); H.fade(dt, c0 + .3, .2);
  });
} else {
  /* ---------- the reprise: the stack as H3 left it, unlit; the three Nebius sells light on their words ---------- */
  LAYERS.forEach(L => { L.k.setAttribute('opacity', 0); });
  [dial, rentG, stall, connGold].forEach(n => n.style.display = 'none');
  H.on((t) => { const g = H.go(t, K.chips - .1, K.chips + .4); Lchips.c.setAttribute('opacity', 1 - g); Lchips.k.setAttribute('opacity', g); });
  ['land', 'grid', 'electricity', 'chips', 'software', 'expertise'].forEach(k => H.rise(labs[k].tx, 0, .01));
  H.show(ghostP, 0, .01, K.team + .4, .4);
  H.wipe(soft, K.software - .2, .8, 'x'); H.wipe(team, K.team - .2, .8, 'x'); consoleLive(K.software + .4);
  labGold('chips', (t) => H.go(t, K.chips, K.chips + .1)); labGold('software', (t) => H.go(t, K.software, K.software + .1)); labGold('expertise', (t) => H.go(t, K.team, K.team + .1));
  nebius(s, 96, 96, 72); H.rise(s.lastChild, K.nebius - .2);
  const pk = bracket(yAt(ZL.team, 0) - 6, yAt(ZL.chips + 3, 0) + 30, '', true);
  H.draw(pk.p, K.package - .1, .8);
  /* "space and power" (N9a; the writer: "they do ultimately provide all of it"): the rest of the stack takes Nebius's colours too, so
     the customer is seen buying the whole stack from Nebius; nothing on screen claims who owns the sites */
  const sp = (t) => H.go(t, K.space - .2, K.space + .6);
  /* until then they step back while what Nebius sells lights (as before) */
  [Lland, Lpower, Lshell].forEach(L => H.on((t) => { const u = sp(t), back = .45 * H.go(t, K.chips, K.chips + .6);
    L.c.setAttribute('opacity', ((1 - back) * (1 - u)).toFixed(3)); L.k.setAttribute('opacity', u.toFixed(3)); }));
  ['land', 'electricity', 'grid'].forEach(k => labGold(k, sp));
}

H.run();
</script>
