     nebius_share_price_close_15_october_2026, nebius_share_price_daily_sep_oct_2026, nebius_prepayment_build_cover_pct (lo/hi), nebius_share_price_daily_from_relisting.

<script>
const H = HERO, s = document.getElementById('s'); defs(s);
const K = H.steps([['pillars', 2.2], ['chips', 4.6], ['twelve', 5.2], ['rubin', 8.2], ['early', 11.0], ['hiccup', 13.8],
  ['trendforce', 15.8], ['slipped', 18.2], ['memory', 20.6], ['docs', 22.8], ['received', 27.4], ['track', 31.4], ['semi', 32.4],
  ['back', 38.8], ['servers', 41.6], ['five', 43.4], ['paper', 46.0], ['burry', 53.2], ['back2', 58.4], ['older', 59.2],
  ['rose', 64.6], ['thirty', 65.6], ['financing', 69.0], ['holds', 73.2], ['convert', 77.4], ['eighty', 79.4], ['upfront', 84.6],
  ['answers', 93.2], ['prepay', 94.6], ['half', 95.6],
  /* back half P01 (16 Oct), appended so the job's ?at= (the 30 above) still lines up; defaults are the VO words' board times */
  ['crack', 50.15], ['falls', 77.67]], 107.2);

const GOLD = 'var(--gold)', CR = 'var(--cream)', DIMC = 'rgba(245,241,229,.5)', AXC = 'rgba(245,241,229,.4)';
const firm = U('meta_nebius_contract_mar_2026_firm'); U('trendforce_rubin_ramp_delayed_2027_september_2026');
const life = F('nebius_server_useful_life_change_2026'); U('nebius_server_useful_life_change_2026');
const older = U('nebius_older_gpu_pricing_change_q2_2026');
const conv = U('nebius_notes_conversion_price_march_2026'), now = F('nebius_share_price_close_15_october_2026'); U('nebius_share_price_close_15_october_2026');   // Goldman's call (v6): the recording's close
const cover = F('nebius_prepayment_build_cover_pct'); U('nebius_prepayment_build_cover_pct'); U('nebius_share_price_daily_from_relisting');
const COL = [[96, 720], [800, 1224], [1304, 1824]], HY = 112;

/* receipt cards (bw overlay) and the bulls' documents (full-frame cuts over the running board) */
H.card('b114', K.trendforce - .2, K.docs, { x: 800, y: 160, w: 1056, h: 700 }, 'TrendForce, 21 Sep 2026: Rubin\'s ramp slipping into 2027');
H.card('b115', K.docs, K.semi, { x: 0, y: 0, w: 1920, h: 1080 }, 'Nebius, Q2 2026: first Vera Rubin systems received, the Meta build on track (full frame)');
H.card('b116', K.semi, K.back, { x: 0, y: 0, w: 1920, h: 1080 }, 'SemiAnalysis: providers expect Vera Rubin earlier than planned (full frame)');
H.card('b118', K.burry, K.back2, { x: 0, y: 0, w: 1920, h: 1080 }, 'Michael Burry\'s post on AI depreciation, Nov 2025 (full frame)');
H.card('b121', K.eighty - .4, K.upfront - .4, { x: 1296, y: 560, w: 560, h: 380 }, 'Nebius 6-K, 17 Mar 2026: the notes\' conversion price');

/* ---- the three columns: dividers from frame 0, the writer's three words land in turn ---- */
const heads = ['chips', 'accounting', 'financing'].map((w, i) => {
  if (i) el(s, 'line', { x1: COL[i][0] - 44, x2: COL[i][0] - 44, y1: 70, y2: 950, stroke: 'rgba(245,241,229,.14)', 'stroke-width': 2 });
  const n = el(s, 'text', { x: COL[i][0], y: HY, class: 'nm', 'font-size': 44 }, w);
  H.rise(n, K.pillars + i * .4);
  return n;
});
/* a column's word turns gold when its answer lights (a flat fill change) */
const lightAt = [K.answers, K.answers + .5, K.half + .4];
const mixC = (u) => `rgba(${[245 + (212 - 245) * u, 241 + (175 - 241) * u, 229 + (55 - 229) * u].map(Math.round).join(',')},1)`;
H.on((t) => heads.forEach((n, i) => n.style.fill = mixC(H.go(t, lightAt[i], lightAt[i] + .5))));
/* each column word stands dim (a third) from "three core pillars" and comes to full on its own word (facts and words, v6):
   chips on "chips", accounting on "accounting" (the voice's 40.07, 1.4 s after "The second"), financing on "financing" */
const wordAt = [K.chips, K.back + 1.4, K.financing + .2];
H.on((t) => heads.forEach((n, i) => n.setAttribute('opacity', (.34 + .66 * H.go(t, wordAt[i] - .1, wordAt[i] + .35)).toFixed(3))));
/* the claims step back as their column's answer lights */
const claims = [el(s, 'g'), el(s, 'g'), el(s, 'g')];
H.on((t) => claims.forEach((g, i) => g.setAttribute('opacity', (1 - .55 * H.go(t, lightAt[i], lightAt[i] + .6)).toFixed(3))));

/* ---------- chips ---------- */
{ const [x0, x1] = COL[0];
  const PV = fitView({ az: 30, elv: 40, world: [-42, -46, 42, 46, 3.4], rect: [x0, 150, x1 - 10, 520] });
  /* the package assembles: rebuilt per frame while its parts settle (interposer, then dies, then the stacks) */
  const EX = { interposer: 8, dies: 24, hbm: 24 };
  const live = el(s, 'g'); let last = '';
  H.on((t) => {
    const a = 1 - H.go(t, K.chips, K.chips + .8, H.ease.out), b = 1 - H.go(t, K.chips + .35, K.chips + 1.25, H.ease.out),
      c = 1 - H.go(t, K.chips + .7, K.chips + 1.7, H.ease.out);
    const lift = { interposer: +(EX.interposer * a).toFixed(2), dies: +(EX.dies * b).toFixed(2), hbm: +(EX.hbm * c).toFixed(2) };
    const key = JSON.stringify(lift); if (key === last) return; last = key;
    live.replaceChildren(); rubinPackage(live, PV, { lift });
  });
  /* the claim: the eight stacks take the cream hatch; the answer: the dies light gold; at the end the hatch steps back */
  const pHatch = rubinPackage(s, PV, { hbmFill: 'url(#hatch)' }).g;
  const pGold = rubinPackage(s, PV, { gold: ['dies'] }).g;
  const pBoth = rubinPackage(s, PV, { gold: ['dies'], hbmFill: 'url(#hatch)' }).g;
  H.on((t) => {
    const h = H.go(t, K.memory, K.memory + .6), g = H.go(t, K.back + .3, K.back + .8)   /* Ive: the answer lights when the board returns from the full-frame documents, so it is seen */, back = H.go(t, K.answers, K.answers + .6);
    const set = (n, o) => { n.setAttribute('opacity', o.toFixed(3)); n.style.display = o < .002 ? 'none' : ''; };
    set(pHatch, h * (1 - g));            // hatch over plain, until the dies light
    set(pGold, g >= 1 ? 1 : 0);          // gold dies, plain stacks: under the next, once the dies are lit
    set(pBoth, g * (h >= 1 ? 1 : h) * (1 - .55 * back));
  });
  H.rise(el(s, 'text', { x: x0, y: 560, class: 'nm', 'font-size': 36, style: 'fill:var(--gold)' }, 'Vera Rubin'), K.rubin);
  { const nm = el(s, 'g'); logo(nm, 'nvidia', x0 + 196, 520, 56); H.rise(nm, K.rubin + .15); }   // E5: Nvidia's own mark on its package

  /* the contract on a true time scale */
  const tx = lin(t('2026-01-01'), t('2032-01-01'), x0, x1), AY = 860;
  const ax = el(s, 'g');
  el(ax, 'line', { x1: x0, x2: x1, y1: AY, y2: AY, stroke: AXC, 'stroke-width': 2 });
  H.draw(ax.firstChild, K.twelve, .7);
  for (let y = 2026; y <= 2032; y++) {
    const g = el(ax, 'g');
    el(g, 'line', { x1: tx(Date.UTC(y, 0, 1)), x2: tx(Date.UTC(y, 0, 1)), y1: AY, y2: AY + 14, stroke: AXC, 'stroke-width': 2 });
    if (y < 2032) el(g, 'text', { x: tx(Date.UTC(y, 6, 1)), y: AY + 46, class: 'ax', 'font-size': 28, 'text-anchor': 'middle' }, String(y));
    H.fade(g, K.twelve + .1 + (y - 2026) * .07, .35);
  }
  // Meta's firm block: five years from early 2027, in Meta's blue
  U('meta_nebius_dedicated_start_2027');                         // the tranche start, "early 2027" (16 Mar 2026 6-K; Davinci 16 Oct)
  const S27 = F('meta_nebius_dedicated_start_2027').asOf, bx = tx(t(S27)), bw = tx(t(String(+S27.slice(0, 4) + 5) + S27.slice(4))) - bx, BH = 92;
  /* E5 (16 Oct): Meta's block lands in Meta's own blue with its mark (an accent where the board is about Meta, as on H6), and
     stays so (below) */
  const blk = el(s, 'rect', { x: bx, y: AY - BH, width: bw, height: BH, fill: BRAND_COL.meta });
  H.grow(blk, K.twelve + .35, .9, bx, 0, 'x');
  const MB = BRAND_COL.metaRGB.split(',').map(Number);
  /* Meta's block stays Meta's blue throughout (the coordinator's brand rule, 16 Oct: company colour fills only the blocks the voice
     ties to that company); "on track" is carried by the dies lighting gold above it */
  { const mm = el(s, 'g'); logo(mm, 'meta', bx + bw - 34 * LOGO.meta[1] - 4, AY - BH - 58, 34); H.rise(mm, K.twelve + .6); }
  const seams = el(s, 'g');
  for (let k = 1; k < 5; k++) el(seams, 'line', { x1: bx + k * bw / 5, x2: bx + k * bw / 5, y1: AY - BH, y2: AY, stroke: 'var(--bg)', 'stroke-width': 3 });
  H.fade(seams, K.twelve + 1.1, .4);
  H.rise(el(s, 'text', { x: bx + 18, y: AY - BH - 22, class: 'fh', 'font-size': 64 }, fmt.usdB(firm, 0)), K.twelve + .5);

  // the claim: the ramp slipping from mid-2026 to the contract's first edge
  const cy = AY - BH - 96, sx = tx(t('2026-07-01'));
  const edge = el(claims[0], 'line', { x1: bx, x2: bx, y1: cy - 14, y2: AY - BH, stroke: CR, 'stroke-width': 2, 'stroke-dasharray': '4 6' });
  H.fade(edge, K.early - .2, .5);
  H.draw(el(claims[0], 'line', { x1: sx, x2: sx, y1: cy - 14, y2: cy + 14, stroke: CR, 'stroke-width': 3 }), K.hiccup, .4);
  H.rise(el(claims[0], 'text', { x: x0, y: cy - 30, class: 'nd', 'font-size': 32 }, 'TrendForce'), K.trendforce);
  const slip = el(claims[0], 'path', { d: `M${sx},${cy} H${bx - 4}`, stroke: CR, 'stroke-width': 3, 'stroke-dasharray': '8 6', fill: 'none' });
  H.wipe(slip, K.slipped, 1.0, 'x');
  H.draw(el(claims[0], 'path', { d: `M${bx - 18},${cy - 12} L${bx - 4},${cy} L${bx - 18},${cy + 12}`, stroke: CR, 'stroke-width': 2.4, fill: 'none' }), K.slipped + .9, .35);
}

/* ---------- accounting: one server's cost as a pillar of years (back half P01, 16 Oct; the writer: "improve the accounting and
   financing pillars a bit more. the chips one just looks so much better") ----------
   Drawn in the chips column's own projection (iso.js, az 30, elv 40), so the three columns read as one set of drawings.
   The server is the plinth; standing on it, the server's cost as a solid of fixed volume: its height is the useful life (one
   block a year), its width the charge each year takes. "Five years instead of four" is literal: a fifth block slides in, the
   pillar stretches taller and thinner by exactly 4/5 (the same cost, a smaller charge a year), and the old four-year outline
   stays behind, dashed. The sliver between them on the first year is the charge that "went away": it reads as profit "on
   paper" (a tint with a dashed edge, the house mark for not-real). On "obsolete faster than that" a hairline crack runs up
   the stretched pillar (the claim); it is there when the board returns from Burry's post. Nothing is printed but the two
   lives (the key's lo and hi) and "years". */
{ const [x0, x1] = COL[1], n4 = life.lo, n5 = life.hi, C = claims[1];
  const W4 = 3.0, D = 2.4, YH = 1.5, ZB = 1.2;                    // pillar footprint at four years; a year's height; the plinth's top
  const W5 = W4 * n4 / n5;
  const PV = fitView({ az: 30, elv: 40, world: [-1.4, -.5, W4 + .5, D + .5, ZB + n5 * YH + .2], rect: [x0 + 40, 168, x1 - 20, 640] });
  const ZT = (n) => ZB + n * YH;
  /* the plinth, one server (front: drive bays, a vent strip; side: the vent grille), in place from the board's return */
  const plinth = el(C, 'g');
  { const S = scene();
    box(S, PV, -.3, -.3, 0, W4 + .6, D + .6, ZB, { stroke: LINE, sw: 1.8, detail: (g, V) => {
      const fy = D + .3;                                            // the +y (front) face
      for (let k = 0; k < 6; k++) { const a = -.1 + k * .52;
        el(g, 'polygon', { points: pts(V, [[a, fy, .25], [a + .4, fy, .25], [a + .4, fy, .95], [a, fy, .95]]), fill: 'none', stroke: THIN, 'stroke-width': 1 }); }
      faceX(g, V, W4 + .3, -.3, 0, D + .6, ZB, .22, [], { stroke: THIN, sw: .9 });
    } });
    S.paint(plinth); }
  H.fade(plinth, K.servers - .3, .5);

  /* the pillar, rebuilt per frame while it stretches: n4 whole years, then the fifth sliding in (its height 0 to a year) while
     the width falls to keep the volume; the first year's charge filled */
  const live = el(C, 'g'); let last = '';
  function pillar(g, w, n, st = {}) {
    const S = scene();
    for (let k = 0; k < Math.ceil(n - 1e-6); k++) {
      const h = Math.min(1, n - k) * YH; if (h <= .001) continue;
      box(S, PV, 0, 0, ZB + k * YH, w, D, h, { stroke: st.stroke || LINE, sw: 1.8, fill: k === 0 ? (st.first || 'rgba(245,241,229,.82)') : INK, bias: k * 1e-3 });
    }
    S.paint(g);
  }
  H.on((t) => {
    const show = H.go(t, K.servers, K.servers + .5, H.ease.out);
    const u = H.go(t, K.five, K.five + 1.5, H.ease.io);           // "five years instead of four"
    const n = n4 + u, w = W4 * n4 / n, grow = H.go(t, K.servers + .1, K.servers + 1.0, H.ease.out);
    const key = [show.toFixed(3), n.toFixed(4), grow.toFixed(3)].join(); if (key === last) return; last = key;
    live.replaceChildren(); live.setAttribute('opacity', show.toFixed(3)); live.style.display = show < .002 ? 'none' : '';
    if (show > 0) pillar(live, w, Math.max(.001, n4 * grow + (n - n4)));
  });
  /* the dimension: the pillar's height in years, on its left; the figure turns from four to five as it stretches */
  const P = (x, y, z) => PV.P(x, y, z), dx = -.7;
  const dimG = el(C, 'g');
  const [ax, ay] = P(dx, D, ZB);
  const dl = el(dimG, 'line', { x1: ax, x2: ax, y1: ay, y2: ay, stroke: 'rgba(245,241,229,.55)', 'stroke-width': 2 });
  const t0 = el(dimG, 'line', { x1: ax - 9, x2: ax + 9, y1: ay, y2: ay, stroke: 'rgba(245,241,229,.55)', 'stroke-width': 2 });
  const t1 = el(dimG, 'line', { stroke: 'rgba(245,241,229,.55)', 'stroke-width': 2 });
  const f4 = el(dimG, 'text', { class: 'fn', 'font-size': 44, 'text-anchor': 'end' }, String(n4));
  const f5 = el(dimG, 'text', { class: 'fn', 'font-size': 44, 'text-anchor': 'end' }, String(n5));
  const yrs = el(dimG, 'text', { class: 'nd', 'font-size': 30, 'text-anchor': 'end' }, 'years');
  H.on((t) => {
    const grow = H.go(t, K.servers + .1, K.servers + 1.0, H.ease.out), u = H.go(t, K.five, K.five + 1.5, H.ease.io);
    const [, by] = P(dx, D, ZT(n4 * grow + u)), mid = (ay + by) / 2;
    dl.setAttribute('y2', by.toFixed(1)); t1.setAttribute('x1', ax - 9); t1.setAttribute('x2', ax + 9); t1.setAttribute('y1', by.toFixed(1)); t1.setAttribute('y2', by.toFixed(1));
    [f4, f5].forEach(n => { n.setAttribute('x', ax - 16); n.setAttribute('y', (mid + 8).toFixed(1)); });
    yrs.setAttribute('x', ax - 16); yrs.setAttribute('y', (mid + 44).toFixed(1));
    const sw = H.go(t, K.five + .5, K.five + 1.0);
    f4.setAttribute('opacity', (H.go(t, K.servers + .5, K.servers + .9) * (1 - sw)).toFixed(3));
    f5.setAttribute('opacity', sw.toFixed(3));
    yrs.setAttribute('opacity', H.go(t, K.servers + .7, K.servers + 1.1).toFixed(3));
    dimG.style.display = grow <= 0 ? 'none' : '';
  });

  /* "on paper": the four-year outline left behind, dashed, and the first year's charge that went away, a tint with a dashed edge */
  const ghost = el(C, 'g');
  { const S = scene(); box(S, PV, 0, 0, ZB, W4, D, n4 * YH, { stroke: 'rgba(245,241,229,.55)', sw: 1.6, fill: 'none' }); S.paint(ghost);
    ghost.querySelectorAll('polygon').forEach(p => { p.setAttribute('stroke-dasharray', '6 6'); p.setAttribute('fill', 'none'); }); }
  H.fade(ghost, K.paper - .3, .5);
  const sliver = el(C, 'g');
  { const S = scene(); box(S, PV, W5, 0, ZB, W4 - W5, D, YH, { stroke: 'rgba(245,241,229,.75)', sw: 1.6, fill: 'rgba(245,241,229,.12)' }); S.paint(sliver);
    sliver.querySelectorAll('polygon').forEach(p => p.setAttribute('stroke-dasharray', '7 5')); }
  H.fade(sliver, K.paper + .1, .5);

  /* the claim's crack: a hairline up the stretched pillar's front face, from the plinth to most of its height, drawn on
     "obsolete faster than that ... overstated" (a gap in the face: an ink underlay, a cream line on it) */
  { const pts3 = [], N = 9;
    /* an irregular hairline, not a zigzag: small lateral steps of uneven length (fixed, so every render draws the same crack) */
    const OFF = [0, .035, -.02, .05, .01, -.04, .025, -.015, .045, -.03, .02, -.05, .01, .04, -.02, .03, 0, -.035, .015];
    const ZS = [0, .05, .11, .15, .22, .27, .31, .38, .42, .47, .53, .58, .62, .68, .73, .79, .84, .9, 1];
    for (let i = 0; i < OFF.length; i++) pts3.push([W5 * (.48 + OFF[i] + .06 * ZS[i]), D, ZB + .1 + n5 * YH * .74 * ZS[i]]);
    const cg = el(C, 'g');
    line3(cg, PV, pts3, { stroke: 'var(--bg)', sw: 4.5 });
    line3(cg, PV, pts3, { stroke: CR, sw: 1.6 });
    H.draw(cg, K.crack, 2.4, H.ease.out); }

  // the answer: older GPUs, Q2 against Q1, as an index
  const BY = 900, bh = 150, bq = bh * (1 + older / 100);
  H.draw(el(s, 'line', { x1: x0 - 10, x2: x0 + 290, y1: BY, y2: BY, stroke: AXC, 'stroke-width': 2 }), K.older - .2, .5);
  H.grow(el(s, 'rect', { x: x0, y: BY - bh, width: 120, height: bh, fill: 'none', stroke: GOLD, 'stroke-width': 2.4 }), K.older + .2, .7, 0, BY, 'y');
  H.rise(el(s, 'text', { x: x0 + 60, y: BY + 44, class: 'nd', 'font-size': 30, 'text-anchor': 'middle' }, 'Q1'), K.older + .3);
  H.rise(el(s, 'text', { x: x0 + 220, y: BY + 44, class: 'nd', 'font-size': 30, 'text-anchor': 'middle' }, 'Q2'), K.rose - .3);
  /* "more than 30%" is a floor (facts, 16 Oct): solid to 30%, its top left open above, a dashed cream floor at 30%, as H6's $40B+ */
  { const qg = el(s, 'g');
    /* E4: the open top above the floor, a tint with dashed sides and no lid (was hatched) */
    el(qg, 'rect', { x: x0 + 160, y: BY - bq - 34, width: 120, height: 34, fill: 'rgba(212,175,55,.3)' });
    el(qg, 'path', { d: `M${x0 + 161.2},${BY - bq - 34} V${BY - bq} M${x0 + 278.8},${BY - bq - 34} V${BY - bq}`, fill: 'none', stroke: GOLD, 'stroke-width': 2.4, 'stroke-dasharray': '8 6' });
    el(qg, 'rect', { x: x0 + 160, y: BY - bq, width: 120, height: bq, fill: GOLD });
    H.grow(qg, K.rose, .9, 0, BY, 'y');
    H.fade(el(s, 'line', { x1: x0 + 150, x2: x0 + 290, y1: BY - bq, y2: BY - bq, stroke: CR, 'stroke-width': 3, 'stroke-dasharray': '10 7' }), K.rose + .8, .35); }
  H.rise(el(s, 'text', { x: x0 + 296, y: BY - bq + 40, class: 'fh', 'font-size': 52 }, F('nebius_older_gpu_pricing_change_q2_2026').display), K.thirty);   // the key's own display, "30%+" (facts, v6)
}

/* ---------- financing (back half P01, 16 Oct): the stock is what holds this pillar up ----------
   The price on a true scale from $0, its area filled: the mass the convertible notes stand on. On "falls well below" a dashed
   arrow drops from today's price through where the notes convert (no level printed: it is the voice's "if"); the conversion
   level lands as the floor on "convert". The build below is drawn in the chips column's projection (the same iso set as the
   package and the accounting pillar): on "paying upfront" it stands empty, and on "prepayments" it fills, half to most of it. */
{ const [x0, x1] = COL[2], T0 = t('2026-03-01'), T1 = t(now.asOf), tx = lin(T0, T1, x0 + 84, x1 - 170), py = lin(0, 320, 560, 176);
  const C = claims[2];
  [100, 200, 300].forEach((v, i) => { const g = el(s, 'g');
    el(g, 'line', { x1: x0 + 84, x2: x1, y1: py(v), y2: py(v), stroke: 'rgba(245,241,229,.07)', 'stroke-width': 2 });
    el(g, 'text', { x: x0, y: py(v) + 10, class: 'ax', 'font-size': 26 }, '$' + v);
    H.fade(g, K.financing - .2 + i * .1, .4); });
  { const g = el(s, 'g'); el(g, 'line', { x1: x0 + 84, x2: x1, y1: py(0), y2: py(0), stroke: AXC, 'stroke-width': 2 });
    el(g, 'text', { x: x0, y: py(0) + 10, class: 'ax', 'font-size': 26 }, '$0'); H.fade(g, K.financing - .3, .4); }
  /* the relisting series ends 2 Oct; the 22 Sep to 15 Oct series (same source) carries the line to the recording's close, so the
     drop into mid-October is drawn, not bridged */
  const SEP = F('nebius_share_price_daily_sep_oct_2026').series; U('nebius_share_price_daily_sep_oct_2026');
  const SER = [...NBIS.filter(([d]) => t(d) >= T0), ...SEP.filter(([d]) => d > NBIS[NBIS.length - 1][0] && t(d) <= T1)], LP = SER.map(([d, c]) => tx(t(d)).toFixed(1) + ',' + py(c).toFixed(1));
  const area = el(C, 'polygon', { points: [tx(t(SER[0][0])).toFixed(1) + ',' + py(0), ...LP, tx(t(SER[SER.length - 1][0])).toFixed(1) + ',' + py(0)].join(' '), fill: 'rgba(245,241,229,.09)', stroke: 'none' });
  H.wipe(area, K.financing + .4, 2.8, 'x', H.ease.lin);
  const line = el(C, 'polyline', { points: LP.join(' '), fill: 'none', stroke: 'rgba(245,241,229,.8)', 'stroke-width': 2.6 });
  H.draw(line, K.financing + .4, 2.8, H.ease.lin);
  const nx = tx(t(now.asOf)), ny = py(now.v), ls = NBIS[NBIS.length - 1];
  if (SER[SER.length - 1][0] !== now.asOf) H.fade(el(C, 'line', { x1: tx(t(SER[SER.length - 1][0])), y1: py(SER[SER.length - 1][1]), x2: nx, y2: ny, stroke: 'rgba(245,241,229,.55)', 'stroke-width': 2.4, 'stroke-dasharray': '5 5' }), K.holds - .3, .4);
  H.fade(el(s, 'circle', { cx: nx, cy: ny, r: 7, fill: GOLD }), K.holds, .3);
  // the price and its date (its data.js label; facts, 15 Oct), right-aligned on the chart's edge with the $180 below, inside the safe frame
  H.rise(el(s, 'text', { x: x1, y: ny - 16, class: 'fn', 'font-size': 34, 'text-anchor': 'end', style: 'fill:var(--gold);paint-order:stroke;stroke:var(--bg);stroke-width:12px;stroke-linejoin:round' }, now.display), K.holds + .1);
  H.rise(el(s, 'text', { x: x1, y: ny - 58, class: 'nd', 'font-size': 26, 'text-anchor': 'end', style: 'paint-order:stroke;stroke:var(--bg);stroke-width:12px;stroke-linejoin:round' }, now.label), K.holds + .3);
  // the claim, "if the share price falls well below": a dashed arrow drops from today's price through the conversion level
  { const g = el(C, 'g'), yb = py(conv) + 64, ax = nx;
    el(g, 'line', { x1: ax, x2: ax, y1: ny + 16, y2: yb - 4, stroke: CR, 'stroke-width': 2.6, 'stroke-dasharray': '8 6' });
    el(g, 'path', { d: `M${ax - 11},${yb - 16} L${ax},${yb} L${ax + 11},${yb - 16}`, fill: 'none', stroke: CR, 'stroke-width': 2.6 });
    H.wipe(g, K.falls, .9, 'y', H.ease.io); }
  // where the March notes convert: the floor, heavier than a gridline
  H.wipe(el(C, 'line', { x1: x0 + 84, x2: x1, y1: py(conv), y2: py(conv), stroke: CR, 'stroke-width': 3.2, 'stroke-dasharray': '12 8' }), K.convert - .2, 1.0, 'x');
  H.rise(el(C, 'text', { x: x1, y: py(conv) + 44, class: 'fn', 'font-size': 34, 'text-anchor': 'end' }, F('nebius_notes_conversion_price_march_2026').display), K.eighty);   // "$180" (facts, 15 Oct)
  // the margin between today and the conversion level, measured
  H.draw(dim(s, nx + 18, ny, nx + 18, py(conv), GOLD, 8), K.eighty + .8, .6);
  /* the answer: prepayments cover 50 to 60% of the build. The build is one data hall drawn in the board's projection (a slab,
     its roof plant), the cost running along its length: an empty outline on "paying upfront", then filled in gold to the low
     end and, past it, the approved projection treatment (a tint with a dashed edge) to the high end. Rebuilt per frame while
     it fills, like the package. */
  { const L = 10, Dd = 3.4, Hh = 2.2, BV = fitView({ az: 30, elv: 40, world: [0, 0, L, Dd, Hh + .7], rect: [x0, 640, x1 - 150, 930] });
    const hall = el(s, 'g');
    { const S = scene();
      box(S, BV, 0, 0, 0, L, Dd, Hh, { stroke: DIMC, sw: 1.8, bias: -10 });
      for (let k = 0; k < 4; k++) box(S, BV, .8 + k * 2.3, .9, Hh, 1.4, 1.6, .5, { stroke: 'rgba(245,241,229,.38)', sw: 1.2, bias: k });
      S.paint(hall); }
    H.draw(hall, K.upfront, 1.1);
    const live = el(s, 'g'); let last = '';
    H.on((tt) => {
      const a = H.go(tt, K.prepay, K.prepay + .8), b = H.go(tt, K.prepay + .75, K.prepay + 1.25);
      const key = a.toFixed(3) + b.toFixed(3); if (key === last) return; last = key;
      live.replaceChildren(); if (a <= 0) return;
      const S = scene(), lo = L * cover.lo / 100, hi = L * cover.hi / 100;
      box(S, BV, 0, 0, 0, lo * a, Dd, Hh, { stroke: GOLD, sw: 1.8, fill: GOLD, bias: 1 });
      if (b > 0) box(S, BV, lo, 0, 0, (hi - lo) * b, Dd, Hh, { stroke: GOLD, sw: 1.8, fill: 'rgba(212,175,55,.3)', bias: 2 });
      S.paint(live);
      if (b > 0) live.querySelectorAll('polygon').forEach((p, i) => { if (i >= 3) p.setAttribute('stroke-dasharray', '8 6'); });
      /* the roof plant stays drawn over the fill (an ink line on the gold), so the hall is still a hall */
      const R = scene();
      for (let k = 0; k < 4; k++) { const ux = .8 + k * 2.3; if (ux >= lo * a) continue;
        box(R, BV, ux, .9, Hh, Math.min(1.4, lo * a - ux), 1.6, .5, { stroke: 'rgba(10,10,12,.6)', sw: 1.2, fill: GOLD, bias: k }); }
      R.paint(live);
    });
    const [fx, fy] = BV.P(L * cover.hi / 100, 0, Hh), fig = cover.lo + '–' + cover.hi + '%';
    const lx = Math.max(fx + 24, x1 - 176);
    const fl = el(s, 'line', { x1: fx, x2: lx - 8, y1: fy, y2: fy - 60, stroke: GOLD, 'stroke-width': 2 });
    H.draw(fl, K.half - .1, .35);
    H.rise(el(s, 'text', { x: lx, y: fy - 58, class: 'fh', 'font-size': 44 }, fig), K.half);
    H.rise(el(s, 'line', { x1: lx + 2, x2: lx - 2 + fig.length * 26.4, y1: fy - 44, y2: fy - 44, stroke: GOLD, 'stroke-width': 3, 'stroke-dasharray': '10 7' }), K.half + .1); }
}

H.run();
