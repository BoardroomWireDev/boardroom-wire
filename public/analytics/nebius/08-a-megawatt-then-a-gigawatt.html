<!-- NEBIUS · H8 · A MEGAWATT, THEN A GIGAWATT (Ive's builder, 13 Oct 2026). From the b086 lead-in (s10p4 w21, "Nebius measures
     its deals…") to the end of s10p7, about 87 s. From the approved style frame (assets/style-frames/H8-…html), put in motion to
     the writer's direction: one node is one megawatt, its price beside it, then the flip to a full gigawatt lighting up, the
     arithmetic made massive. One cell = one megawatt everywhere (P2's grammar): cream hairline = nothing yet, gold hatch =
     connected (not online), solid gold = in use, open gold = planned. Lighting up is a flat fill changing state, row by row.
       node        (16 Oct, the writer's note 15) a drawn light bulb, one megawatt (style frame N15a), standing from frame 0, drawn and
                   unlit (as the old node stood); on the word the 1 MW dimension snaps on, and 0.2 s later the filament catches:
                   hard switches, thin cream (unlit) to full-weight gold (lit): on 0.00-0.09, off -0.26, on -0.34, off -0.64,
                   ON for good, from node+0.84 s. No glow.
       year        nothing new (the step is kept for the at= order); "a year" comes in with the figure, 0.3 s after it
       price       "= $12M" lands beside the bulb (200 px); then bulb, figure and "a year" make one eased move into the corner
                   (price+.35 to price+1.35) and the bulb stays as the unit mark; the $-per-MW scale draws once it is home
                   (price+1.4, on "per megawatt"), the 2026 base on it
       site        the Vineland window opens (b088, 17:07), top right
       vineland    300 cells draw as open cells (design capacity) in the site's outline: New Jersey, up to 300 MW (facts, 15 Oct)
       q2          the price travels: the gold tick and its riding figure move $12M to $20M+ (the Q2 deals); the big figure steps
       short       the tick jumps into the short-term $40M to $50M range as it wipes on, hatched; the big figure with it
       back        the tick comes home to $20M+; the window and the block leave fully (the right side is clear until "plans")
       page        the price page card rides over the clear right half (b089, 17:27)
       plans       the first 300 cells of the gigawatt field, empty hairlines, at the Vineland scale
       inuse       170 cells light, row by row: 170 MW, Dec 2025
       letter      the Q4 letter card rides over the clear bottom left (b090, 17:47)
       connected   the flip: the camera pulls back from 300 cells to the full 1,000 (straight lines on screen; each block is drawn
                   once it is wholly inside the safe frame), hatched row by row (connected, not online)
       starting    2027: the camera pulls back again; the second 1,000 drawn as open cells, row by row
       additional  +1,000 MW
       times       × $20M at each field
       pergw       "about" $20B a gigawatt (ours: solid gold, a dashed underline: style frame N15b), each field
       two         2,000 MW × $20M
       forty       "roughly" $40B a year (ours, same treatment)
       holds       the bracket ties the total to both fields
     Words on screen (rule 16): about, roughly (the voice's own), a year, short-term, connected (the frame's), New Jersey (the script's place), dates (2026, Q2,
     Dec 2025, end 2026, 2027), units. Figures: nebius_revenue_per_mw_2026_base, nebius_revenue_per_mw_q2_deals,
     nebius_revenue_per_mw_short_term (lo/hi), nebius_vineland_mw, nebius_power_capacity_december_2025,
     nebius_connected_power_target_year_end_2026 (hi), nebius_capacity_deployment_per_year_from_2027,
     nebius_revenue_per_gw_calc (C), nebius_revenue_2gw_calc (C).
     Job query (Davinci, 15 Oct): noslot=b088&at=3.6,5.7,10.5,14.07,16.43,22.57,28.77,30.2,30.1,42.8,49.13,51.43,52.8,56.17,58.67,62.2,65.9,69.17,72.93,74.63&secs=81&slots=0
     Steps (board seconds at 150 wpm from s10p4 w21; ?at= in this order, ?secs=):
       node 3.4 · year 5.8 · price 10.2 · site 14.4 · vineland 17.8 · q2 24.6 · short 31.8 · back 34.2 · page 34.4 ·
       plans 46.2 · inuse 52.6 · letter 54.4 · connected 56.6 · starting 60.6 · additional 63.4 · times 66.2 · pergw 69.4 ·
       two 72.6 · forty 77.4 · holds 79.0                                                                       (secs 87.2)
     Render: bw render page --file=dashboards/08-a-megawatt-then-a-gigawatt.html --name=08-a-megawatt-then-a-gigawatt
             --seconds=87.2 --scale=2 --query="slots=0&at=<the 20 times above, from vo-words.json>&secs=<s>"
     DIM (?part=dim, P08 "When the Shortage Ends", 16 Oct; board 0 = VO 1465.81, "what happens when the shortage ends"): the megawatt
     bulb alone, larger, centred-left, on an otherwise empty black frame; it opens LIT (gold filament at full weight, as H8 ends).
     On "shortage" (1.13) the flicker runs the other way, hard switches, no glow: off .00-.09, on -.26, off -.64, then DIM for good:
     the filament at a quarter of its ink, the outline at a third. On "pricing" (3.17), "prepayments" (4.15), "valuation" (5.41) a
     hairline runs from the bulb's base to the right, each ending at that word set in type (the voice's own words). No figures, so
     the credit line is empty. The main board and every other part are untouched (the dim branch is a separate block).
       Steps: shortage 1.13 · pricing 3.17 · prepayments 4.15 · valuation 5.41                              (secs 8.53)
       Render: bw render page --file=dashboards/08-a-megawatt-then-a-gigawatt.html --name=08-a-megawatt-then-a-gigawatt-dim-vo_full
               --seconds=8.7 --scale=2 --query="part=dim&at=1.13,3.17,4.15,5.41&secs=8.53&slots=0"
     Capture contract: BW.run via HERO.run; ?capture ?final ?still ?beats ?t=<secs|label> ?motion=0 ?slots=0. -->

<script>
const H = HERO, s = document.getElementById('s'); defs(s);
const DIM = new URLSearchParams(location.search).get('part') === 'dim';
const K = DIM ? H.steps([['shortage', 1.13], ['pricing', 3.17], ['prepayments', 4.15], ['valuation', 5.41]], 8.53) : H.steps([['node', 3.4], ['year', 5.8], ['price', 10.2], ['site', 14.4], ['vineland', 17.8], ['q2', 24.6], ['short', 31.8],
  ['back', 34.2], ['page', 34.4], ['plans', 46.2], ['inuse', 52.6], ['letter', 54.4], ['connected', 56.6], ['starting', 60.6],
  ['additional', 63.4], ['times', 66.2], ['pergw', 69.4], ['two', 72.6], ['forty', 77.4], ['holds', 79.0]], 87.2);

/* ================= ?part=dim: the bulb dims (P08). A block of its own; the main board below is not touched. ================= */
if (DIM) {
  const GOLD = 'var(--gold)', LNC = 'rgba(245,241,229,.82)', FOFF = 'rgba(245,241,229,.35)', LINE = 'rgba(245,241,229,.62)';
  const BX = 470, BY = 520, BK = 3.6;                         // the bulb's centre and scale (about 780 px tall, left of centre)
  const BG = el(s, 'g', { transform: `translate(${BX},${BY}) scale(${BK})` });
  const OUTL = [];
  const BP = (d) => { const p = el(BG, 'path', { d, fill: 'none', stroke: LNC, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }); OUTL.push(p); return p; };
  BP('M-22,60 C-22,40 -60,20 -60,-30 C-60,-75 -30,-100 0,-100 C30,-100 60,-75 60,-30 C60,20 22,40 22,60 Z');
  BP('M-22,60 H22 V66 H-22 Z');
  for (let i = 0; i < 5; i++) BP(`M-21,${70 + i * 7} Q0,${66 + i * 7} 21,${70 + i * 7} M-21,${70 + i * 7} V${74 + i * 7} M21,${70 + i * 7} V${74 + i * 7}`);
  BP('M-21,104 H21 M-14,104 Q0,118 14,104');
  const contact = el(BG, 'rect', { x: -5, y: 112, width: 10, height: 6, fill: LNC });
  BP('M-6,60 L-6,10 L6,10 L6,60'); BP('M-5,14 L-18,-38 M5,14 L18,-38'); BP('M0,10 V-20');
  let fil = 'M-18,-38'; for (let i = 0; i <= 12; i++) { const x = -18 + i * 3; fil += ` L${x + 1.5},${i % 2 ? -44 : -32}`; } fil += ' L18,-38';
  const FIL = el(BG, 'path', { d: fil, fill: 'none', stroke: GOLD, 'stroke-width': 2.3, 'stroke-linejoin': 'round' });
  /* lit at frame 0; from "shortage": off .00-.09, on .09-.26, off .26-.64, then dim for good (a hard switch, no fade) */
  const D0 = K.shortage, OFF = [[0, .09], [.26, .64]];
  H.on((t) => {
    const off = OFF.some(([a, b]) => t >= D0 + a && t < D0 + b), dimmed = t >= D0 + .64;
    FIL.setAttribute('stroke', off ? FOFF : GOLD); FIL.setAttribute('stroke-width', off ? 1.1 : 2.3);
    FIL.setAttribute('stroke-opacity', dimmed ? .25 : 1);
    const o = dimmed ? .33 : 1; OUTL.forEach(p => p.setAttribute('stroke-opacity', o)); contact.setAttribute('fill-opacity', o);
  });
  /* three hairlines from the bulb's base to the voice's three words */
  const OX = BX + 22 * BK + 10, OY = BY + 88 * BK, EX = 1130;
  [['pricing', 'pricing', 540], ['prepayments', 'prepayments', 700], ['valuation', 'valuation', 860]].forEach(([k, word, y]) => {
    const ln = el(s, 'path', { d: `M${OX},${OY} L${EX - 60},${y} H${EX}`, fill: 'none', stroke: LINE, 'stroke-width': 2 });
    H.draw(ln, K[k], .55);
    H.rise(el(s, 'text', { x: EX + 24, y: y + 22, class: 'nm', 'font-size': 66 }, word), K[k] + .3);
  });
  H.run();
} else {

const GOLD = 'var(--gold)', CR = 'var(--cream)', HAIR = 'rgba(245,241,229,.24)', OPEN = 'rgba(212,175,55,.55)';
const inUse = U('nebius_power_capacity_december_2025');                       // 170
U('nebius_connected_power_target_year_end_2026');
const gw1 = F('nebius_connected_power_target_year_end_2026').hi;               // up to 1,000 (the target is 800 MW to 1 GW)
const gw2 = U('nebius_capacity_deployment_per_year_from_2027');               // 1,000 a year
const vine = U('nebius_vineland_mw');                                         // 300
const base = U('nebius_revenue_per_mw_2026_base');                            // ~$12M
const q2 = U('nebius_revenue_per_mw_q2_deals');                               // more than $20M
const st = F('nebius_revenue_per_mw_short_term'); U('nebius_revenue_per_mw_short_term');
const perGW = U('nebius_revenue_per_gw_calc'), two = U('nebius_revenue_2gw_calc');
calc = true;

/* receipt cards ride over areas the board keeps empty while they are up */
H.card('b089', K.page, K.plans - 3.0, { x: 800, y: 150, w: 1000, h: 740 }, "Nebius's price page, effective 1 Oct 2026: H100 and B300, before and after");
H.card('b090', K.letter, K.starting - .2, { x: 64, y: 600, w: 620, h: 380 }, 'Nebius Q4 2025 letter: 800 MW to 1 GW connected by end 2026');

/* ================= the world: the fields, under the camera ================= */
const FX = 720, P = 14, CELL = 10, GAP = 22, BK = 10 * P, FW = 5 * BK + 4 * GAP, FH = 2 * BK + GAP;
const A_Y = 180, B_Y = A_Y + FH + 150;
const W = el(s, 'g');
/* the camera: on 300 cells, pulled back to the gigawatt, then to both. Keys are [t, centre x, centre y, scale]; between keys
   the screen offset and the scale are interpolated together (screen = T + world x k), so every point travels a straight line
   on screen from where it was to where it lands: nothing swings out past its two ends. */
const CAM = [[0, 790, 340, 2], [K.connected - .2, 790, 340, 2], [K.connected + 2.4, 848, 412, 1.25],
  [K.starting, 848, 412, 1.25], [K.starting + 2.2, 960, 540, 1]].map(([t, cx, cy, k]) => [t, 960 - cx * k, 540 - cy * k, k]);
function camAt(t) {
  let i = 0; while (i < CAM.length - 1 && t > CAM[i + 1][0]) i++;
  const A = CAM[i], B = CAM[Math.min(i + 1, CAM.length - 1)], u = B === A || t <= A[0] ? 0 : H.go(t, A[0], B[0]);
  return [H.mix(A[1], B[1], u), H.mix(A[2], B[2], u), H.mix(A[3], B[3], u)];
}
H.on((t) => { const [tx, ty, k] = camAt(t); W.setAttribute('transform', `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${k.toFixed(4)})`); });
const SX = (t, x) => { const [tx, , k] = camAt(t); return tx + x * k; };
const SY = (t, y) => { const [, ty, k] = camAt(t); return ty + y * k; };
/* the first moment a world box is wholly inside the 64 px safe frame (cells are drawn only once the camera has them in frame) */
function inFrame(x0, y0, x1, y1, from, to) {
  for (let t = from; t <= to; t += .02) if (SX(t, x0) >= 64 && SX(t, x1) <= 1856 && SY(t, y0) >= 64 && SY(t, y1) <= 1016) return t;
  return to;
}

/* a cell's look in each state; set only when its state changes (2,300 cells) */
const LOOK = {
  hair: { fill: 'none', stroke: HAIR, 'stroke-width': 1.4 },
  front: { fill: 'none', stroke: GOLD, 'stroke-width': 2 },
  solid: { fill: GOLD, stroke: 'none', 'stroke-width': 0 },
  hatch: { fill: 'url(#hatchGoldFine)', stroke: GOLD, 'stroke-width': 1.2 },
  open: { fill: 'none', stroke: OPEN, 'stroke-width': 1.6 }
};
function cellsOf(parent, list, timing, C = CELL) {
  const cs = list.map(([cx, cy, i]) => ({ i, r: el(parent, 'rect', { x: cx - C / 2, y: cy - C / 2, width: C, height: C, display: 'none' }), st: 'none' }));
  H.on((t) => cs.forEach(c => {
    const [ta, tf, fin] = timing(c.i);
    const st = t < ta ? 'none' : t < tf - .16 ? 'hair' : t < tf ? 'front' : fin;
    if (st === c.st) return; c.st = st;
    if (st === 'none') { c.r.setAttribute('display', 'none'); return; }
    c.r.setAttribute('display', ''); const a = LOOK[st]; for (const k in a) c.r.setAttribute(k, a[k]);
  }));
}
const rowOf = (i) => Math.floor(Math.floor(i / 100) / 5) * 10 + Math.floor((i % 100) / 10);   // 0..19 across the field

/* Vineland: 300 cells, lit as a block in the site's outline, in its own place (lower right, under its window), at the size the
   gigawatt field is first seen at (2x). It leaves fully on "And", before the field ever draws, so the 170 never reads as part of it. */
const VX = 820, VY = 570;                                     // 3 blocks of 100 at 2x: 928 x 280
const gV = el(s, 'g');
cellsOf(gV, field(vine, { x: VX, y: VY, pitch: 2 * P, gap: 2 * GAP, across: 3 }),
  (i) => [K.vineland - .7 + Math.floor((i % 100) / 10) * .03, K.vineland + .1 + Math.floor((i % 100) / 10) * .09, 'open'], 2 * CELL);   // open: design capacity, not in use (facts, 15 Oct)
H.draw(el(gV, 'rect', { x: VX - 16, y: VY - 16, width: 3 * 20 * P + 4 * GAP + 32, height: 20 * P + 32, fill: 'none', stroke: 'rgba(245,241,229,.6)', 'stroke-width': 2 }), K.vineland - .9, .8);
H.rise(el(gV, 'text', { x: VX, y: VY - 34, class: 'nm', 'font-size': 34 }, 'New Jersey'), K.vineland - .6);
H.rise(el(gV, 'text', { x: VX + 3 * 20 * P + 4 * GAP, y: VY - 34, class: 'fn', 'font-size': 34, 'text-anchor': 'end', style: 'fill:var(--gold)' },
  F('nebius_vineland_mw').display), K.vineland + .2);   // the data.js display, "up to 300 MW" (facts, 15 Oct)
H.show(gV, 0, .01, K.back - .1, .4);

/* field 1: the gigawatt connected by end 2026; 170 in use (solid), the rest hatched (connected is not online) */
const g1 = el(W, 'g');
const BIN = [];                                               // when each block of 100 is wholly in frame during the flip
for (let b = 0; b < 10; b++) { const x0 = FX + (b % 5) * (BK + GAP), y0 = A_Y + Math.floor(b / 5) * (BK + GAP);
  BIN.push(Math.max(K.connected + (b >= 5 ? .6 : .1), inFrame(x0, y0, x0 + BK, y0 + BK, K.connected - .2, K.connected + 2.4))); }
cellsOf(g1, field(gw1, { x: FX, y: A_Y, pitch: P, gap: GAP, across: 5 }), (i) => {
  const b = Math.floor(i / 100);
  const ta = i < vine ? K.plans + Math.floor((i % 100) / 10) * .05 : BIN[b] + Math.floor((i % 100) / 10) * .02;
  const tf = i < inUse ? K.inuse + .1 + i / inUse * 1.3 : Math.max(K.connected + 1.4 + rowOf(i) / 19 * 2.8, ta + .4);
  return [ta, tf, i < inUse ? 'solid' : 'hatch'];
});
/* field 2: the gigawatt a year planned from 2027, open cells */
const g2 = el(W, 'g');
cellsOf(g2, field(gw2, { x: FX, y: B_Y, pitch: P, gap: GAP, across: 5 }),
  (i) => { const ta = K.starting + .9 + rowOf(i) / 19 * 2.3; return [ta, ta + .17, 'open']; });

/* ================= labels on the fields: pinned to the camera, kept at their own size ================= */
const O = el(s, 'g');
function pin(ax, ay) {
  const g = el(O, 'g');
  H.on((t) => g.setAttribute('transform', `translate(${(SX(t, ax) - ax).toFixed(2)},${(SY(t, ay) - ay).toFixed(2)})`));
  return g;
}
// field 1's head: the date and the word, then its size once the camera has pulled back
const p1 = pin(FX, A_Y), p1r = pin(FX + FW, A_Y);
H.rise(el(p1, 'text', { x: FX, y: A_Y - 30, class: 'nm', 'font-size': 34 }, 'end 2026'), K.connected + .2);
H.rise(el(p1, 'text', { x: FX + 168, y: A_Y - 30, class: 'nd', 'font-size': 34 }, 'connected'), K.connected + .5);
/* the target is a range (facts, 16 Oct): 800 MW to 1 GW, from the key's own lo and hi */
H.rise(el(p1r, 'text', { x: FX + FW, y: A_Y - 30, class: 'ax', 'font-size': 34, 'text-anchor': 'end' }, fmt.int(F('nebius_connected_power_target_year_end_2026').lo) + '–' + fmt.int(gw1) + ' MW'), K.connected + 2.2);
// 170 MW in use: a leader off the solid cells, down the gap between the first two blocks, to below the cells on screen
const g170 = el(O, 'g');
const lead = el(g170, 'path', { fill: 'none', stroke: GOLD, 'stroke-width': 2 });
const t170 = el(g170, 'text', { class: 'fn', 'font-size': 34, style: 'fill:var(--gold)' }, fmt.int(inUse) + ' MW');
const tDec = el(g170, 'text', { class: 'nd', 'font-size': 34 }, 'Dec 2025');
H.on((t) => {
  const x = SX(t, FX + BK + GAP / 2), top = SY(t, A_Y);
  const bot = H.mix(SY(t, A_Y + BK), SY(t, A_Y + FH), H.go(t, K.connected, K.connected + .55)) + 44;
  lead.setAttribute('d', `M${x.toFixed(1)},${top.toFixed(1)} V${bot.toFixed(1)} H${(x + 41).toFixed(1)}`);
  t170.setAttribute('x', (x + 53).toFixed(1)); t170.setAttribute('y', (bot + 12).toFixed(1));
  tDec.setAttribute('x', (x + 225).toFixed(1)); tDec.setAttribute('y', (bot + 12).toFixed(1));
});
H.draw(lead, K.inuse + .9, .6);
H.rise(t170, K.inuse + 1.2); H.rise(tDec, K.inuse + 1.6);
// field 2's head
const p2 = pin(FX, B_Y), p2r = pin(FX + FW, B_Y);
H.rise(el(p2, 'text', { x: FX, y: B_Y - 30, class: 'nm', 'font-size': 34 }, '2027'), K.starting + .3);
H.rise(el(p2r, 'text', { x: FX + FW, y: B_Y - 30, class: 'ax', 'font-size': 34, 'text-anchor': 'end' }, '+' + fmt.int(gw2) + ' MW'), K.additional + .2);

/* each gigawatt's revenue, ours: × $20M, then the hatched $20B, at the field's right edge (camera at rest by now) */
const RX = FX + FW + 56;
/* our projection (N15b, the writer's pick): solid gold numerals under the voice's own qualifier ("about $20 billion", "roughly
   $40 billion", as "up to" sits on H6), a dashed gold underline the figure's width. The dashed line is the house's mark for a
   projection; the numerals stay clean. An invisible box generous for any font (0.6 em a character) keeps H.wipe's measured box
   independent of whether the fonts had loaded when it measured. */
const hatchedFig = (p, x, y, size, txt) => { const g = el(p, 'g'), w = txt.length * size * .6;
  el(g, 'rect', { x: x - 12, y: y - size * 1.1, width: w + 24, height: size * 1.35, fill: 'none', stroke: 'none' });
  el(g, 'text', { x: x + 6, y: y - size * (size > 120 ? .86 : 1.0), class: 'nd', 'font-size': Math.max(30, Math.round(size * .17)) }, size > 120 ? 'roughly' : 'about');
  el(g, 'text', { x, y, 'font-size': size, class: 'fh' }, txt);
  el(g, 'line', { x1: x + 4, x2: x + w - 4, y1: y + size * .1, y2: y + size * .1, stroke: 'var(--gold)', 'stroke-width': size > 120 ? 4 : 3, 'stroke-dasharray': size > 120 ? '16 10' : '10 7' });
  return g; };
[A_Y, B_Y].forEach((y, j) => {
  H.rise(el(O, 'text', { x: RX + 4, y: y + FH / 2 + 82, class: 'ax', 'font-size': 32 }, '× ' + fmt.usdM(q2)), K.times + j * .4);
  H.wipe(hatchedFig(O, RX, y + FH / 2 + 30, 96, fmt.usdB(perGW, 0)), K.pergw + j * .9, .8, 'x');
});
// the bracket that ties the total to both fields
H.draw(el(O, 'path', { d: `M${FX - 26},${A_Y} H${FX - 44} V${B_Y + FH} H${FX - 26}`, fill: 'none', stroke: GOLD, 'stroke-width': 3, 'stroke-dasharray': '12 9' }), K.holds, .9);

/* ================= the bulb and its price (left) ================= */
const L = el(s, 'g'), LX = 96;
/* The bulb is the unit mark: an A-shape lamp drawn as a technical drawing (front elevation) from the approved still (N15a), one
   megawatt. It stands from frame 0, drawn and unlit; on "megawatt" the dimension snaps on and the filament catches (on / off / on / off / ON, hard switches, no glow), then on "$12 million"
   the price lands beside it; then bulb, price and "a year" make one eased move into the board's corner and the bulb stays there as
   the unit mark. Everything is a pure function of t. */
const LNC = 'rgba(245,241,229,.82)', FOFF = 'rgba(245,241,229,.35)';
const HAND = [K.price + .35, K.price + 1.35];                 // the hand-over: bulb, price and "a year" to the corner, one path
const hu = (t) => H.go(t, HAND[0], HAND[1]);
const BC = (t) => { const u = hu(t); return [H.mix(560, 147, u), H.mix(560, 215, u), H.mix(2.1, .85, u)]; };    // centre x, y, scale
const BG = el(s, 'g');
H.on((t) => { const [cx, cy, k] = BC(t); BG.setAttribute('transform', `translate(${cx.toFixed(2)},${cy.toFixed(2)}) scale(${k.toFixed(4)})`); });
const BP = (d) => el(BG, 'path', { d, fill: 'none', stroke: LNC, 'stroke-width': 2.4, 'stroke-linejoin': 'round' });   // stands from frame 0, drawn, unlit
BP('M-22,60 C-22,40 -60,20 -60,-30 C-60,-75 -30,-100 0,-100 C30,-100 60,-75 60,-30 C60,20 22,40 22,60 Z');   // the envelope
BP('M-22,60 H22 V66 H-22 Z');                                                                                  // the collar
for (let i = 0; i < 5; i++) BP(`M-21,${70 + i * 7} Q0,${66 + i * 7} 21,${70 + i * 7} M-21,${70 + i * 7} V${74 + i * 7} M21,${70 + i * 7} V${74 + i * 7}`);   // the thread
BP('M-21,104 H21 M-14,104 Q0,118 14,104');                                                                    // the shoulder
el(BG, 'rect', { x: -5, y: 112, width: 10, height: 6, fill: LNC });                         // the contact
BP('M-6,60 L-6,10 L6,10 L6,60');                                                                               // the stem
BP('M-5,14 L-18,-38 M5,14 L18,-38');                                                                           // the lead-in wires
BP('M0,10 V-20');                                                                                              // the support
let fil = 'M-18,-38'; for (let i = 0; i <= 12; i++) { const x = -18 + i * 3; fil += ` L${x + 1.5},${i % 2 ? -44 : -32}`; } fil += ' L18,-38';
const FIL = el(BG, 'path', { d: fil, fill: 'none', stroke: FOFF, 'stroke-width': 1.6, 'stroke-linejoin': 'round' });
/* the flicker: the filament catches. Hard switches, no fade: on .00-.09, off -.26, on -.34, off -.64, ON for good (0.64 s),
   starting 0.2 s after the word (K.node + .2). Lit = gold at full weight; unlit = thin cream. Nothing else changes. */
const F0 = K.node + .2, FLK = [[0, .09], [.26, .34]];
H.on((t) => { const lit = t >= F0 + .64 || FLK.some(([a, b]) => t >= F0 + a && t < F0 + b);
  FIL.setAttribute('stroke', lit ? GOLD : FOFF); FIL.setAttribute('stroke-width', lit ? 3.2 : 1.6); });
// the dimension under it: one megawatt (the dimension is screen-sized: 2 px, ticks of 10; it follows the bulb)
const DM = dim(s, 0, 0, 0, 0), DMk = [...DM.children];
const mwT = el(s, 'text', { class: 'ax', 'font-size': 34, 'text-anchor': 'middle' }, '1 MW');
H.on((t) => { const [cx, cy, k] = BC(t), y = cy + 136 * k, x1 = cx - 63 * k, x2 = cx + 63 * k;
  DMk[0].setAttribute('x1', x1); DMk[0].setAttribute('x2', x2); DMk[0].setAttribute('y1', y); DMk[0].setAttribute('y2', y);
  [[1, x1], [2, x2]].forEach(([i, x]) => { DMk[i].setAttribute('x1', x); DMk[i].setAttribute('x2', x); DMk[i].setAttribute('y1', y - 10); DMk[i].setAttribute('y2', y + 10); });
  mwT.setAttribute('x', cx.toFixed(1)); mwT.setAttribute('y', (y + H.mix(52, 42, hu(t))).toFixed(1)); });
H.draw(DM, K.node, .2);
H.rise(mwT, K.node + .05, .3, 10);
// "a year", as the still sets it, then beside the price; "= $12M" lands on "$12 million"
const yrT = el(L, 'text', { class: 'nd' }, 'a year');
const prT = el(L, 'text', { class: 'fh' }, '= ' + fmt.usdM(base));
/* the key is approximate and the voice says "about" (facts, 16 Oct): the qualifier sits over the figure, as on $20B and $40B */
const abT = el(L, 'text', { class: 'nd' }, 'about');
H.on((t) => { const u = hu(t), px0 = H.mix(820, LX + 150, u), py0 = H.mix(560, 248, u), fs = H.mix(200, 120, u);
  prT.setAttribute('x', px0.toFixed(1)); prT.setAttribute('y', py0.toFixed(1)); prT.setAttribute('font-size', fs.toFixed(1));
  abT.setAttribute('x', (px0 + fs * 1.22).toFixed(1)); abT.setAttribute('y', (py0 - fs * .93).toFixed(1)); abT.setAttribute('font-size', Math.max(30, fs * .17).toFixed(1));
  yrT.setAttribute('x', (px0 + H.mix(180, 6, u)).toFixed(1)); yrT.setAttribute('y', (py0 + H.mix(76, 52, u)).toFixed(1)); yrT.setAttribute('font-size', H.mix(44, 34, u).toFixed(1)); });
H.rise(yrT, K.price + .3);   // with the figure, not alone; the 'year' step stays in the list for the at= order
H.rise(prT, K.price, .55, 18, K.q2 - .1, .3); H.rise(abT, K.price + .15, .5, 12, K.q2 - .1, .3);
// the price steps on from the corner: $20M+ (Q2 deals), $40M to $50M (short-term), back to $20M+
const price = (txt, size = 120) => el(L, 'text', { x: LX + 150, y: 248, class: 'fh', 'font-size': size }, txt);
H.rise(price(fmt.usdM(q2) + '+'), K.q2 + .15, .55, 18, K.short - .1, .3);
H.rise(price(fmt.usdM(st.lo) + '–' + fmt.usdM(st.hi), 96), K.short + .15, .5, 18, K.back - .2, .3);
H.rise(price(fmt.usdM(q2) + '+'), K.back + .05);

// the $-per-MW scale: the 2026 base, the Q2 deals, the short-term range
const px = lin(0, 50e6, LX, 600), AY = 520, KS = K.price + .9;   // the scale draws once the bulb is home
const axl = el(L, 'line', { x1: px(0), x2: px(50e6), y1: AY, y2: AY, stroke: 'rgba(245,241,229,.5)', 'stroke-width': 2 });
H.draw(axl, KS + .5, .8);
for (let v = 0; v <= 50e6; v += 10e6) {
  const g = el(L, 'g');
  el(g, 'line', { x1: px(v), x2: px(v), y1: AY, y2: AY + 12, stroke: 'rgba(245,241,229,.5)', 'stroke-width': 2 });
  el(g, 'text', { x: px(v), y: AY + 50, class: 'ax', 'font-size': 30, 'text-anchor': 'middle' }, v ? fmt.usdM(v) : '$0');
  H.fade(g, KS + .6 + v / 10e6 * .12);
}
const rng = el(L, 'rect', { x: px(st.lo), y: AY - 46, width: px(st.hi) - px(st.lo), height: 46, fill: 'url(#hatch)', stroke: 'rgba(245,241,229,.6)', 'stroke-width': 2 });
H.wipe(rng, K.short + .1, .7, 'x');
H.rise(el(L, 'text', { x: (px(st.lo) + px(st.hi)) / 2, y: AY - 60, class: 'nd', 'font-size': 32, 'text-anchor': 'middle' }, 'short-term'), K.back + .6);
H.grow(el(L, 'rect', { x: px(base) - 2, y: AY - 46, width: 4, height: 46, fill: CR }), KS + 1.3, .5, 0, AY, 'y');
/* the price travels: one gold tick with the node's figure riding above it, $12M to $20M+ on "$20", into the short-term range on
   "$40", back to $20M+ on "And"; each move eased in and out, never past its stop. Each date word rises once the tick has left
   its place (they share the row the riding figure uses); the riding figure retires once the tick is home, and the tick stays
   as the style frame's Q2 mark. */
const MID = px((st.lo + st.hi) / 2), MD = .7;
const MOV = [[K.q2 - .05, px(base), px(q2), fmt.usdM(q2) + '+'], [K.short - .05, px(q2), MID, fmt.usdM(st.lo) + '–' + fmt.usdM(st.hi)],
  [K.back - .05, MID, px(q2), fmt.usdM(q2) + '+']];
const tickG = el(L, 'g');
const tick = el(tickG, 'rect', { x: -3, y: AY - 70, width: 6, height: 70, fill: GOLD });
const ride = el(tickG, 'text', { x: 0, y: AY - 88, class: 'fn', 'font-size': 32, 'text-anchor': 'middle', style: 'fill:var(--gold)' }, fmt.usdM(base));
H.on((t) => {
  let x = px(base), txt = fmt.usdM(base);
  for (const [a, x0, x1, tx] of MOV) if (t >= a) { x = H.mix(x0, x1, H.go(t, a, a + MD)); if (t >= a + .15) txt = tx; }   // the riding figure changes with the big one
  tickG.setAttribute('transform', `translate(${x.toFixed(2)},0)`);
  if (ride.textContent !== txt) ride.textContent = txt;
});
H.grow(tick, KS + 1.4, .5, 0, AY, 'y');
H.rise(ride, KS + 1.6, .55, 18, K.back + 2.0, .4);
H.rise(el(L, 'text', { x: px(base), y: AY - 60, class: 'nd', 'font-size': 32, 'text-anchor': 'middle' }, '2026'), K.q2 + .5);
H.rise(el(L, 'text', { x: px(q2) + 2, y: AY - 84, class: 'nm', 'font-size': 32, 'text-anchor': 'middle', style: 'fill:var(--gold)' }, 'Q2'), K.back + 2.4);

/* the arithmetic, made massive (bottom left): ours, so qualified and underlined */
H.rise(el(L, 'text', { x: LX, y: 640, class: 'fn', 'font-size': 40 }, fmt.int(gw1 + gw2) + ' MW × ' + fmt.usdM(q2)), K.two);
H.draw(el(L, 'line', { x1: LX, x2: 600, y1: 668, y2: 668, stroke: 'rgba(245,241,229,.35)', 'stroke-width': 2 }), K.two + .4, .6);
H.wipe(hatchedFig(L, LX - 8, 900, 210, fmt.usdB(two, 0)), K.forty, 1.0, 'x');
H.rise(el(L, 'text', { x: LX, y: 958, class: 'nd', 'font-size': 34 }, 'a year'), K.forty + .9);

/* the Vineland window (b088), above the block, clear of it; owed (15 Oct: no footage yet), so not drawn */
H.owed('b088');
H.slot(s, 'b088', 1172, 150, 576, 324, K.site, K.back - .2, 'Vineland, New Jersey: the finished site');

H.run();
}
</script>
