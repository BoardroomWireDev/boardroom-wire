<!-- TESLA-SPACEX · HERO · 09 THE COMBINE, THE CLIMAX (v2 build, Ive B, 20 Oct 2026, from the approved style frame
     sf2-09-combine.html). LOOK-tesla-spacex-v2.md (money as volume on one footprint; one scale pulled back to the truth); PICTURE-MAP
     "Overhaul, 20 Oct" V09; BOARD-PERIODS.md scene 4. Reference: Anthropic 50-gap. The writer (pass 5, 8:58): "a combined SpaceX +
     Tesla should be exciting ... can't look away."
     8:57.3 "If you put them together, you get a company that brought in about $114 billion of revenue last year, holds about $144
     billion of cash, and is worth roughly $3.4 trillion, which would make it" (part 1; the ranking board, 17, plays between) ...
     9:15.4 "30 times what the two made in revenue last year. And SpaceX alone is valued at about 100 times its revenue." (part 2,
     ?part=2, which opens on part 1's last frame: the tower state is continuous across the cut).
     The idea: one footprint, one scale ($10 billion a unit of height). The camera starts close on the two 2025 revenue blocks,
     Tesla's and SpaceX's, apart; they slide together and fuse into one gold block (the seam where Tesla's $94.8B meets SpaceX's
     $18.7B stays as a line). Cash at 30 Jun 2026 stands beside it on the same footprint and scale, cream (a balance, not a flow).
     Then the value rises out of the revenue block as a tower of the same block, stacked: 29.8 years of the pair's 2025 revenue,
     each a ruled course, and the camera pulls back with it until the block it started from is a step at the foot. One period per
     group: "2025" on the revenue, "30 Jun 2026" on the cash, "16 Oct 2026" on the value. The 29.8× lands in part 2, on the voice's
     "30 times", after the ranking board.
       merge     the two 2025 revenue blocks, apart, close up ("If you put them together")
       sums      they slide together and fuse, gold ("you get a company"); $113.5B on "$114 billion" (+1.40)
       cash      cash at 30 Jun 2026 rises beside it ("holds about"); $143.5B on "$144 billion" (+0.41)
       worth     the tower rises, the camera pulling back ("and is worth roughly"); $3.38T on "$3.4 trillion" (+1.34)
     part 2 (board 0 = "30", 546.55; secs 7.39):
       thirty    the tower dimensioned in courses of the pair's 2025 revenue, 29.8× (ours) ("30 times")
       spacex    the camera widens; SpaceX's own value rises beside, on its share of the footprint, ruled in courses of its own
                 2025 revenue ("And SpaceX alone")
       hundred   106.1× (ours) up its edge ("100 times")
     Steps from cue-map/vo-words.json `s` (board 0 = "If", 526.18); ?at= re-times them in this order (Davinci). Words: none beyond
     periods and marks. Figures: $113.5B, $143.5B, $3.38T; part 2 29.8× and 106.1× (all C, our dashed underline). No overlay rides
     this board. Render: part 1 ?part=1&at=0,1.23,6.06,8.47&secs=11.87; part 2 ?part=2&at=0,3.11,5.4&secs=7.39 (Davinci).
     Capture contract: BW.run via HERO.run; ?capture ?final ?still ?beats ?t=<secs|label> ?motion=0 ?at= ?secs= -->

<body>
<div class="stage">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<script>
const H = HERO, s = document.getElementById('s'); defs2(s);
/* two parts around the ranking board (17 plays between them): part 1 from "If" (526.18) to "which would make it" (538.05);
   part 2 from "30" (546.55) to "Investors" (553.94), opening on part 1's last frame */
const PART = new URLSearchParams(location.search).get('part') === '2' ? 2 : 1;
const P1END = 11.87;
const K = PART === 1 ? H.steps([['merge', 0], ['sums', 2.63], ['cash', 6.47], ['worth', 9.81]], P1END)   // as read, vo-words `s`
  : H.steps([['thirty', 0], ['spacex', 3.11], ['hundred', 5.4]], 7.39);
const P1 = PART === 1 ? K : { merge: 0, sums: 2.63, cash: 6.47, worth: 9.81 };
const T_REV = P1.sums, T_CASH = P1.cash, T_VAL = P1.worth;
const REV = usd('c_combined_fy2025_revenue'), T25 = usd('tesla_fy2025_revenue_total'), X25 = usd('spacex_fy2025_revenue_total');
const CASH = usd('c_combined_cash_2026_06_30'), VAL = usd('c_combined_mcap_2026_10_16');
const SVAL = PART === 2 ? usd('spacex_market_cap_2026_10_16') : 0, MULT = PART === 2 ? U('c_combined_mcap_to_fy2025_revenue') : 0,
  SMULT = PART === 2 ? U('c_spacex_mcap_to_fy2025_revenue') : 0;
for (const v of [REV, T25, X25, CASH, VAL]) if (!isFinite(v)) throw new Error('a figure is not a number in data.js');
calc = true;
const FP = 46, ZU = 1e10, AZ = 38, ELV = 16;                      // footprint (units); one unit of height = $10 billion
const hR = REV / ZU, hC = CASH / ZU, hV = VAL / ZU, XC = FP * 1.85;   // the cash block stands beside, on the same ground
const wT = FP * T25 / REV;
/* the camera: close on the base, then pulled back with the tower to the whole height */
const VCLOSE = fitView({ az: AZ, elv: ELV, world: [-16, 0, FP * 2.9, FP, hC + 6, 0], rect: [460, 260, 1460, 860] });
const VFULL = fitView({ az: AZ, elv: ELV, world: [0, 0, FP * 2.9, FP, hV + 4, 0], rect: [520, 60, 1440, 915] });
const ru = (t) => H.go(t, P1.worth - 1.34, P1.worth + 1.66, H.ease.io);
/* part 2: SpaceX alone stands beside, on its own share of the footprint; the camera widens to take it in */
const XS = XC + FP + 64, wS = FP - wT, hS = SVAL / ZU, cS = X25 / ZU;
const VWIDE = fitView({ az: AZ, elv: ELV, world: [0, 0, XS + wS + 40, FP, hV + 4, 0], rect: [420, 60, 1600, 915] });
const mixV = (A, B, w) => { const a = A.P(0, 0, 0), b = B.P(0, 0, 0); return view({ ox: H.mix(a[0], b[0], w), oy: H.mix(a[1], b[1], w), k: H.mix(A.k, B.k, w), az: AZ, elv: ELV }); };
function viewAt(t1, t2) { if (PART === 2) return mixV(VFULL, VWIDE, H.go(t2, K.spacex - .2, K.spacex + 1.4));
  return mixV(VCLOSE, VFULL, H.go(t1, P1.worth - 1.24, P1.worth + 1.86)); }
const root = el(s, 'g', { 'stroke-linejoin': 'round' }), over = el(s, 'g');

function render(t) {
  root.replaceChildren(); over.replaceChildren();
  const t1 = PART === 1 ? t : P1END, t2 = PART === 2 ? t : -1;
  const V = viewAt(t1, t2), S = scene(), fu = H.go(t1, P1.sums - 1.3, P1.sums - .1), gap = (1 - fu) * 14, gold = fu > .98;
  const head = .45 + .55 * H.go(t1, P1.merge, P1.merge + .6);
  /* the ground: one plane for every block */
  line3(root, V, [[-24, FP, 0], [FP * 3.0, FP, 0]], { stroke: 'rgba(245,241,229,.4)', sw: 1.6 });
  /* the two 2025 revenue blocks slide together and fuse (gold once one): Tesla's share of the footprint, then SpaceX's */
  const g0 = el(root, 'g', { opacity: head.toFixed(3) });
  box(S, V, -gap, 0, 0, wT, FP, hR, { stroke: gold ? GOLDC : LINE, fill: gold ? GOLDC : INK, sw: 2, bias: 1 });
  box(S, V, wT + gap, 0, 0, FP - wT, FP, hR, { stroke: gold ? GOLDC : LINE, fill: gold ? GOLDC : INK, sw: 2, bias: 2 });
  /* the tower: the value, as the revenue block stacked 29.8 times, each course ruled */
  const r = ru(t1), hT = (hV - hR) * r;
  if (r > 0) box(S, V, 0, 0, hR, FP, FP, hT, { stroke: GOLDC, fill: INK, sw: 2.2, bias: 3, detail: (g, V) => {
    for (let z = hR * 2; z < hR + hT - 1e-6; z += hR) line3(g, V, [[0, FP, z], [FP, FP, z], [FP, 0, z]], { stroke: 'rgba(212,175,55,.55)', sw: 1.3 });
  } });
  /* cash, at 30 Jun 2026: its own block beside, cream */
  const cu = H.go(t1, P1.cash - .41, P1.cash + .49);
  if (cu > 0) box(S, V, XC, 0, 0, FP, FP, hC * cu, { stroke: LINE, fill: INK, sw: 2, bias: 4 });
  S.paint(g0);
  if (gold) line3(g0, V, [[wT, FP, 0], [wT, FP, hR], [wT, 0, hR]], { stroke: 'var(--bg)', sw: 2 });
  /* before the fuse, each block carries its company's mark under it */
  { const a = 1 - H.go(t1, P1.sums - 1.2, P1.sums - .6); if (a > 0) { const g = el(over, 'g', { opacity: (a * head).toFixed(3) });
    const [tx, ty] = V.P(-gap, FP, 0), [sx, sy] = V.P(wT + gap, FP, 0);
    logo(g, 'tesla', tx - 10, ty + 26, 24); logo(g, 'spacex', sx + 14, sy + 34, 20); } }
  /* figures on horizontal leaders, period first in mono, figure below it; they ride the camera */
  const lab = (p, tx, period, fig, a, cls, size, anchor = 'start', ours_ = false) => { if (a <= 0) return;
    const g = el(over, 'g', { opacity: a.toFixed(3) }), col = 'rgba(245,241,229,.5)', [px, py] = p;
    if (anchor === 'start' && tx < px) tx = Math.max(60, Math.min(tx, px - 360));          // the figure's column stays clear of its block
    el(g, 'line', { x1: px, y1: py, x2: tx, y2: py, stroke: col, 'stroke-width': 2 }); el(g, 'circle', { cx: px, cy: py, r: 4.5, fill: col });
    const dx = anchor === 'start' ? 18 : -18;
    el(g, 'text', { x: tx + dx, y: py - 14, class: 'ax', 'font-size': 32, 'text-anchor': anchor }, period);
    const f = el(g, 'text', { x: tx + dx, y: py + size * .9, class: cls, 'font-size': size, 'text-anchor': anchor }, fig);
    if (ours_) ours(f, cls === 'fh' ? 'var(--gold)' : 'var(--cream)', 10, 3); };
  lab(V.P(0, FP, hR / 2), 300, '2025', fmt.usdB(REV, 1), H.go(t1, T_REV, T_REV + .5), 'fh', 64, 'start', isCalc('c_combined_fy2025_revenue'));
  lab(V.P(XC + FP, FP / 2, hC * .5), 1500, fmt.day(F('c_combined_cash_2026_06_30').asOf), fmt.usdB(CASH, 1), H.go(t1, T_CASH, T_CASH + .5) * (PART === 2 ? 1 - H.go(t2, K.spacex - .4, K.spacex + .2) : 1), 'fn', 48, 'start', isCalc('c_combined_cash_2026_06_30'));
  lab(V.P(0, FP, hR + hT - 2), 300, fmt.day(F('c_combined_mcap_2026_10_16').asOf), fmt.usdT(VAL), H.go(t1, T_VAL, T_VAL + .5), 'fh', 96, 'start', isCalc('c_combined_mcap_2026_10_16'));

  /* part 2 · "30 times": the value dimensioned up the tower's edge in courses of the pair's 2025 revenue */
  if (PART === 2) {
    const du = H.go(t2, K.thirty, K.thirty + .6);
    if (du > 0) { const g = el(over, 'g', { opacity: du.toFixed(3) }), a = V.P(FP, 0, hR), b = V.P(FP, 0, hV), x = Math.max(a[0], b[0]) + 56;
      dim(g, x, b[1], x, a[1], 'rgba(212,175,55,.8)', 14);
      const tx = el(g, 'text', { x: x + 28, y: b[1] + (a[1] - b[1]) * .28 + 18, class: 'fh', 'font-size': 64 }, D('c_combined_mcap_to_fy2025_revenue', fmt.mult(MULT)));   // high on its line, clear of SpaceX's tower
      if (isCalc('c_combined_mcap_to_fy2025_revenue')) ours(tx); }
    /* "SpaceX alone": its value rises on its own share of the footprint, ruled in courses of its own 2025 revenue (106) */
    const su = H.go(t2, K.spacex + .3, K.spacex + 2.1, H.ease.io);
    if (su > 0) { const S2 = scene(), hh = hS * su;
      /* drawn as the gold tower is, in cream: its 2025 revenue the solid base course, every course ruled above it; at 106 courses
         the pitch is ~4 px at 1080, so every tenth is drawn heavier and the count reads like a scale */
      const hb = Math.min(cS, hh);
      box(S2, V, XS, 0, 0, wS, FP, hb, { stroke: LINE, fill: 'rgba(245,241,229,.92)', sw: 2.2, bias: 1 });
      if (hh > hb) box(S2, V, XS, 0, hb, wS, FP, hh - hb, { stroke: LINE, fill: INK, sw: 2.2, bias: 2, detail: (g, V) => {
        for (let k = 2, z = cS * 2; z < hh - 1e-6; k++, z += cS) { const dec = k % 10 === 0;
          line3(g, V, [[XS, FP, z], [XS + wS, FP, z], [XS + wS, 0, z]], { stroke: dec ? 'rgba(245,241,229,.95)' : 'rgba(245,241,229,.55)', sw: dec ? 2 : 1.3 }); } } });
      S2.paint(root);
      const [mx, my] = V.P(XS, FP, 0), gm = el(over, 'g', { opacity: H.go(t2, K.spacex + .4, K.spacex + 1.0).toFixed(3) }); logo(gm, 'spacex', mx - 6, my + 66, 22); }   // low under its tower, clear of the 2025 figure
    const hu = H.go(t2, K.hundred, K.hundred + .6);
    if (hu > 0) { const g = el(over, 'g', { opacity: hu.toFixed(3) }), a = V.P(XS + wS, 0, cS), b = V.P(XS + wS, 0, hS), x = Math.max(a[0], b[0]) + 40;
      dim(g, x, b[1], x, a[1], 'rgba(245,241,229,.7)', 12);
      const tx = el(g, 'text', { x: x + 24, y: (a[1] + b[1]) / 2 + 16, class: 'fn', 'font-size': 56 }, fmt.mult(SMULT));
      if (isCalc('c_spacex_mcap_to_fy2025_revenue')) ours(tx, 'var(--cream)', 10, 3); }
    /* the dimension's two ends named, as the combined tower's are: its value at the top, its 2025 revenue at the foot */
    { const xd = Math.max(V.P(XS + wS, 0, cS)[0], V.P(XS + wS, 0, hS)[0]) + 40;
      lab(V.P(XS + wS, 0, hS), xd + 6, fmt.day(F('spacex_market_cap_2026_10_16').asOf), fmt.usdT(SVAL), H.go(t2, K.spacex + 1.6, K.spacex + 2.1), 'fn', 48, 'start', isCalc('spacex_market_cap_2026_10_16'));
      lab(V.P(XS + wS, 0, cS / 2), xd + 6, '2025', fmt.usdB(X25, 1), H.go(t2, K.hundred + .9, K.hundred + 1.4), 'fn', 48, 'start', isCalc('spacex_fy2025_revenue_total')); }
  }
}
H.on(render);
H.run();
</script>
