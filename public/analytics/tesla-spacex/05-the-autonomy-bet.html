<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tesla's $1.4 trillion bet · Boardroom Wire</title>
<!-- TESLA-SPACEX · HERO · TESLA'S $1.4 TRILLION BET (Ive, 18 Oct 2026, night). Chapter 4, from "Tesla is still primarily a car
     company" to "about 80% of Tesla's value will be Optimus": 73 s (Scorsese's 4:18.7 to 5:31.7, HERO-CANDIDATES 05).
     The idea: a car company's revenue and its value on ONE dollar scale, then what the value is a bet on, counted. The revenue bar
     is drawn wide (2025, split cars, energy, other); on "investors aren't paying $1.4 trillion" the scale pulls back to the truth
     and the revenue becomes a short bar under a $1.40T one (the board's one big move, house best board 50-gap). Below, three
     aligned unit fields where one cell is 1,000 units: cars delivered last quarter (solid: real), the Cybercab line's capacity a
     year (dashed: capacity, not output; its last cells fade, "more than"), and the million Optimus robots a year Tesla plans
     (dashed: a plan). The robot is never drawn as a figure (LOOK: never an icon): it hasn't been shown, so it is an empty dashed
     cell, magnified once on a detail sheet, then one cell among a thousand.
     Grammar (LOOK-tesla-spacex.md): cream is Tesla; gold only where the two companies are already one (the Megapacks SpaceX bought
     from Tesla in 2025, a gold sliver inside energy); dashed means planned or not yet real; our arithmetic carries a dashed
     underline (the value, the car share, the fares); Musk's 80% is a dashed bracket over the value (his claim, "will be").
       mark       Tesla's mark; the revenue bar's outline draws ("Tesla is still primarily a car company")
       revenue    it fills: $94.8B ("$95 billion"); +4.0 s it splits, cars $69.5B, 73.3% ours ("about three quarters")
       scale      the factory window (owed) ("What it's best at is building")
       cars       486 solid cells, one per 1,000 cars; 486,532, Q3 2026 ("delivered more than 486,000 cars")
       energy     the energy slice to full; +6.2 s the gold sliver, $506M from SpaceX ("increasingly, AI data centers")
       value      the scale pulls back; $1.40T rises under the revenue, ours ("investors aren't paying $1.4 trillion")
       bet        the two lanes, self-driving and Optimus, the writer's words ("a bet on autonomy, in two parts")
       fsd        1.48M ("About 1.5 million people already pay"); +5.4 s six cities light ("in six cities")
       fares      ~$5M, ours ("only a few million dollars of fares so far by our estimate")
       cybercab   125 dashed cells and five fading; 125,000+ a year ("more than 125,000 Cybercabs a year")
       optimus    one dashed cell, magnified on a detail sheet, empty ("hasn't even been shown")
       million    1,000 dashed cells ("a million robots a year")
       eighty     a dashed bracket over 80% of the value, ~80% ("about 80% of Tesla's value will be Optimus")
     Words on screen (rule 16, all the script's): revenue, cars, energy, other, value, self-driving, cities, fares, Cybercab,
     Optimus, a year. Everything else is a figure, a date or a company's mark.
     Owed, held until its key lands (the board renders without it): c_tesla_fy2025_automotive_revenue_share (C, 69,526 / 94,827 =
     73.3%, in the ledger, not yet in data.js). Footage windows and receipt cards: Davinci's layer, rects in #bw-slots (owed).
     LOCK DAY (22 Oct): the value moves with the price and Tesla's Q3 deck restates the FSD count and the cities; the board reads
     its keys, so it is a data.js change.
     Render: bw render dashboards/05-the-autonomy-bet.html --at <times> --secs <s> --out <big-media path>
     Capture contract: BW.run via HERO.run; ?capture ?final ?still ?beats ?t=<secs|label> ?motion=0 ?at= ?secs= ?noslot= -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/brand.css?v=5">
<link rel="stylesheet" href="assets/hero/hero.css">
</head>
<body>
<div class="stage">
  <svg class="hero" id="s" viewBox="0 0 1920 1080"></svg>
  <div class="chrome"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js"></script>
<script src="shared/motion.js?v=5"></script>
<script src="assets/hero/sf.js"></script>
<script src="assets/hero/hero.js"></script>
<script src="assets/hero/fields.js"></script>
<script>
const H = HERO, s = document.getElementById('s'); el(s, 'defs');
const K = H.steps([['mark', 0], ['revenue', 2.53], ['scale', 10.12], ['cars', 14.1], ['energy', 17.35], ['value', 25.66],
  ['bet', 28.92], ['fsd', 33.98], ['fares', 42.29], ['cybercab', 48.07], ['optimus', 57.47], ['million', 65.42], ['eighty', 69.04]], 73.0);

const CR = 'var(--cream)', GOLD = 'var(--gold)', INK = 'var(--bg)', DIM = 'rgba(245,241,229,.55)', LOW = .45;

/* ---------------- the figures ---------------- */
const R = { tot: usd('tesla_fy2025_revenue_total'), cars: usd('tesla_fy2025_revenue_automotive'),
  energy: usd('tesla_fy2025_revenue_energy'), other: usd('tesla_fy2025_revenue_services_other') };
const carShare = has('c_tesla_fy2025_automotive_revenue_share') ? pct('c_tesla_fy2025_automotive_revenue_share') : null;
const mega = usd('spacex_tesla_megapacks_2025');                         // Megapacks SpaceX bought from Tesla, 2025 (S-1)
const VAL = usd('tesla_market_cap_cover_shares_2026_10_16');
const delivered = val('tesla_q3_2026_vehicles_delivered');
const fsd = val('fwd_tsla_fsd_active_subs_q2');
const cities = val('tesla_q2_2026_call_unsupervised_miles');             // n: the six cities, read from the row's words
const fares = val('fwd_tsla_rt_revenue_to_date_c');
const cabs = val('fwd_tsla_rt_cybercab_capacity_deck');
const bots = val('fwd_tsla_opt_q4_deck_capacity_1m');
const optimusShare = val('musk_claim_tesla_optimus_80pct_of_value_2025');
for (const [k, v] of Object.entries({ ...R, mega, VAL, delivered, fsd, cities, fares, cabs, bots, optimusShare }))
  if (!isFinite(v)) throw new Error('figure ' + k + ' is not a number in data.js');
calc = true;

/* ---------------- one dollar scale that pulls back on "$1.4 trillion" ---------------- */
const X0 = 420, NX = 64, RY = 140, BH = 64, VY = 330, VH = 80;
const K0 = 1100 / R.tot, K2 = 1360 / VAL;
const kAt = (t) => H.mix(K0, K2, H.go(t, K.value - .1, K.value + 1.5));
const labelsOut = (t) => 1 - H.go(t, K.value - .5, K.value - .1);

H.rise(logo(s, 'tesla', NX, 62, 30), -1, .01);

/* row names: names in Inter, periods in Plex Mono */
function rowName(y, nm, per, a, b = Infinity) {
  const g = el(s, 'g');
  el(g, 'text', { x: NX, y: y + 30, class: 'nm', 'font-size': 32 }, nm);
  if (per) el(g, 'text', { x: NX, y: y + 66, class: 'ax', 'font-size': 28 }, per);
  H.rise(g, a, .55, 18, b);
  return g;
}
rowName(RY, 'revenue', '2025', K.mark + .3);
rowName(VY, 'value', fmt.day(F('tesla_market_cap_cover_shares_2026_10_16').asOf), K.value + .2);

/* the revenue bar: the outline draws on "car company", fills on "$95 billion", splits on "three quarters" */
const SEG = [['cars', R.cars], ['energy', R.energy], ['other', R.other]];
const gRev = el(s, 'g');
const segR = SEG.map(() => el(gRev, 'rect', { y: RY, height: BH, fill: CR }));
const outl = el(gRev, 'rect', { x: X0, y: RY, height: BH, fill: 'none', stroke: CR, 'stroke-width': 2, pathLength: 1 });
const splitAt = K.revenue + 4.0;
H.on((t) => {
  const k = kAt(t), W = R.tot * k, g = H.go(t, K.revenue + .1, K.revenue + 1.0), sp = H.go(t, splitAt, splitAt + .5);
  const d = H.go(t, K.mark + .1, K.mark + 1.6);
  outl.setAttribute('width', W.toFixed(2)); outl.setAttribute('stroke-dasharray', d >= 1 ? 'none' : `${d.toFixed(4)} 1`);
  outl.style.display = d <= 0 ? 'none' : '';
  const fillTo = X0 + W * g; let x = X0;
  SEG.forEach(([key, v], i) => {
    const w = v * k, gap = i ? 3 * sp * (.34 + .66 * (k - K2) / (K0 - K2)) : 0, x0 = x + gap, x1 = Math.min(x + w, fillTo), r = segR[i];
    r.setAttribute('x', x0.toFixed(2)); r.setAttribute('width', Math.max(x1 - x0, 0).toFixed(2));
    r.style.display = x1 - x0 <= 0 ? 'none' : '';
    const op = key === 'cars' ? H.mix(LOW, 1, sp) : key === 'energy' ? H.mix(LOW, 1, H.go(t, K.energy, K.energy + .6)) : LOW;
    r.setAttribute('opacity', op.toFixed(3));
    x += w;
  });
});
/* the total rides the bar's end as the scale pulls back */
{ const n = el(s, 'text', { y: RY + BH / 2 + 17, class: 'fn', 'font-size': 48 }, fmt.usdB(R.tot));
  H.on((t) => n.setAttribute('x', (X0 + R.tot * kAt(t) + 20).toFixed(2)));
  H.rise(n, K.revenue + .6); }
/* the split's labels under the bar, at the wide scale only */
{ const g = el(s, 'g'); let x = X0;
  SEG.forEach(([nm, v], i) => {
    const xi = x + (i ? 3 : 0);
    el(g, 'text', { x: xi, y: RY + BH + 46, class: 'nm', 'font-size': 32 }, nm);
    el(g, 'text', { x: xi, y: RY + BH + 92, class: 'fn', 'font-size': 36 }, fmt.usdB(v));
    x += v * K0;
  });
  H.rise(g, splitAt + .3, .55, 18, K.value - .5);
  if (carShare !== null) {        // the car share, ours: in ink inside the car slice
    const n = el(s, 'text', { x: X0 + R.cars * K0 - 18, y: RY + BH / 2 + 13, class: 'fn', 'font-size': 36, 'text-anchor': 'end', style: 'fill:var(--bg)' }, fmt.pct(carShare, 1));
    const sg = el(s, 'g'); sg.appendChild(n); ours(n, INK, 4, 2); H.rise(sg, splitAt + .5, .55, 12, K.value - .5);
  } }

/* the Megapacks SpaceX bought from Tesla in 2025: a gold sliver at the head of the energy slice, its mark and figure above */
{ const sl = el(s, 'rect', { y: RY, height: BH, fill: GOLD });
  const g = el(s, 'g'), ld = el(g, 'line', { y1: RY - 8, y2: RY - 40, stroke: GOLD, 'stroke-width': 2 });
  const mk = logo(g, 'spacex', 0, 72, 18), fg = el(g, 'text', { y: 92, class: 'fn', 'font-size': 32, style: 'fill:var(--gold)' }, fmt.usdM(mega));
  const MW = logoW('spacex', 18);
  const a = K.energy + 6.2;
  H.on((t) => { const k = kAt(t), x = X0 + R.cars * k + 3 * H.go(t, splitAt, splitAt + .5) * (.34 + .66 * (k - K2) / (K0 - K2)), w = Math.max(mega * k, 2);
    sl.setAttribute('x', x.toFixed(2)); sl.setAttribute('width', w.toFixed(2));
    const xc = x + w / 2;
    ld.setAttribute('x1', xc.toFixed(2)); ld.setAttribute('x2', xc.toFixed(2));
    mk.setAttribute('transform', `translate(${(xc + 14).toFixed(2)},0)`); fg.setAttribute('x', (xc + 14 + MW + 16).toFixed(2)); });
  H.show(sl, a, .4);
  H.rise(g, a + .3); }

/* the value: Tesla alone, so cream; it grows under the shrinking revenue on the same scale */
{ const w = VAL * K2, r = el(s, 'rect', { x: X0, y: VY, width: w, height: VH, fill: CR });
  H.grow(r, K.value + .5, 1.1, X0, 0, 'x');
  const n = el(s, 'text', { x: X0 + w - 20, y: VY + VH - 9, class: 'fh', 'font-size': 96, 'text-anchor': 'end', style: 'fill:var(--bg)' }, D('tesla_market_cap_cover_shares_2026_10_16', fmt.usdT(VAL)));
  const g = el(s, 'g'); g.appendChild(n);
  if (isCalc('tesla_market_cap_cover_shares_2026_10_16')) underAt(g, n, VY + VH + 14, CR);
  H.rise(g, K.value + 1.4, .6, 14); }

/* ---------------- the three counted fields: one cell is 1,000 ---------------- */
const UNIT = 1000, CY = 470, SY = 650, OY = 830;
const nCars = Math.floor(delivered / UNIT), nCabs = Math.floor(cabs / UNIT), nBots = Math.floor(bots / UNIT);

/* cars delivered last quarter: solid */
const gCars = el(s, 'g');
{ const g = el(gCars, 'g');
  el(g, 'text', { x: NX, y: CY + 28, class: 'nm', 'font-size': 32 }, 'cars');
  el(g, 'text', { x: NX, y: CY + 80, class: 'fn', 'font-size': 48 }, D('tesla_q3_2026_vehicles_delivered', fmt.int(delivered)));
  el(g, 'text', { x: NX, y: CY + 118, class: 'ax', 'font-size': 28 }, 'Q3 2026');
  H.rise(g, K.cars + .1);
  FIELD.grid(gCars, nCars, X0, CY, { solid: true, at: K.cars + .2, over: 1.3 });
  /* the unit, once: a bracket over the first cell */
  const u = el(gCars, 'g');
  el(u, 'path', { d: `M${X0},${CY - 8} v-8 h${FIELD.CELL} v8`, fill: 'none', stroke: DIM, 'stroke-width': 2 });
  el(u, 'text', { x: X0 + FIELD.CELL + 10, y: CY - 10, class: 'ax', 'font-size': 28 }, fmt.int(UNIT));
  H.rise(u, K.cars + .6, .5, 8);
  H.on((t) => gCars.setAttribute('opacity', (1 - .45 * H.go(t, K.bet, K.bet + .6)).toFixed(3))); }

/* the two parts of the bet: the writer's words, faint on "in two parts", full on their own names */
const lane = (y, nm, a, full) => { const n = el(s, 'text', { x: NX, y: y + 28, class: 'nm', 'font-size': 32 }, nm);
  H.on((t) => { const u = H.go(t, a, a + .5, H.ease.out), f = H.go(t, full, full + .5);
    n.setAttribute('opacity', (u * (.4 + .6 * f)).toFixed(3)); n.style.display = u < .002 ? 'none' : ''; }); return n; };
lane(SY, 'self-driving', K.bet + 1.6, K.bet + 3.0);
lane(OY, 'Optimus', K.bet + 1.6, K.optimus);
H.draw(el(s, 'line', { x1: 380, x2: 380, y1: SY + 4, y2: OY + FIELD.BLK, stroke: DIM, 'stroke-width': 2 }), K.bet + 1.3, .7);

/* self-driving: paying owners, the cities with no one at the wheel, the fares so far (ours), the Cybercab line's capacity */
{ const y = SY + 56;
  H.rise(el(s, 'text', { x: X0, y, class: 'fn', 'font-size': 56 }, D('fwd_tsla_fsd_active_subs_q2', fmt.mil(fsd * 1e6, 2))), K.fsd + .2);
  H.rise(el(s, 'text', { x: X0, y: SY + 108, class: 'ax', 'font-size': 28 }, fmt.day(F('fwd_tsla_fsd_active_subs_q2').asOf)), K.fsd + .4);
  const cx = 690, ca = K.fsd + 5.4;
  H.rise(el(s, 'text', { x: cx, y, class: 'fn', 'font-size': 56 }, fmt.int(cities)), ca);
  for (let i = 0; i < cities; i++) H.show(el(s, 'circle', { cx: cx + 62 + i * 26, cy: y - 20, r: 7, fill: CR }), ca + .15 + .12 * i, .2);
  H.rise(el(s, 'text', { x: cx, y: SY + 108, class: 'nd', 'font-size': 32 }, 'cities'), ca + .3);
  const fx = 960, fn = el(s, 'text', { x: fx, y, class: 'fn', 'font-size': 56 }, D('fwd_tsla_rt_revenue_to_date_c', '~' + fmt.usdM(fares)));
  const fg = el(s, 'g'); fg.appendChild(fn); if (isCalc('fwd_tsla_rt_revenue_to_date_c')) ours(fn, CR, 8, 2);
  H.rise(fg, K.fares + .3);
  H.rise(el(s, 'text', { x: fx, y: SY + 108, class: 'nd', 'font-size': 32 }, 'fares'), K.fares + .5);
  /* the Cybercab line: capacity, not output, so dashed; five more cells fade out past 125 ("more than") */
  const bx = 1180, end = FIELD.grid(s, nCabs, bx, SY, { at: K.cybercab + .3, over: .7, more: 5 });
  const tx = end + 44, g = el(s, 'g');
  el(g, 'text', { x: tx, y: SY + 28, class: 'nm', 'font-size': 32 }, 'Cybercab');
  el(g, 'text', { x: tx, y: SY + 80, class: 'fn', 'font-size': 48 }, D('fwd_tsla_rt_cybercab_capacity_deck', fmt.int(cabs) + '+'));
  el(g, 'text', { x: tx, y: SY + 118, class: 'ax', 'font-size': 28 }, 'a year');
  H.rise(g, K.cybercab + .1); }

/* Optimus: one empty dashed cell, magnified on a detail sheet (it hasn't been shown); then a thousand of them, a plan */
{ const g = el(s, 'g');
  el(g, 'text', { x: NX, y: OY + 80, class: 'fn', 'font-size': 48 }, D('fwd_tsla_opt_q4_deck_capacity_1m', fmt.mil(bots)));
  el(g, 'text', { x: NX, y: OY + 118, class: 'ax', 'font-size': 28 }, 'a year');
  H.rise(g, K.million + .2);
  FIELD.grid(s, 1, X0, OY, { at: K.optimus + .4, over: .1 });
  const sheet = el(s, 'g'), PX = 600, PW = 220, PH = FIELD.BLK;
  el(sheet, 'path', { d: `M${X0 + FIELD.CELL + 4},${OY + 5} H${PX - 14}`, fill: 'none', stroke: DIM, 'stroke-width': 2 });
  el(sheet, 'rect', { x: PX, y: OY, width: PW, height: PH, fill: INK });
  corners(sheet, PX, OY, PW, PH, 18, DIM);
  const M = 84;
  el(sheet, 'rect', { x: PX + (PW - M) / 2, y: OY + (PH - M) / 2, width: M, height: M, fill: 'none', stroke: CR, 'stroke-width': 2, 'stroke-dasharray': '10 7' });
  H.wipe(sheet, K.optimus + .8, .5, 'x');
  H.show(sheet, K.optimus + .8, .01, K.million - .1, .35);
  FIELD.grid(s, nBots - 1, X0, OY, { at: K.million + .1, over: 1.6, skip: 1 }); }

/* Musk's claim: a dashed bracket over 80% of the value ("will be"), with his figure */
{ const x80 = X0 + VAL * K2 * optimusShare / 100, y = VY - 14, g = el(s, 'g');
  el(g, 'path', { d: `M${X0},${y + 8} V${y} H${x80} V${y + 8}`, fill: 'none', stroke: CR, 'stroke-width': 2, 'stroke-dasharray': '10 7' });
  H.wipe(g, K.eighty + .5, 1.0, 'x');
  const lg = el(s, 'g'), pn = el(lg, 'text', { x: x80, y: y - 16, class: 'fn', 'font-size': 40, 'text-anchor': 'end' }, '~' + fmt.pct(optimusShare));
  el(lg, 'text', { x: x80 - 20 - 4 * 24, y: y - 16, class: 'nm', 'font-size': 32, 'text-anchor': 'end' }, 'Optimus');
  H.rise(lg, K.eighty + 1.3); }

/* footage windows and receipt cards: Davinci's layer (cue sheet o15 to o22); all owed until Ko's deliveries land */
const A = [1140, 470, 640, 360], B = [1140, 40, 640, 360];
H.owed('t05-factory', 't05-megapack', 't05-fsd', 't05-robotaxi', 't05-cybercab', 't05-optimus');
H.card('o15', K.revenue, K.revenue + 4.0, { x: A[0], y: A[1], w: A[2], h: A[3] }, "Tesla's 10-K, revenue 2025 (REQ-006 row 13)");
H.slot(s, 't05-factory', ...A, K.scale, K.scale + 4.0, 'a Tesla factory line, real footage (REQ-007 row 1)');
H.slot(s, 't05-megapack', ...A, K.energy + 4.0, K.energy + 8.0, 'Megapacks, Tesla footage (REQ-007 row 3)');
H.slot(s, 't05-fsd', ...A, K.fsd, K.fsd + 4.0, 'FSD in use, Tesla footage (REQ-007 row 5)');
H.slot(s, 't05-robotaxi', ...A, K.fsd + 5.4, K.fsd + 8.9, 'a robotaxi with no one at the wheel (REQ-007 row 6)');
H.slot(s, 't05-cybercab', ...B, K.cybercab + 1.4, K.cybercab + 5.4, 'the Cybercab line, Giga Texas (REQ-007 row 7; REQ-006 row 15)');
H.slot(s, 't05-optimus', ...A, K.optimus, K.optimus + 3.5, 'Optimus, Tesla footage (REQ-007 row 8)');
H.card('o22', K.eighty, K.eighty + 4.0, { x: A[0], y: A[1], w: A[2], h: A[3] }, "Musk's post, 1 Sep 2025 (REQ-002 row 5)");

H.run();
</script>
</body>
</html>
