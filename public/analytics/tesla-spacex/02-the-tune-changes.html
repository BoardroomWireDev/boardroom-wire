<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The convergence timeline · Boardroom Wire</title>
<!-- TESLA-SPACEX · HERO 02 · THE CONVERGENCE TIMELINE (v2; Ive, 20 Oct 2026). Built from the approved style frame
     sf2-02-timeline.html (LOOK-tesla-spacex-v2.md; PICTURE-MAP V02, 1:45.0 to 2:23.0; NOTES-pass5 row 1:46: "plot the new context on
     the timeline itself: zoom into late 2025/2026, shrink the long timeline to the bottom"). No floating inset.
     The idea: one true time axis, 2016 to 2026, with Musk's 2016 call on it. On "But last year" the long axis folds to a strip along
     the bottom, keeping a window over the months in view, and the main axis re-scales (eased in log space) to Nov 2025 to Oct 2026.
     Every moment is a point at its true date with its mark and its date; the later ones step down and right, so the points crowd
     toward October. Gold: Musk's own words (2016, the post, the call); cream: the outsiders. On "The press has been circling" Musk's
     points step back so the outsiders arrive on a quiet line.
     Words: none beyond dates, marks and month names. Every date is a data.js row's own asOf.
     Steps, on the recorded words (cue-map/vo-words.json `s`, minus the frame-0 time, VO 93.30), in order for ?at=:
       axis 0.60 "Back in 2016" · y2016 0.84 "2016" · zoom 6.40 "But last year" · post 7.22 "posted" · call 12.94 "shutting down
       the question" · press 23.55 "The press has been circling" · bloomberg 26.34 · cnbc 26.74 · banks 30.73 "Morgan called it" ·
       shotwell 34.01 "SpaceX's president"; secs 38.62 (board 02b opens on "And people are betting")
     Receipt cards (o02 to o06) ride beside the axis, never over it: their clear areas are published in #bw-slots, each tied to its
     step so a re-time carries it.
     Render: bw render dashboards/02-the-tune-changes.html --at <times> --secs 38.62 --out <big-media path>
     Capture contract: BW.run via HERO.run; ?capture ?final ?still ?beats ?t=<secs|label> ?motion=0 ?at= ?secs= -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/brand.css?v=5">
<link rel="stylesheet" href="assets/hero/hero.css">
</head>
<body>
<div class="stage">
  <svg class="hero" id="s" viewBox="0 0 1920 1080"></svg>
  <div class="chrome"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js"></script>
<script src="shared/motion.js?v=5"></script>
<script src="assets/hero/sf.js"></script>
<script src="assets/hero/hero.js"></script>
<script>
const H = HERO, s = document.getElementById('s'); el(s, 'defs');
const K = H.steps([['axis', 0.60], ['y2016', 0.84], ['zoom', 6.40], ['post', 7.22], ['call', 12.94], ['press', 23.55],
  ['bloomberg', 26.34], ['cnbc', 26.74], ['banks', 30.73], ['shotwell', 34.01]], 38.62);

const CR = 'var(--cream)', GOLD = 'var(--gold)', DIM = 'rgba(245,241,229,.55)', FAINT = 'rgba(245,241,229,.16)';
LOGO.bloomberg = ['assets/logos/logo-bloomberg.png', 1600 / 295];
LOGO.cnbc = ['assets/logos/logo-cnbc.png', 1600 / 1279];
LOGO.jpmorgan = ['assets/logos/logo-jpmorgan_white.png', 1600 / 227];

/* ---------------- the moments and their dates (data.js asOf) ---------------- */
const RX = { y16: 'hist_musk_2016_08_no_strong_rationale_combine', post: 'clue_musk_convergence_post_nov2025',
  call: 'clue_musk_tesla_q2_2026_call_combining', bbg: 'hist_bloomberg_2026_01_29_spacex_weighs_tesla_or_xai',
  cnbc: 'hist_cnbc_2026_05_27_musk_discussed_folding_tesla_spacex', jpm: 'hist_jpm_2026_07_strategically_coherent_on_paper',
  shot: 'clue_shotwell_cnbc_merger_jun2026' };
Object.values(RX).forEach(k => used.add(k));
const TODAYK = 'clue_kalshi_before_mar2027';   /* only the axis's end (the month of the latest read); no Kalshi figure is on this board, so not credited */
calc = false;
const pad = (n) => String(n).padStart(2, '0');
const DAY = 864e5, iso = (ms) => new Date(ms).toISOString().slice(0, 10);
/* a day label as the row has it: "12 Jun 2026", or "Jul 2026" when the row names only the month */
const when = (k) => { const f = F(k); return /\b\d{1,2} [A-Z][a-z]{2} \d{4}\b/.test(f.label || '') ? fmt.day(f.asOf) : MON[+f.asOf.slice(5, 7) - 1] + ' ' + f.asOf.slice(0, 4); };
const mAdd = (d, n) => { const y = +d.slice(0, 4), m = +d.slice(5, 7) - 1 + n; return `${y + Math.floor(m / 12)}-${pad(((m % 12) + 12) % 12 + 1)}-01`; };

/* the long axis opens in the year of the 2016 call; the detail opens on the month of the post and closes at the end of the month
   of the latest row on the board (17 Oct), so it reads Nov 2025 to Oct 2026 */
const D0 = F(RX.y16).asOf.slice(0, 4) + '-01-01', DZ = F(RX.post).asOf.slice(0, 7) + '-01', END = mAdd(F(TODAYK).asOf.slice(0, 7) + '-01', 1);
const SPAN0 = utc(END) - utc(D0), SPAN1 = utc(END) - utc(DZ);

/* ---------------- the scales ---------------- */
const X0 = 120, X1 = 1800, AY1 = 500, AY2 = 640, SY = 915;
const zoom = (t) => H.go(t, K.zoom, K.zoom + 2.2);
const fold = (t) => H.go(t, K.zoom, K.zoom + 1.8);
const span = (t) => Math.exp(H.mix(Math.log(SPAN0), Math.log(SPAN1), zoom(t)));       // eased in log space: a camera, not a slide
const xm = (d, t) => X1 - (X1 - X0) * (utc(END) - utc(d)) / span(t);                  // the main axis, moving then at rest
const xd = (d) => X1 - (X1 - X0) * (utc(END) - utc(d)) / SPAN0;                       // the long axis (the strip), fixed
const aym = (t) => H.mix(AY1, AY2, zoom(t));                                          // the main axis rises of its own accord: the long one sinks
const ays = (t) => H.mix(AY1, SY, fold(t));

const vp = el(s.querySelector('defs'), 'clipPath', { id: 'ax', clipPathUnits: 'userSpaceOnUse' });
el(vp, 'rect', { x: 60, y: 0, width: X1 - 60 + 60, height: 1080 });

/* ---------------- the long axis, which becomes the strip ---------------- */
const gS = el(s, 'g');
const sLine = el(gS, 'line', { x1: X0, x2: xd(END), y1: 0, y2: 0, stroke: CR, 'stroke-width': 2 });
H.draw(sLine, K.axis, 2.0, H.ease.lin);
const sY = [];
for (let y = +D0.slice(0, 4); y <= +END.slice(0, 4); y++) { const d = y + '-01-01', x = xd(d); if (x > X1 + 1) break;
  const tk = el(gS, 'line', { x1: x, x2: x, y1: 0, y2: 10, stroke: CR, 'stroke-width': 2 });
  const tx = el(gS, 'text', { x, y: 44, class: 'ax', 'text-anchor': 'middle' }, String(y));
  const a = K.axis + 2.0 * (x - X0) / (X1 - X0);
  H.fade(tk, a, .3); H.fade(tx, a, .3); }
/* the window kept over the months in view: a map's inset area, on the strip */
const wx0 = xd(DZ);
const win = el(gS, 'rect', { x: wx0, y: -14, width: X1 - wx0, height: 28, fill: 'rgba(245,241,229,.10)', stroke: CR, 'stroke-width': 2 });
H.on((t) => { const u = H.go(t, K.zoom + .6, K.zoom + 1.8); win.setAttribute('opacity', u.toFixed(3)); });
/* the 2016 point rides the long axis, up and down with it, and stays on the strip */
const g16 = el(gS, 'g', { transform: `translate(${xd(F(RX.y16).asOf)},0)` });
const st16 = el(g16, 'line', { x1: 0, x2: 0, stroke: GOLD, 'stroke-width': 2 });
el(g16, 'circle', { cx: 0, cy: 0, r: 8, fill: GOLD });
const b16 = el(g16, 'g');
logo(b16, 'tesla', 14, 0, 30); const t16 = el(b16, 'text', { x: 14, y: 0, class: 'fn', 'font-size': 32 }, when(RX.y16));
H.on((t) => { const h = H.mix(130, 76, fold(t)); st16.setAttribute('y1', -10); st16.setAttribute('y2', -h + 12);
  b16.setAttribute('transform', `translate(0,${-h})`); });
{ const lg = b16.firstChild; lg.setAttribute('transform', 'translate(0,-72)'); t16.setAttribute('transform', 'translate(0,-8)'); }
H.rise(g16, K.y2016, .5, 16);
H.on((t) => { gS.setAttribute('transform', `translate(0,${ays(t).toFixed(2)})`); });
/* the other points show on the strip too, at their true dates, as the window fills */
const POINTS = [RX.post, RX.bbg, RX.cnbc, RX.shot, RX.jpm, RX.call];

/* ---------------- the main axis ---------------- */
const W = el(s, 'g', { 'clip-path': 'url(#ax)' });
const gM = el(W, 'g');
const mLine = el(gM, 'line', { x1: X0, x2: X1, stroke: CR, 'stroke-width': 2 });
const MTK = [];
for (let d = D0, i = 0; utc(d) <= utc(END); d = mAdd(D0, ++i)) {
  const mo = +d.slice(5, 7) - 1, jan = mo === 0;
  const tk = el(gM, 'line', { stroke: jan ? CR : DIM, 'stroke-width': 2 });
  const inWin = utc(d) >= utc(DZ) && utc(d) < utc(END);
  const tx = inWin ? el(gM, 'text', { class: 'ax', 'text-anchor': 'middle' }, MON[mo]) : null;
  const yr = inWin && (jan || d === DZ) ? el(gM, 'text', { class: 'ax', 'text-anchor': 'middle' }, d.slice(0, 4)) : null;
  MTK.push({ d, jan, tk, tx, yr });
}
H.on((t) => {
  const z = zoom(t), y = aym(t), seen = H.go(z, 0, .12), mo = H.go(z, .55, 1);
  mLine.setAttribute('y1', y); mLine.setAttribute('y2', y); mLine.setAttribute('opacity', seen.toFixed(3));
  MTK.forEach(({ d, jan, tk, tx, yr }) => { const x = xm(d, t), vis = x >= X0 - 40 && x <= X1 + 1;
    tk.setAttribute('x1', x.toFixed(2)); tk.setAttribute('x2', x.toFixed(2)); tk.setAttribute('y1', y); tk.setAttribute('y2', y + (jan ? 12 : 8));
    tk.setAttribute('opacity', (vis ? mo : 0).toFixed(3));
    if (tx) { tx.setAttribute('x', x.toFixed(2)); tx.setAttribute('y', y + 44); tx.setAttribute('opacity', (vis ? mo : 0).toFixed(3)); }
    if (yr) { yr.setAttribute('x', x.toFixed(2)); yr.setAttribute('y', y + 88); yr.setAttribute('opacity', (vis ? mo : 0).toFixed(3)); } });
});

/* ---------------- the points: each at its true date, with its mark and a short dated label ---------------- */
/* later points step down and to the right, so a stem never runs through an earlier label; the three of Musk's own words in gold */
const PINS = [
  { k: RX.post, mark: 'x', h: 40, off: 255, gold: 1, a: K.post },
  { k: RX.bbg, mark: 'bloomberg', h: 34, off: 255, a: K.bloomberg },
  { k: RX.cnbc, mark: 'cnbc', h: 46, off: 465, a: K.cnbc },
  { k: RX.shot, mark: 'spacex', h: 30, off: 360, a: K.shotwell - 0.1 },
  { k: RX.jpm, mark: 'jpmorgan', h: 30, off: 255, a: K.banks },
  { k: RX.call, mark: 'tesla', h: 30, off: 150, gold: 1, a: K.call }
];
const gP = el(W, 'g');
PINS.forEach((p) => {
  const d = F(p.k).asOf, g = el(gP, 'g'), col = p.gold ? GOLD : CR;
  const stem = el(g, 'line', { x1: 0, x2: 0, y1: -p.off + 12, y2: -10, stroke: p.gold ? GOLD : DIM, 'stroke-width': 2 });
  const dot = el(g, 'circle', { cx: 0, cy: 0, r: 8, fill: col });
  const body = el(g, 'g', { transform: `translate(14,${-p.off})` });
  logo(body, p.mark, 0, -(36 + p.h), p.h);
  el(body, 'text', { x: 0, y: 0, class: 'fn', 'font-size': 32 }, when(p.k));
  const back = p.gold ? (t) => 1 - .45 * H.go(t, K.press, K.press + .6) * (1 - H.go(t, K.shotwell + 1.6, K.shotwell + 2.4)) : () => 1;   // Musk's points step back for the press, then return: his tune is the board
  H.on((t) => { g.setAttribute('transform', `translate(${xm(d, t).toFixed(2)},${aym(t).toFixed(2)})`); body.setAttribute('opacity', back(t).toFixed(3)); stem.setAttribute('opacity', back(t).toFixed(3)); });
  H.rise(g, p.a, .5, 16);
  /* the same moment as a dot on the strip */
  const sd = el(gS, 'circle', { cx: xd(d), cy: 0, r: 4, fill: col }); H.fade(sd, p.a + .2, .3);
});

/* receipt cards ride beside the axis, never over it: each clear area is empty of points while its card is up */
H.card('o02', K.post - .2, K.post + 4.8, { x: 520, y: 80, w: 1300, h: 300 }, 'Musk on X, 10 Nov 2025 (REVIEW-014)');
H.card('o03', K.call + 2.9, K.call + 9.9, { x: 500, y: 80, w: 840, h: 340 }, 'Musk, Tesla Q2 2026 call transcript (REQ-002 row 3)');
H.card('o04', K.bloomberg, K.bloomberg + 4.3, { x: 1380, y: 80, w: 480, h: 340 }, 'Bloomberg 29 Jan and CNBC 26 May (REVIEW-004)');
H.card('o05', K.banks, K.banks + 2.5, { x: 120, y: 80, w: 970, h: 230 }, 'JPMorgan via The Motley Fool (REQ-004 row 4)');
H.card('o06', K.shotwell, K.shotwell + 4.6, { x: 120, y: 80, w: 970, h: 230 }, 'Shotwell on CNBC, 12 Jun 2026 (REQ-004 row 5)');
H.run();
</script>
</body>
</html>
