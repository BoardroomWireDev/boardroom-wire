<title>The flywheel · Boardroom Wire</title>
<!-- TESLA-SPACEX · HERO · 07 THE FLYWHEEL, A MACHINE (v2 build, Ive B, 20 Oct 2026, from the approved style frame
     sf2-07-flywheel.html; LOOK-tesla-spacex-v2.md; PICTURE-MAP "Overhaul, 20 Oct" V07; layout A, the writer's pick through Jarvis).
     7:17.9 VO "And this is where things get really interesting. Step back, and look at what each one has. SpaceX has launch,
     satellites, data centers and AI. Tesla has power, manufacturing at scale, robotics and autonomy. And all of these are very
     accretive and make each other better. You can already see it with Tesla's batteries helping power SpaceX's AI, SpaceX's
     Starlink going into Cybercab. Grok is already in Tesla cars, and Musk wants it in all of the Optimus humanoid robots.
     Essentially, if they consolidate into one company, the synergy is indisputable and the scale of the business makes life a lot
     easier too."
     The idea: one machine on one bedplate, cast in two halves, Tesla's on the left and SpaceX's on the right. On each half stand its
     four parts, each the real thing drawn (machine.js): a Megapack, a factory, Optimus, a Cybercab; a data hall, a rack row running
     Grok, a Starlink satellite, Starship. In the middle a flywheel on a vertical shaft in its bearing, and every part is belted to
     its rim. The parts come up on their names; on "accretive" the wheel starts to turn; each example lays a feed from one company's
     part to the other's and the wheel steps up a speed (four links, four steps). On "consolidate" the two halves of the bedplate
     close into one casting, gold; on "indisputable" the names step back and the rotor runs at full speed.
     Build changes from the frame (the lead's notes): the feeds no longer cut across the bedplate. Each runs round the rotor on its
     own concentric track (radial spurs in and out): three round the front, power round the back, one crossing where there were six. Starlink and Optimus are drawn larger.
     Gold: the live links and what they reach (where the two are already one), the rotor once it runs, the joined casting. Dashed:
     Grok in Optimus (Musk "wants" it). Starlink into Cybercab is solid: Tesla's own post (P) shows the first Cybercab with it.
     Words: the eight names (all said). Figures: none; the receipts ride over with their dates.
       pull      the machine stands faint (a drawn head) ("And this is where things get really interesting"); +1.76 it comes up ("Step back")
       spacex    SpaceX's mark; launch +1.18, satellites +1.60, data centers +2.18, AI +3.38 each part and name on its word
       tesla     Tesla's mark; power +1.20, manufacturing at scale +1.64, robotics +2.94, autonomy +4.06
       better    the wheel starts to turn ("all of these are very accretive")
       power     Megapack to the data hall, the first feed; the wheel steps up ("Tesla's batteries helping power SpaceX's AI")
       starlink  satellite to Cybercab ("SpaceX's Starlink going into Cybercab")
       grok      AI to Cybercab ("Grok is already in Tesla cars"); +3.70 AI to Optimus, dashed ("Optimus")
       one       the halves close into one gold casting ("if they consolidate into one company"); +3.79 full speed ("indisputable")
     Steps from cue-map/vo-words.json `s` (board 0 = "and", 437.88); ?at= re-times them in this order (Davinci).
     Overlays (published in #bw-slots): the window tiles (o62, o63) and single windows (o33, o35) ride in the top band, clear of
     the machine and both marks.
     Capture contract: BW.run via HERO.run; ?capture ?final ?still ?beats ?t=<secs|label> ?motion=0 ?at= ?secs= ?noslot= -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div class="stage">
  <svg class="hero" id="s" viewBox="0 0 1920 1080"></svg>
  <div class="chrome"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js"></script>
<script src="shared/motion.js?v=5"></script>
<script src="assets/hero/sf.js"></script>
<script src="assets/hero/hero.js"></script>
<script src="assets/hero/iso.js"></script>
<script src="assets/hero/sf2.js"></script>
<script src="assets/hero/dc-model.js"></script>
<script src="assets/hero/cake.js"></script>
<script src="assets/hero/machine.js"></script>
<script>
const H = HERO, s = document.getElementById('s'); defs2(s);
const K = H.steps([['pull', 0], ['spacex', 4.34], ['tesla', 8.04], ['better', 14.55], ['power', 18.58], ['starlink', 22.06],
  ['grok', 25.2], ['one', 31.85]], 40.2);                          // as read, vo-words `s` (board 0 = "and", 437.88)
const NAMEAT = { launch: K.spacex + 1.18, satellites: K.spacex + 1.6, datacenters: K.spacex + 2.18, ai: K.spacex + 3.38,
  power: K.tesla + 1.2, manufacturing: K.tesla + 1.64, robotics: K.tesla + 2.94, autonomy: K.tesla + 4.06 };
const T_OPT = K.grok + 3.7, T_FULL = K.one + 3.38, T_UP = K.pull + 1.76;
['spacex_tesla_megapacks_2025', 'syn_robotaxi_post_first_cybercab_starlink_2026_08_10', 'syn_grok_in_tesla_vehicles', 'syn_optimus_grok_voice_q1_call_2026'].forEach(k => U(k));

const BW_ = 196, BD = 124, C = [98, 62], R = 33, ZB = 12, RP = 47;   // bedplate; rotor centre, rim radius; belt plane; pulley circle
/* the parts: [key, name, half, draw, x, y, w, d, scale] (x, y: the part's corner; w, d: its footprint at its scale) */
const PARTS = [
  ['power', 'Power', 'T', 'megapack', 4, 4, 16, 10, 1.5], ['manufacturing', 'Manufacturing at scale', 'T', 'factory', 2, 32, 20, 12, 1.5],
  ['autonomy', 'Autonomy', 'T', 'cybercab', 3, 62, 18, 8, 1.5], ['robotics', 'Robotics', 'T', 'optimus', 34, 92, 12, 8, 1.8],
  ['satellites', 'Satellites', 'S', 'starlink', 152, 2, 22, 8, 2.0], ['datacenters', 'Data centers', 'S', 'hall', 158, 28, 24, 13, 1.5],
  ['ai', 'AI', 'S', 'grok', 166, 58, 16, 5, 1.5], ['launch', 'Launch', 'S', 'starship', 168, 92, 14, 11, 1.5]];
const CEN = {}, PUL = {}, ANG = {};
PARTS.forEach(([k, , , , x, y, w, d, sc]) => { const cx = x + w * sc / 2, cy = y + d * sc / 2, a = Math.atan2(cy - C[1], cx - C[0]);
  CEN[k] = [cx, cy]; ANG[k] = a; PUL[k] = [C[0] + RP * Math.cos(a), C[1] + RP * Math.sin(a)]; });
/* the feeds, as the voice gives them. Each runs on its own track round the rotor (radius TR), entering and leaving on radial
   spurs, so no two feeds cross: [from, to, step, track radius, the way round (+1 clockwise on the plan, -1 counter), wanted] */
const LINKS = [['power', 'datacenters', 'power', 70, 1], ['satellites', 'autonomy', 'starlink', 54, 1], ['ai', 'autonomy', 'grok', 58, 1],
  ['ai', 'robotics', 'optimus', 62, 1, true]].map(([a, b, k, tr, dir, w]) => {
  let a0 = ANG[a], a1 = ANG[b]; let da = a1 - a0; while (dir > 0 && da < 0) da += 2 * Math.PI; while (dir < 0 && da > 0) da -= 2 * Math.PI;
  const L = [CEN[a], [C[0] + tr * Math.cos(a0), C[1] + tr * Math.sin(a0)]];
  for (let i = 1; i <= 48; i++) { const t = a0 + da * i / 48; L.push([C[0] + tr * Math.cos(t), C[1] + tr * Math.sin(t)]); }
  L.push(CEN[b]); return [a, b, k, L, w]; });
const V = fitView({ az: 16, elv: 44, world: [0, 0, BW_, BD, 22, -3], rect: [330, 190, 1600, 1010] });   // pushed in: the machine fills two thirds of the frame
const root = el(s, 'g', { 'stroke-linejoin': 'round' }), over = el(s, 'g');
const LSTEP = { power: K.power, starlink: K.starlink, grok: K.grok, optimus: T_OPT };

/* speed: a slow start on "accretive", a step per link, full speed on "indisputable"; the angle is integrated from 0 so any frame
   is exact */
function speedAt(t) { let w = 10 * H.go(t, K.better, K.better + 1.4); [['power', 14], ['starlink', 20], ['grok', 26], ['optimus', 14]].forEach(([k, dw]) => { w += dw * H.go(t, LSTEP[k] + .5, LSTEP[k] + 1.6); });
  return w + 150 * H.go(t, T_FULL, T_FULL + 2.4, H.ease.s); }
const _ang = new Map();
function angleAt(t) { const q = Math.round(t * 60) / 60; if (_ang.has(q)) return _ang.get(q); let a = 0; for (let u = 0; u < q; u += 1 / 60) a += speedAt(u) / 60; _ang.set(q, a); return a; }
const len = (L) => L.slice(1).reduce((a, p, i) => a + Math.hypot(p[0] - L[i][0], p[1] - L[i][1]), 0);
function at(L, d) { for (let i = 1; i < L.length; i++) { const sg = Math.hypot(L[i][0] - L[i - 1][0], L[i][1] - L[i - 1][1]); if (d <= sg) { const u = d / sg; return [L[i - 1][0] + (L[i][0] - L[i - 1][0]) * u, L[i - 1][1] + (L[i][1] - L[i - 1][1]) * u]; } d -= sg; } return L[L.length - 1]; }
function upto(L, d) { const o = [L[0]]; let acc = 0; for (let i = 1; i < L.length; i++) { const sg = Math.hypot(L[i][0] - L[i - 1][0], L[i][1] - L[i - 1][1]); if (acc + sg >= d) { o.push(at(L, d)); return o; } o.push(L[i]); acc += sg; } return o; }
/* a belt between a pulley (r1) and the rim (R): the two outer tangents and the pulley's far arc, on the belt plane */
function belt(g, p, r1, st) {
  const dx = C[0] - p[0], dy = C[1] - p[1], d = Math.hypot(dx, dy), ph = Math.atan2(dy, dx), al = Math.acos((r1 - R) / d);
  const T = (c, r, a) => [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a), ZB];
  line3(g, V, [T(p, r1, ph + al), T(C, R, ph + al)], st); line3(g, V, [T(p, r1, ph - al), T(C, R, ph - al)], st);
  const arc = []; for (let i = 0; i <= 16; i++) arc.push(T(p, r1, ph + al + i / 16 * (2 * Math.PI - 2 * al))); line3(g, V, arc, st);
}

function render(t) {
  root.replaceChildren();
  const head = .85 + .15 * H.go(t, T_UP - .2, T_UP + .8), live = {};   // lit from frame 0 (a dead head reads as black after the cut); full on "step back"
  LINKS.forEach(([a, b, k]) => { const u = H.go(t, LSTEP[k] + .4, LSTEP[k] + 1.0); live[a] = Math.max(live[a] || 0, u); live[b] = Math.max(live[b] || 0, u); });
  const run = H.go(t, K.better, K.better + .8), one = H.go(t, K.one + .2, K.one + 1.6);
  /* the bedplate, cast in two halves; on "consolidate" the halves close and the casting turns gold */
  const S0 = scene(), gap = .6 * (1 - one), bc = one > .5 ? GOLDC : LINE;
  box(S0, V, 0, 0, -3, BW_ / 2 - gap, BD, 3, { stroke: bc, sw: 2, bias: -1e7 }); box(S0, V, BW_ / 2 + gap, 0, -3, BW_ / 2 - gap, BD, 3, { stroke: bc, sw: 2, bias: -1e7 + 1 });
  const g0 = el(root, 'g', { opacity: head.toFixed(3) }); S0.paint(g0);
  if (one < 1) line3(g0, V, [[BW_ / 2, -6, 0], [BW_ / 2, BD + 8, 0]], { stroke: `rgba(245,241,229,${(.3 * (1 - one)).toFixed(3)})`, sw: 1.4, dash: '22 6 3 6' });
  /* the feeds on their tracks, laid in on their words; units ride them at one speed toward the part they feed */
  LINKS.forEach(([a, b, k, L, wanted]) => {
    const u = H.go(t, LSTEP[k], LSTEP[k] + 1.2); if (u <= 0) return; const Lt = len(L);
    line3(root, V, upto(L, Lt * u).map(([x, y]) => [x, y, .1]), { stroke: GOLDC, sw: 2.6, dash: wanted ? '10 8' : undefined });
    if (!wanted && t > LSTEP[k] + 1.2) { const S = scene(); for (let n = 0; ; n++) { const born = LSTEP[k] + 1.2 + n * .5, d = (t - born) * 26; if (born > t) break; if (d > Lt) continue;
      const [x, y] = at(L, d); box(S, V, x - .9, y - .9, .1, 1.8, 1.8, .9, { fill: GOLDC, stroke: 'var(--bg)', sw: 1 }); } S.paint(root); }
  });
  /* the parts: faint until named, cream once named, gold once a link reaches them */
  const SP = scene(), pg = el(root, 'g');
  PARTS.forEach(([k, , , draw, x, y, , , sc]) => { const nm = H.go(t, NAMEAT[k] - .1, NAMEAT[k] + .5), lv = (live[k] || 0) > .5;
    const gk = el(pg, 'g', { opacity: (head * (.35 + .65 * nm)).toFixed(3) }), Sk = scene();
    PART[draw](Sk, sub(V, x, y, 0, sc), 0, 0, lv ? GOLDC : LINE, gk, k === 'robotics' && lv); Sk.paint(gk); });
  /* each part's drive: a shaft on the ground from the part to its pulley, the pulley belted to the rim (gold once live) */
  const SB = scene(), bg = el(root, 'g', { opacity: head.toFixed(3) });
  PARTS.forEach(([k]) => { const [x, y] = PUL[k], lv = (live[k] || 0) > .5;
    line3(bg, V, [[CEN[k][0], CEN[k][1], .5], [x, y, .5]], { stroke: lv ? GOLDC : 'rgba(245,241,229,.3)', sw: lv ? 2.4 : 1.4 });
    cyl(SB, V, x, y, 0, 1.6, 2.2, { stroke: LINE, sw: 1.4 }); cyl(SB, V, x, y, 2.2, .8, ZB - 3.2, { stroke: LINE, sw: 1.2 });
    cyl(SB, V, x, y, ZB - 1, 3.4, 2, { stroke: lv ? GOLDC : LINE, sw: 1.6 }); });
  PARTS.forEach(([k]) => { const lv = (live[k] || 0) > .5;
    belt(bg, PUL[k], 3.4, { stroke: lv ? GOLDC : 'rgba(245,241,229,.32)', sw: lv ? 2.4 : 1.2, dash: k === 'robotics' && lv ? '8 6' : undefined }); });
  const gsb = el(root, 'g', { opacity: head.toFixed(3) }); SB.paint(gsb);
  /* the rotor: a bearing housing on the bedplate, the shaft, a heavy rim, six spokes, the hub and its nut */
  const th = angleAt(t) * Math.PI / 180, rc = run > .5 ? GOLDC : LINE, SR = scene(), gr = el(root, 'g', { opacity: head.toFixed(3) });
  cyl(SR, V, C[0], C[1], 0, 13, 4, { stroke: LINE, sw: 1.8, bands: [.5] });
  cyl(SR, V, C[0], C[1], 4, 3.4, 4, { stroke: LINE, sw: 1.6 });
  cyl(SR, V, C[0], C[1], 8, R, 10, { stroke: rc, sw: 2.4, bands: [.35, .65], detail: (g, V) => {
    ring(g, V, C[0], C[1], 18, R - 6.5, { stroke: rc, sw: 1.6 });
    for (let i = 0; i < 6; i++) { const a = th + i * Math.PI / 3, n = [-Math.sin(a), Math.cos(a)];
      [-1.6, 1.6].forEach(o => line3(g, V, [[C[0] + 6 * Math.cos(a) + n[0] * o * 1.3, C[1] + 6 * Math.sin(a) + n[1] * o * 1.3, 18], [C[0] + (R - 6.5) * Math.cos(a) + n[0] * o, C[1] + (R - 6.5) * Math.sin(a) + n[1] * o, 18]], { stroke: rc, sw: 1.6 })); }
    for (let i = 0; i < 48; i++) { const a = th + i * Math.PI / 24, r0 = R - (i % 4 ? 2.2 : 4.4);
      line3(g, V, [[C[0] + r0 * Math.cos(a), C[1] + r0 * Math.sin(a), 18], [C[0] + (R - .6) * Math.cos(a), C[1] + (R - .6) * Math.sin(a), 18]], { stroke: rc === LINE ? THIN : 'rgba(212,175,55,.7)', sw: 1.1 }); }
  } });
  cyl(SR, V, C[0], C[1], 18, 6, 3.5, { stroke: rc, sw: 2, bias: 40, fill: run > .5 ? GOLDC : INK });
  cyl(SR, V, C[0], C[1], 21.5, 2.6, 4, { stroke: LINE, sw: 1.6, bias: 50 });
  SR.paint(gr);
  /* the direction of rotation: a dimension-style arc over the rim, drawn once it turns */
  const du = H.go(t, K.better + .6, K.better + 1.2);
  if (du > 0) { const l = []; for (let i = 0; i <= 30; i++) { const a = -2.1 + i / 30 * 1.3; l.push([C[0] + (R + 7) * Math.cos(a), C[1] + (R + 7) * Math.sin(a), 18]); }
    const g = el(root, 'g', { opacity: du.toFixed(3) }); line3(g, V, l, { stroke: GOLDC, sw: 2 });
    const [x1, y1] = V.P(...l[30]), [x0, y0] = V.P(...l[27]), a = Math.atan2(y1 - y0, x1 - x0);
    el(g, 'path', { d: `M${x1},${y1} l${-16 * Math.cos(a - .45)},${-16 * Math.sin(a - .45)} M${x1},${y1} l${-16 * Math.cos(a + .45)},${-16 * Math.sin(a + .45)}`, stroke: GOLDC, 'stroke-width': 2, fill: 'none' }); }
}
H.on(render);

/* the names, in two columns beside their halves (leaders square to the frame), each on its word; the marks over their halves */
PARTS.forEach(([k, name, half, , x, y, w, d, sc]) => {
  const [px, sy] = V.P(half === 'T' ? x : x + w * sc, y + d * sc / 2, k === 'satellites' ? 13 * sc : 0), g = el(over, 'g'), col = 'rgba(245,241,229,.45)';   // the satellite is labelled in orbit
  const tx = half === 'T' ? 300 : 1630, anc = half === 'T' ? 'end' : 'start';   // the columns just inside the safe area
  el(g, 'line', { x1: px + (half === 'T' ? -12 : 12), y1: sy, x2: tx + (half === 'T' ? 16 : -16), y2: sy, stroke: col, 'stroke-width': 2 });
  const two = name.length > 14 ? [name.slice(0, name.indexOf(' ')), name.slice(name.indexOf(' ') + 1)] : null;   // a long name on two lines
  if (two) two.forEach((ln, i) => el(g, 'text', { x: tx, y: sy + 12 + (i - .5) * 38, class: 'nm', 'font-size': 34, 'text-anchor': anc }, ln));
  else el(g, 'text', { x: tx, y: sy + 12, class: 'nm', 'font-size': 34, 'text-anchor': anc }, name);
  H.show(g, NAMEAT[k] - .05, .45, T_FULL + .6, .6);
});
{ const g1 = el(over, 'g'); logo(g1, 'tesla', 300 - logoW('tesla', 34), 116, 34); H.show(g1, K.tesla, .5);
  const g2 = el(over, 'g'); logo(g2, 'spacex', 1630, 114, 38); H.show(g2, K.spacex, .5); }

/* overlays: Davinci's layer (cue sheet beats:07). One footage window at a time, 720x405 (readable at phone size), each over the
   half of the machine the voice is not on at that moment */
const WTL = { x: 64, y: 220, w: 720, h: 405 }, WBR = { x: 1136, y: 600, w: 720, h: 405 }, WBL = { x: 64, y: 600, w: 720, h: 405 }, WTR = { x: 1136, y: 40, w: 720, h: 405 };
H.owed('t07-power', 't07-optimus');
H.card('o62', K.spacex, K.spacex + 3.3, WTL, "SpaceX's four: one window, the clips in turn (REVIEW-008, REVIEW-015); over Tesla's half, not yet named");
H.card('o63', K.tesla, K.tesla + 3.3, WBR, "Tesla's four: one window, the clips in turn (REQ-007 rows 3, 1, 8 and 5); over SpaceX's lower half");
H.slot(s, 't07-power', WBL.x, WBL.y, WBL.w, WBL.h, K.power, K.power + 2.5, 'the Megafactory line (REVIEW-007); clear of the power feed');
H.slot(s, 't07-optimus', WTR.x, WTR.y, WTR.w, WTR.h, T_OPT - 1.8, T_OPT + 1.2, 'Optimus at work (REVIEW-007); clear of the Grok feeds');
H.run();
</script>
