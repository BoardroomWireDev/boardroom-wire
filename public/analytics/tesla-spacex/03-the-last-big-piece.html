/* a prism from a plan outline (any closed polygon), from z0 up h: faces filled without strokes (a curved knob must not read as
   fluting), then the outlines a draughtsman draws: visible bottom edges, verticals at real corners and at the silhouette, the top */
function prism(S, poly, z0, h, st) {
  const cx = poly.reduce((a, p) => a + p[0], 0) / poly.length, cy = poly.reduce((a, p) => a + p[1], 0) / poly.length;
  S.add(V.depth(Math.max(...poly.map(p => p[0])), Math.max(...poly.map(p => p[1])), z0) + (st.bias || 0), (g) => {
    const a = { stroke: st.stroke || LINE, 'stroke-width': st.sw || 2, 'stroke-linejoin': 'round', 'stroke-dasharray': st.dash || 'none' };
    const sides = [];
    for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length], nx = q[1] - p[1], ny = -(q[0] - p[0]);
      const mx = (p[0] + q[0]) / 2 - cx, my = (p[1] + q[1]) / 2 - cy, sg = nx * mx + ny * my >= 0 ? 1 : -1;
      if ((nx * V.sa + ny * V.ca) * sg > 1e-9) sides.push([V.depth((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, z0), p, q]); }
    sides.sort((u, v) => u[0] - v[0]).forEach(([, p, q]) => el(g, 'polygon', { points: pts(V, [[p[0], p[1], z0], [q[0], q[1], z0], [q[0], q[1], z0 + h], [p[0], p[1], z0 + h]]), fill: st.side || INK, stroke: st.side || INK, 'stroke-width': .6 }));
    const vis = new Set(sides.map(([, p]) => p));
    for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length]; if (vis.has(p)) el(g, 'line', { x1: V.P(p[0], p[1], z0)[0], y1: V.P(p[0], p[1], z0)[1], x2: V.P(q[0], q[1], z0)[0], y2: V.P(q[0], q[1], z0)[1], ...a }); }
    for (let i = 0; i < poly.length; i++) { const o = poly[(i + poly.length - 1) % poly.length], p = poly[i], q = poly[(i + 1) % poly.length];
      const a1 = Math.atan2(p[1] - o[1], p[0] - o[0]), a2 = Math.atan2(q[1] - p[1], q[0] - p[0]); let d = Math.abs(a2 - a1); if (d > Math.PI) d = 2 * Math.PI - d;
      const silh = vis.has(p) !== vis.has(o); if ((d > .44 && (vis.has(p) || vis.has(o))) || silh) el(g, 'line', { x1: V.P(p[0], p[1], z0)[0], y1: V.P(p[0], p[1], z0)[1], x2: V.P(p[0], p[1], z0 + h)[0], y2: V.P(p[0], p[1], z0 + h)[1], ...a }); }
    el(g, 'polygon', { points: pts(V, poly.map(([x, y]) => [x, y, z0 + h])), fill: st.top || INK, ...a });
    if (st.detail) st.detail(g);

}
const sq = (x, y, w = C, d = C) => [[x, y], [x + w, y], [x + w, y + d], [x, y + d]];
/* the one jigsaw cut: a neck 6 wide, a knob of radius 4.6, clean arcs, as a machinist draws it */
function knob(p, q, out) {
  const L = Math.hypot(q[0] - p[0], q[1] - p[1]), ux = (q[0] - p[0]) / L, uy = (q[1] - p[1]) / L, nx = -uy * out, ny = ux * out;
  const m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], N = 3, R = 4.6, o = [], cx = m[0] + nx * (R + 1.6), cy = m[1] + ny * (R + 1.6);
  o.push(p, [m[0] - ux * N, m[1] - uy * N], [m[0] - ux * N + nx * 1.6, m[1] - uy * N + ny * 1.6]);
  const a0 = Math.atan2((m[1] - uy * N + ny * 1.6) - cy, (m[0] - ux * N + nx * 1.6) - cx), a1 = Math.atan2((m[1] + uy * N + ny * 1.6) - cy, (m[0] + ux * N + nx * 1.6) - cx);
  let da = a1 - a0; const sgn = out > 0 ? 1 : -1; if (sgn * da > 0) da -= sgn * 2 * Math.PI;
  for (let i = 1; i < 24; i++) { const a = a0 + da * i / 24; o.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
  o.push([m[0] + ux * N + nx * 1.6, m[1] + uy * N + ny * 1.6], [m[0] + ux * N, m[1] + uy * N]);
  return o;
}
const teslaPlan = (x, y) => [[x, y], ...knob([x + C, y], [x + C, y + C], -1), [x + C, y + C], [x, y + C]];   // one tab, out of the right edge, onto open ground
/* a polyline cut to a fraction of its length (a line drawing in) */
function upto(P, u) { const L = []; let tot = 0; for (let i = 1; i < P.length; i++) { const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); L.push(d); tot += d; }
  let rem = tot * u; const o = [P[0]]; for (let i = 1; i < P.length && rem > 0; i++) { const f = Math.min(1, rem / L[i - 1]); o.push([P[i - 1][0] + (P[i][0] - P[i - 1][0]) * f, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * f]); rem -= L[i - 1]; } return o; }

    for (let T = 40; T < hS; T += 40) line3(g, V, [[sx, sy + C, T], [sx + C, sy + C, T], [sx + C, sy, T]], { stroke: 'rgba(245,241,229,.25)', sw: 1 });
    const iu = H.go(t, K.ipo + OFF.went, K.ipo + OFF.went + .8); if (iu > 0) { const z = IPO / ZU; line3(g, V, upto([[sx - 1.2, sy + C + 1.2], [sx + C + 1.2, sy + C + 1.2], [sx + C + 1.2, sy - 1.2]], iu).map(([a, b]) => [a, b, z]), { stroke: GOLDC, sw: 2.2, dash: '9 6' }); }

  } });

  const xa = xaiAt(t), hX = XAIV ? XAIV / ZU : 6;

    const h = 7, w = logoW('x', h); logo(el(g, 'g', { transform: onZ(V, xa.x + (C - w) / 2, xa.y + (C - h) / 2, hX) }), 'x', 0, 0, h); } });
  /* Cursor: a thin slab at true scale, docking into its cell on "$60 billion" */

  if (cu > 0) prism(S, sq(cc, cy0), cz, CUR / ZU, { stroke: asm > .5 ? GOLDC : LINE, bias: 3, detail: (g) => {
    const h = 6, w = logoW('cursor', h); logo(el(g, 'g', { transform: onZ(V, cc + (C - w) / 2, cy0 + (C - h) / 2, cz + CUR / ZU) }), 'cursor', 0, 0, h); } });
  /* Tesla: the only piece with the cut; it hovers over its socket, never fitted */

    for (let T = 40; T < hT; T += 40) if (T > bh) line3(g, V, [[ts.x, ts.y + C, ts.hov + T], [ts.x + C, ts.y + C, ts.hov + T], [ts.x + C, ts.y, ts.hov + T]], { stroke: 'rgba(245,241,229,.25)', sw: 1 });
    const w = logoW('tesla', 2.9); logo(el(g, 'g', { transform: onZ(V, ts.x + (C - w) / 2, ts.y + (C - 2.9) / 2, ts.hov + hT) }), 'tesla', 0, 0, 2.9);

  const fold = 1 - H.go(t, K.clue, K.clue + .8);

    /* two short lanes in the open gap between Tesla and xAI, one each way */

    el(g, 'text', { x: tx + o, y: p[1] + 40, class: 'fn', 'font-size': 36, 'text-anchor': an }, fig); };
  { const [x, y] = P(C / 2, C / 2, SV / ZU); oursO(put([x, y - 46], K.pieces + .8, 0, fmt.usdT(SV), 'fn', 40), 'rgba(245,241,229,.7)'); }
  { const [x, y] = P(0, C + 1.2, IPO / ZU); put([x - 18, y + 8], K.ipo + OFF.went + .4, 0, D('spacex_ipo_valuation', fmt.usdT(IPO)), 'fh', 44, 'end'); put([x - 18, y + 44], K.ipo + OFF.went + .5, 0, D_IPO, 'ax', 32, 'end', tick(1)); }
  /* xAI's value: on its left while it stands apart, on its right once docked (clear of Tesla either way) */
  { const xa = xaiAt(t), side = xa.u > .5, [x, y] = side ? P(xa.x + C, xa.y + C / 2, XAIV ? XAIV / ZU : 6) : P(xa.x + C / 2, xa.y + C / 2, XAIV ? XAIV / ZU : 6), dx = side ? 18 : 0, an = side ? 'start' : 'middle';
    if (!side) { if (XAIV) put([x, y - 56], K.pieces + .9, 0, D('xai_merger_value_xai', fmt.usdB(XAIV, 0)), 'fn', 36, 'middle'); }
    else lead(P(xa.x, xa.y + C * .5, 0), -150, D('xai_merger_value_xai', XAIV ? fmt.usdB(XAIV, 0) : ''), D_XAI, K.xai + OFF.bought + .6, tick(0)); }
  if (cu > 0) lead(P(2 * C + G, C + G + C * .7, 0), +150, D('spacex_cursor_price', fmt.usdB(CUR, 0)), D_CUR, K.cursor + OFF.sixty + .6, tick(2));
  { const ts = teslaAt(t), side = t >= K.clue + .6;
    if (side) { const [x, y] = P(ts.x + C, ts.y + C / 2, ts.hov + TV / ZU * .55); oursO(put([x + 22, y], K.clue + .6, 0, fmt.usdT(TV), 'fn', 44, 'start'), 'rgba(245,241,229,.7)'); }
    else { const [x, y] = P(ts.x + C / 2, ts.y + C / 2, TV / ZU); oursO(put([x, y - 46], K.pieces + .9, K.clue + .2, fmt.usdT(TV), 'fn', 40), 'rgba(245,241,229,.7)'); } }
  /* the ties' figures, until the clue folds them away */
  const fold = K.clue;
  { const [x, y] = P(TA[0] + C + 6, 46, 0); put([x + 14, y + 4], K.xai2b + OFF.two, fold, D('tesla_xai_investment_amount', fmt.usdB(XINV, 0)), 'fn', 36, 'start', 'var(--gold)'); put([x + 14, y + 40], K.xai2b + OFF.two + .1, fold, 'xAI', 'nm', 32, 'start'); put([x + 14, y + 76], K.xai2b + OFF.two + .1, fold, PER('tesla_xai_investment_amount', 'mon'), 'ax', 32, 'start'); }
  { const u = H.go(t, K.grok + .6, K.grok + 1.0) * (1 - H.go(t, fold, fold + .4)); if (u > 0) { const [x, y] = P(TA[0] + C + 6, 46, 0), g = el(over, 'g', { opacity: u.toFixed(3) }); logo(g, 'grok', x + 104, y + 18, 26); } }
  { const [x, y] = P((C + TA[0]) / 2 + 16, TA[1] + C * .3, 0); put([x, y + 40], K.megapack + OFF.mega, fold, D('spacex_tesla_megapacks_2025', fmt.usdM(MEGA)), 'fn', 36, 'middle', 'var(--gold)'); put([x, y + 76], K.megapack + OFF.mega + .1, fold, 'Megapack', 'nm', 32); put([x, y + 112], K.megapack + OFF.mega + .1, fold, PER('spacex_tesla_megapacks_2025', 'year'), 'ax', 32); }
  if (TERA) { const [x, y] = P(59, 60, 0); put([x, y + 50], K.terafab + OFF.chip + .3, fold, 'Terafab', 'nm', 32); put([x, y + 86], K.terafab + OFF.chip + .4, fold, TERA, 'ax', 32); }
  put([120, 96], 0, 0, fmt.day(F('spacex_market_cap_2026_10_16').asOf), 'ax', 32, 'start');
});
