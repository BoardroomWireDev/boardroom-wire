<title>The last big piece · Boardroom Wire</title>
<!-- TESLA-SPACEX · HERO · THE LAST BIG PIECE (Ive, 18 Oct 2026, night). Chapter 2, from "Nonetheless, the companies continue" to
     "And Tesla is the last big piece": 41.6 s (Scorsese's 2:46.1 to 3:27.7, HERO-CANDIDATES 03).
     The idea: entity blocks at true value on one dollar scale (230 px per $1 trillion), standing on one ground. First the two
     companies apart, already tied by a related-party ledger drawn between them (gold: where the two are already one): Tesla's
     $2B into xAI, the Megapacks SpaceX buys, Grok in Tesla's cars, Terafab (dashed, planned). Then the clue is SpaceX itself:
     Tesla steps back, a 2026 time strip runs out from SpaceX's block, and the pieces it has assembled land at their dates and at
     their true value (xAI with Grok and X, the IPO at $1.77T, Cursor for $60B), with the gap to Tesla dimensioned. Last, the
     three dates tick as precedent, and Tesla's block lifts across the board and hovers over SpaceX at the last gap: the one
     jigsaw edge on the board (LOOK: metaphor only where it pays the thumbnail, PRD_TS_03). It never fits: no deal is agreed.
     Grammar (LOOK-tesla-spacex.md): cream for each company and its facts; gold for the ties; dashed for what is planned
     (Terafab); our arithmetic carries a dashed underline (both market values, the gap).
       pieces     the ground, the scale, Tesla and SpaceX at true value, apart ("the companies continue")
       xai2b      the first tie: $2B, Tesla into xAI ("Tesla invested $2 billion into xAI")
       megapack   Megapack, $506M, Tesla to SpaceX ("SpaceX buys Tesla's Megapack batteries")
       grok       Grok's mark crosses to the Tesla side ("Grok is in Tesla's cars")
       terafab    Terafab, dashed, between them ("plan to build a chip factory together")
       clue       the ties fold away, Tesla steps back, the 2026 strip runs out of SpaceX ("the biggest clue is SpaceX itself")
       xai        the xAI piece lands at 2 Feb, with Grok and X ("it bought xAI, and with it Grok and X")
       ipo        $1.77T at 11 Jun; +3.4 s the gap to Tesla, $581B ("went public ... worth more than Tesla")
       cursor     the Cursor piece, $60B, at 14 Aug ("$60 billion in stock this year to buy Cursor")
       precedent  the three dates tick in turn ("there's a lot of precedent to work off of")
       last       Tesla lifts and hovers over SpaceX, its edge cut ("And Tesla is the last big piece"); hold
     Words on screen (rule 16, all the script's): xAI, Megapack, Terafab. Everything else is a figure, a date or a company's mark.
     Owed, held until their keys land (the board renders without them): xai_merger_value_xai (R, CNBC: "values ... xAI at $250
     billion", in the ledger's xai_merger_combined_value row; holds the xAI block, its marks still land at the date) and
     syn_terafab_announced (P, the S-1: March 2026; holds Terafab's date). Footage windows and receipt cards: Davinci's layer,
     rects in #bw-slots (owed).
     LOCK DAY (22 Oct): both values and the gap move with the prices; "worth more than Tesla" holds while the gap holds.
     Render: bw render dashboards/03-the-last-big-piece.html --at <times> --secs <s> --out <big-media path>
     Capture contract: BW.run via HERO.run; ?capture ?final ?still ?beats ?t=<secs|label> ?motion=0 ?at= ?secs= ?noslot= -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="stage">
  <svg class="hero" id="s" viewBox="0 0 1920 1080"></svg>
  <div class="chrome"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js"></script>
<script src="shared/motion.js?v=5"></script>
<script src="assets/hero/sf.js"></script>
<script src="assets/hero/hero.js"></script>
<script>
const H = HERO, s = document.getElementById('s'); el(s, 'defs');
const K = H.steps([['pieces', 0], ['xai2b', 2.89], ['megapack', 5.06], ['grok', 8.67], ['terafab', 10.48], ['clue', 15.9],
  ['xai', 18.43], ['ipo', 22.41], ['cursor', 27.47], ['precedent', 32.17], ['last', 39.04]], 41.6);

const CR = 'var(--cream)', GOLD = 'var(--gold)', INK = 'var(--bg)', DIM = 'rgba(245,241,229,.55)', LOWFILL = 'rgba(245,241,229,.07)';
const MY = (iso) => MON[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4);
const yearOf = (iso) => iso.slice(0, 4);

/* ---------------- the figures ---------------- */
const T = usd('tesla_market_cap_cover_shares_2026_10_16'), S = usd('spacex_market_cap_2026_10_16');
const gap = usd('c_mcap_gap_2026_10_16'), ipo = U('spacex_ipo_valuation'), cursorV = usd('spacex_cursor_price');
const xaiInv = usd('tesla_xai_investment_amount'), mega = usd('spacex_tesla_megapacks_2025');
const xaiV = has('xai_merger_value_xai') ? usd('xai_merger_value_xai') : null;
const terafabOn = has('syn_terafab_announced') ? U('syn_terafab_announced') : null;
used.add('syn_terafab_framework'); used.add('syn_grok_in_tesla_vehicles');
const D_XAI = U('xai_merger_date'), D_CUR = U('spacex_cursor_deal_closed'), D_IPO = F('spacex_ipo_valuation').asOf;
for (const [k, v] of Object.entries({ T, S, gap, ipo, cursorV, xaiInv, mega })) if (!isFinite(v)) throw new Error('figure ' + k + ' is not a number in data.js');
calc = true;

/* ---------------- one ground, one dollar scale ---------------- */
const G = 900, KV = 230 / 1e12, EW = 200, TX = 130, SX = 1520, HT = T * KV, HS = S * KV, PW = 120;
const AX = 1764;
const head = (t) => .34 + .66 * H.go(t, K.pieces + .1, K.pieces + .8);
H.on(((n) => (t) => n.setAttribute('opacity', head(t).toFixed(3)))(el(s, 'line', { x1: 80, x2: AX, y1: G, y2: G, stroke: DIM, 'stroke-width': 2 })));
/* the value scale, right: $0, $1T, $2T */
{ const g = el(s, 'g');
  el(g, 'line', { x1: AX, x2: AX, y1: G, y2: G - 2.1e12 * KV, stroke: DIM, 'stroke-width': 2 });
  [0, 1, 2].forEach(tr => { const y = G - tr * 1e12 * KV;
    el(g, 'line', { x1: AX, x2: AX + 10, y1: y, y2: y, stroke: DIM, 'stroke-width': 2 });
    el(g, 'text', { x: AX + 18, y: y + 10, class: 'ax', 'font-size': 28 }, tr ? '$' + tr + 'T' : '$0'); });
  H.fade(g, K.pieces + .5, .6); }

/* an entity block on the ground: outline, low fill, its mark, its value (ours, underlined) */
function blockPath(x, top, w, bot, cut) {   // cut: 'tab' (a knob below the bottom edge) or 'socket' (a cavity in the top edge)
  const cx = x + w / 2, n = 14, r = 20;
  if (cut === 'tab') return `M${x},${top} H${x + w} V${bot} H${cx + n} v6 A${r},${r} 0 1 1 ${cx - n},${bot + 6} v-6 H${x} Z`;
  if (cut === 'socket') return `M${x},${top} H${cx - n} v6 A${r},${r} 0 1 0 ${cx + n},${top + 6} v-6 H${x + w} V${bot} H${x} Z`;
  return `M${x},${top} H${x + w} V${bot} H${x} Z`;
}
function entity(name, x, h, v, key) {
  const g = el(s, 'g'), top = G - h;
  el(g, 'rect', { x, y: top, width: EW, height: h, fill: INK });          // an opaque ground, so a block in flight hides what it passes
  const plain = el(g, 'path', { d: blockPath(x, top, EW, G), fill: LOWFILL, stroke: CR, 'stroke-width': 2 });
  const lh = name === 'tesla' ? 22 : 19;
  logo(g, name, x + (EW - logoW(name, lh)) / 2, top + 58, lh);
  const n = el(g, 'text', { x: x + EW / 2, y: top + 130, class: 'fn', 'font-size': 40, 'text-anchor': 'middle' }, D(key, fmt.usdT(v)));
  if (isCalc(key)) ours(n, CR, 10, 2);
  H.on((t) => g.setAttribute('opacity', head(t).toFixed(3)));
  return { g, plain, top };
}
const eT = entity('tesla', TX, HT, T, 'tesla_market_cap_cover_shares_2026_10_16');
const eS = entity('spacex', SX, HS, S, 'spacex_market_cap_2026_10_16');

/* ---------------- part 1: the related-party ledger between them (gold: already one) ---------------- */
const L0 = TX + EW, L1 = SX, LM = (L0 + L1) / 2;
const gTies = el(s, 'g');
H.on((t) => { const u = 1 - H.go(t, K.clue - .2, K.clue + .5); gTies.setAttribute('opacity', u.toFixed(3)); gTies.style.display = u < .002 ? 'none' : ''; });
function tie(y, dir, a, label, date, dashed = false) {
  const g = el(gTies, 'g');
  const ln = el(g, 'line', { x1: dir > 0 ? L0 : L1, x2: dir > 0 ? L1 - 2 : L0 + 2, y1: y, y2: y, stroke: GOLD, 'stroke-width': 3, 'stroke-dasharray': dashed ? '12 8' : 'none' });
  if (dashed) H.wipe(ln, a, .8, 'x'); else H.draw(ln, a, .8);
  if (dir) { const xe = dir > 0 ? L1 - 2 : L0 + 2;
    H.show(el(g, 'path', { d: `M${xe},${y} l${-dir * 18},-8 v16 Z`, fill: GOLD }), a + .7, .2); }
  const lg = el(g, 'g'); label(lg, y); H.rise(lg, a + .4);
  if (date) H.rise(el(g, 'text', { x: L1 - 24, y: y - 16, class: 'ax', 'font-size': 28, 'text-anchor': 'end' }, date), a + .6);
  return g;
}
const Y1 = 640, Y2 = 712, Y3 = 784, Y4 = 856;
tie(Y1, 1, K.xai2b + .1, (g, y) => {
  el(g, 'text', { x: L0 + 28, y: y - 16, class: 'fn', 'font-size': 36, style: 'fill:var(--gold)' }, D('tesla_xai_investment_amount', fmt.usdB(xaiInv, 0)));
  el(g, 'text', { x: L0 + 28 + 4 * 21.6 + 18, y: y - 16, class: 'nm', 'font-size': 32 }, 'xAI'); }, MY(F('tesla_xai_investment_amount').asOf));
tie(Y2, 1, K.megapack + .1, (g, y) => {
  el(g, 'text', { x: L0 + 28, y: y - 16, class: 'nm', 'font-size': 32 }, 'Megapack');
  el(g, 'text', { x: L0 + 28 + 184, y: y - 16, class: 'fn', 'font-size': 36, style: 'fill:var(--gold)' }, D('spacex_tesla_megapacks_2025', fmt.usdM(mega))); },
  yearOf(F('spacex_tesla_megapacks_2025').asOf));
/* Grok: the mark crosses from SpaceX's side and comes to rest on Tesla's */
{ const g = tie(Y3, -1, K.grok + .1, () => {}, MY(F('syn_grok_in_tesla_vehicles').asOf));
  const mk = logo(g, 'grok', L0 + 28, Y3 - 44, 28);
  H.path(mk, [[K.grok + .1, L1 - L0 - 160, 0, 0], [K.grok + .3, L1 - L0 - 160, 0, 1], [K.grok + 1.4, 0, 0, 1]]); }
/* Terafab: planned, so dashed; a dashed outline between them, no direction */
{ const g = tie(Y4, 0, K.terafab + .2, () => {}, terafabOn ? MY(String(terafabOn)) : null, true);
  const bw = 196, bx = LM - bw / 2, b = el(g, 'g');
  el(b, 'rect', { x: bx, y: Y4 - 30, width: bw, height: 60, fill: INK, stroke: GOLD, 'stroke-width': 2, 'stroke-dasharray': '8 6' });
  el(b, 'text', { x: LM, y: Y4 + 11, class: 'nm', 'font-size': 32, 'text-anchor': 'middle' }, 'Terafab');
  H.rise(b, K.terafab + 1.0); }

/* ---------------- part 2: the clue is SpaceX itself ---------------- */
/* Tesla steps back on "the biggest clue", and comes forward again for the last line */
H.on((t) => eT.g.parentNode && eT.g.setAttribute('opacity', (head(t) * (1 - .62 * H.go(t, K.clue, K.clue + .6) * (1 - H.go(t, K.last - .5, K.last)))).toFixed(3)));
/* the 2026 strip runs out of SpaceX's block, right to left */
const tx = tlin('2026-01-01', F('spacex_market_cap_2026_10_16').asOf, 470, SX + EW / 2);
{ const g = el(s, 'g');
  el(g, 'line', { x1: tx('2026-01-01'), x2: SX, y1: G, y2: G, stroke: CR, 'stroke-width': 3 });
  for (let m = 1; m <= 10; m++) { const x = tx('2026-' + String(m).padStart(2, '0') + '-01');
    el(g, 'line', { x1: x, x2: x, y1: G, y2: G + 10, stroke: DIM, 'stroke-width': 2 });
    if ((m - 1) % 3 === 0) el(g, 'text', { x, y: G + 42, class: 'ax', 'font-size': 28, 'text-anchor': 'middle' }, MON[m - 1]); }
  el(g, 'text', { x: tx('2026-01-01'), y: G + 80, class: 'ax', 'font-size': 28, 'text-anchor': 'middle' }, '2026');
  H.wipe(g, K.clue + .3, 1.2, '-x'); }

/* a piece lands at its date, at true value (no overshoot) */
function piece(dateIso, v, a) {
  const cx = tx(dateIso), h = Math.max(v * KV, 2), r = el(s, 'rect', { x: cx - PW / 2, y: G - h, width: PW, height: h, fill: CR });
  H.path(r, [[a, 0, -140, 0], [a + .15, 0, -140, 1], [a + .7, 0, 0, 1]]);
  return { cx, h };
}
/* xAI, with Grok and X, at 2 Feb */
{ const cx = tx(D_XAI), h = xaiV !== null ? piece(D_XAI, xaiV, K.xai + .3).h : 0, top = G - h;
  const g = el(s, 'g');
  logo(g, 'grok', cx - PW / 2, top - 46, 24); logo(g, 'x', cx - PW / 2 + logoW('grok', 24) + 16, top - 46, 24);
  el(g, 'text', { x: cx - PW / 2, y: top - 66, class: 'nm', 'font-size': 32 }, 'xAI');
  if (xaiV !== null) el(g, 'text', { x: cx - PW / 2 + 66, y: top - 66, class: 'fn', 'font-size': 36 }, D('xai_merger_value_xai', fmt.usdB(xaiV, 0)));
  H.rise(g, K.xai + .8); }
/* the IPO: SpaceX's value on the day it went public, a column of the same kind as the block it became */
const ipoX = tx(D_IPO), ipoH = ipo * KV;
/* the gap to Tesla on "worth more than Tesla": Tesla's top carried across, dimensioned at SpaceX */
{ const a = K.ipo + 3.4, yT = G - HT, yS = G - HS, g = el(s, 'g');
  el(g, 'line', { x1: TX + EW + 8, x2: SX - 8, y1: yT, y2: yT, stroke: DIM, 'stroke-width': 2, 'stroke-dasharray': '3 6' });
  H.wipe(g, a, .9, 'x'); H.show(g, a, .01, K.last - .3, .4);
  const dg = dim(s, SX - 26, yT, SX - 26, yS, CR); H.draw(dg, a + .8, .4); H.show(dg, a, .01, K.last - .3, .4);
  const n = el(s, 'text', { x: SX - 44, y: (yT + yS) / 2 + 13, class: 'fn', 'font-size': 36, 'text-anchor': 'end' }, D('c_mcap_gap_2026_10_16', fmt.usdB(gap, 0)));
  const ng = el(s, 'g'); ng.appendChild(n); if (isCalc('c_mcap_gap_2026_10_16')) ours(n, CR, 10, 2); H.rise(ng, a + 1.0, .55, 18, K.last - .3); }
{ const r = el(s, 'rect', { x: ipoX - PW / 2, y: G - ipoH, width: PW, height: ipoH, fill: INK, stroke: CR, 'stroke-width': 2 });
  el(s, 'rect', { x: ipoX - PW / 2, y: G - ipoH, width: PW, height: ipoH, fill: LOWFILL });
  const gi = el(s, 'g'); gi.appendChild(r.nextSibling); gi.insertBefore(r, gi.firstChild);
  H.grow(gi, K.ipo + .3, 1.0, 0, G, 'y');
  H.rise(el(s, 'text', { x: ipoX, y: G - ipoH - 18, class: 'fn', 'font-size': 40, 'text-anchor': 'middle' }, D('spacex_ipo_valuation', fmt.usdT(ipo))), K.ipo + 1.1); }
/* Cursor, $60B in stock, at 14 Aug */
{ const p = piece(D_CUR, cursorV, K.cursor + .4), g = el(s, 'g'), top = G - p.h;
  logo(g, 'cursor', p.cx - PW / 2, top - 58, 40);
  el(g, 'text', { x: p.cx - PW / 2 + 54, y: top - 25, class: 'fn', 'font-size': 36 }, D('spacex_cursor_price', fmt.usdB(cursorV, 0)));
  H.rise(g, K.cursor + .9); }
/* precedent: the three dates tick in turn */
[[D_XAI, 'xai_merger_date'], [D_IPO, null], [D_CUR, 'spacex_cursor_deal_closed']].forEach(([iso], i) => {
  const x = tx(iso), g = el(s, 'g'), a = K.precedent + .3 + .55 * i;
  el(g, 'line', { x1: x, x2: x, y1: G - 2, y2: G + 22, stroke: CR, 'stroke-width': 4 });
  el(g, 'text', { x, y: G + 80, class: 'fn', 'font-size': 28, 'text-anchor': 'middle' }, +iso.slice(8, 10) + ' ' + MON[+iso.slice(5, 7) - 1]);
  H.rise(g, a, .45, 10); });

/* ---------------- the last big piece: Tesla lifts and hovers over SpaceX, the one cut edge on the board ---------------- */
{ const dx = SX - TX, hoverBot = G - HS - 70, dy = hoverBot - G, a = K.last - .1;
  H.path(eT.g, [[a, 0, 0], [a + 1.5, dx, dy]]);
  const tabG = el(eT.g, 'path', { d: blockPath(TX, G - HT, EW, G, 'tab'), fill: INK });
  const tab = el(eT.g, 'path', { d: blockPath(TX, G - HT, EW, G, 'tab'), fill: LOWFILL, stroke: CR, 'stroke-width': 2 });
  eT.g.insertBefore(tabG, eT.plain.nextSibling); eT.g.insertBefore(tab, tabG.nextSibling);      // under the mark and the value
  H.on((t) => { const u = H.go(t, a + .5, a + 1.1); tab.setAttribute('opacity', u.toFixed(3)); tabG.setAttribute('opacity', u.toFixed(3)); eT.plain.setAttribute('opacity', (1 - u).toFixed(3)); });
  const sock = el(eS.g, 'path', { d: blockPath(SX, G - HS, EW, G, 'socket'), fill: LOWFILL, stroke: CR, 'stroke-width': 2 });
  eS.g.insertBefore(sock, eS.plain.nextSibling);
  H.on((t) => { const u = H.go(t, a + .5, a + 1.1); sock.setAttribute('opacity', u.toFixed(3)); eS.plain.setAttribute('opacity', (1 - u).toFixed(3)); }); }

/* Tesla travels in front of everything it passes */
s.appendChild(eT.g.parentNode);

/* footage windows and receipt cards: Davinci's layer (cue sheet o08 to o12, o60); all owed until delivered */
const A = { x: 600, y: 80, w: 640, h: 360 };
H.owed('t03-megapack', 't03-grok', 't03-ipo', 't03-cursor');
H.slot(s, 't03-megapack', A.x, A.y, A.w, A.h, K.megapack + .05, K.megapack + 3.65, "SpaceX's Megapacks at its data centre (REQ-007 row 4)");
H.slot(s, 't03-grok', A.x, A.y, A.w, A.h, K.grok, K.grok + 3.0, 'Grok in a Tesla, in-car footage (REQ-007 row 10)');
H.card('o10', K.terafab + 2.9, K.terafab + 6.4, A, "SpaceX's S-1 on Terafab (REQ-006 row 6)");
H.card('o11', K.xai, K.xai + 3.5, A, 'the xAI merger (REQ-004 row 8)');
H.slot(s, 't03-ipo', A.x, A.y, A.w, A.h, K.ipo, K.ipo + 3.5, "SpaceX's listing day (REQ-008 row 13)");
H.slot(s, 't03-cursor', A.x, A.y, A.w, A.h, K.cursor, K.cursor + 3.5, 'Cursor (library A_cursor-3-intro_UxbULt_hCdA)');

H.run();
</script>
