/* a register (the combined votes, 09's tower language): a column of 100 courses, a hairline every 1%, firmer every 10%; his part

/* a pile of 100 share discs (one per 1%), 04's disc stacked: the front half of every disc's rim drawn, every tenth firmer; his discs

const rimHalf = (x, z) => { const cx = x + PR, cy = PR, l = []; for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2, p = [cx + PR * Math.cos(a), cy + PR * Math.sin(a), z];

function pile(S, x, f, st) {
