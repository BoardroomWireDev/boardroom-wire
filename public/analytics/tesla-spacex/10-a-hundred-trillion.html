<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A hundred trillion · Boardroom Wire</title>
<!-- TESLA-SPACEX · HERO · A HUNDRED TRILLION (Ive, 18 Oct 2026). Chapter 5, from "Musk, of course, thinks a lot bigger" to "in
     charge of getting there": about 62 s at the writer's 166 wpm.
     The idea: 09's pull-back in reverse. SpaceX's value today stands as a real bar on a $0-$4T axis; as Musk's claims arrive the
     axis climbs (to $60T for Baron's band, to $110T for his $100T) and today's $1.98T becomes a hairline at the foot. Every claim
     is drawn dashed (his, not ours); the ten-year path is our arithmetic of his number, a dashed staircase of ten yearly steps of
     about 48%, from today's value to his. "I'm not underwriting that $100 trillion number": everything above today greys back.
     Two small panels on the left carry the other two claims on their own scales: SpaceX's revenue against his $1 trillion target
     (the target slides from 2031 to 2030), and Tesla's value with the 80% he says will be Optimus.
     Grammar (LOOK-tesla-spacex.md): cream for facts; dashed for claims and for our hypothetical path; our arithmetic underlined;
     no gold (nothing here is the combined company); "more than" fades with no edge.
       bigger     the axis and today's value are drawn from frame 0; the value lands ("thinks a lot bigger")
       trillion   left: SpaceX's 2025 revenue, a sliver, and the $1T target, dashed, at 2031 ("a trillion dollars in revenue")
       moved      the target slides to 2030; 2031 stays as a ghost ("moved up from 2031 to 2030")
       optimus    left: Tesla's value, and the 80% Musk says will be Optimus, dashed ("80% of Tesla's value will be Optimus")
       baron      the axis climbs to $60T; Baron's $20T-$50T band, dashed, at ten years ("$20 to $50 trillion")
       hundred    the axis climbs to $110T; >$100T, a dashed rule ("more than $100 trillion")
       years      the ten years as a dimension line over the chart ("in less than 10 years")
       notours    everything above today greys back ("I'm not underwriting")
       curve      ten yearly steps from $1.98T, each about 48% on the last ("Getting from about $2 trillion today")
       growth     ~48% a year, ours ("roughly 48% a year")
       fathom     hold on the top of the path
       bet        the left panels step back; the path holds ("So the price is a bet")
       charge     the hand-off to board 11 ("in charge")
     Words on screen (rule 16, the script's): revenue, Optimus, 10 years. Marks: SpaceX, Tesla.
     Held until data.js carries the numbers it reads from these rows' words (fld, BW_HELD): musk_claim_spacex_1t_revenue_2030_q2_call
     n 1e12, from 2031, to 2030; musk_claim_spacex_parent_fan_post_baron_2026 lo 2e13, hi 5e13 (tier X: no credit);
     musk_claim_spacex_100t_10y_2026 n 1e14.
     Render: bw render dashboards/10-a-hundred-trillion.html --at <times> --secs <s> --out <big-media path>
     Capture contract: BW.run via HERO.run; ?capture ?final ?still ?beats ?t=<secs|label> ?motion=0 ?at= ?secs= -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/brand.css?v=5">
<link rel="stylesheet" href="assets/hero/hero.css">
</head>
<body>
<div class="stage">
  <svg class="hero" id="s" viewBox="0 0 1920 1080"></svg>
  <div class="chrome"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js"></script>
<script src="shared/motion.js?v=5"></script>
<script src="assets/hero/sf.js"></script>
<script src="assets/hero/hero.js"></script>
<script>
const H = HERO, s = document.getElementById('s'); el(s, 'defs');
const K = H.steps([['bigger', 2.2], ['trillion', 7.6], ['moved', 9.4], ['optimus', 13.7], ['baron', 23.5], ['hundred', 30.4],
  ['years', 32.2], ['notours', 33.6], ['curve', 39.0], ['growth', 44.5], ['fathom', 50.6], ['bet', 54.2], ['charge', 60.7]], 63.0);
const CR = 'var(--cream)', DIM = 'rgba(245,241,229,.55)', FAINT = 'rgba(245,241,229,.18)';

/* ---------------- the figures ---------------- */
const sxVal = usd('spacex_market_cap_2026_10_16'), sxRev = usd('spacex_fy2025_revenue_total'), tsVal = usd('tesla_market_cap_cover_shares_2026_10_16');
const opt = fld('musk_claim_tesla_optimus_80pct_of_value_2025', 'n');
const tgt = fld('musk_claim_spacex_1t_revenue_2030_q2_call', 'n'), tFrom = fld('musk_claim_spacex_1t_revenue_2030_q2_call', 'from'),
  tTo = fld('musk_claim_spacex_1t_revenue_2030_q2_call', 'to');
const bLo = fld('musk_claim_spacex_parent_fan_post_baron_2026', 'lo'), bHi = fld('musk_claim_spacex_parent_fan_post_baron_2026', 'hi');
const hund = fld('musk_claim_spacex_100t_10y_2026', 'n');
const g48 = U('musk_claim_c_100t_implied_growth');
const TR = 1e12;
calc = true;

/* ---------------- the value chart: one linear axis that climbs as the claims arrive ---------------- */
const XL = 820, XR = 1780, YB = 920, YT = 140, NOW = '2026-10-16', END = '2036-10-16', tx = tlin(NOW, END, XL + 40, XR);
const yMaxAt = (t) => { const a = H.go(t, K.baron - .3, K.baron + 1.1), b = H.go(t, K.hundred - .3, K.hundred + .9);
  return H.mix(H.mix(4 * TR, 60 * TR, a), 110 * TR, b); };
const yv = (v, t) => YB - v / yMaxAt(t) * (YB - YT);
/* a left-to-right wipe over a fixed span (for marks whose geometry is set at paint time, so H.wipe cannot measure them) */
let _wx = 0;
function wipeX(n, a, d, x0, x1, e = H.ease.io) {
  const id = 'wx' + (++_wx), cp = el(s.querySelector('defs'), 'clipPath', { id, clipPathUnits: 'userSpaceOnUse' });
  const r = el(cp, 'rect', { x: x0, y: 0, width: 0, height: 1080 }); n.setAttribute('clip-path', `url(#${id})`);
  H.on((t) => r.setAttribute('width', ((x1 - x0) * H.go(t, a, a + d, e)).toFixed(2))); return n;
}
const gC = el(s, 'g');
/* the axis and its ticks: each domain's ticks fade in as it becomes the scale; positions follow the moving scale */
el(gC, 'line', { x1: XL, x2: XL, y1: YB, y2: YT - 10, stroke: DIM, 'stroke-width': 2 });
el(gC, 'line', { x1: XL, x2: XR + 40, y1: YB, y2: YB, stroke: DIM, 'stroke-width': 2 });
const TICKS = [[[1, 2, 3, 4], (t) => 1 - H.go(t, K.baron - .3, K.baron + .4)],
  [[20, 40, 60], (t) => H.go(t, K.baron + .2, K.baron + .9) * (1 - H.go(t, K.hundred - .3, K.hundred + .2))],
  [[20, 40, 60, 80, 100], (t) => H.go(t, K.hundred + .1, K.hundred + .8)]];
TICKS.forEach(([vals, op]) => vals.forEach(v => { const g = el(gC, 'g');
  const ln = el(g, 'line', { x1: XL - 10, x2: XR + 40, stroke: FAINT, 'stroke-width': 2 });
  const tt = el(g, 'text', { x: XL - 18, class: 'ax', 'font-size': 28, 'text-anchor': 'end' }, '$' + v + 'T');
  H.on((t) => { const y = yv(v * TR, t), o = op(t); ln.setAttribute('y1', y.toFixed(2)); ln.setAttribute('y2', y.toFixed(2));
    tt.setAttribute('y', (y + 10).toFixed(2)); g.setAttribute('opacity', o.toFixed(3)); g.style.display = o < .002 || y < YT - 30 ? 'none' : ''; }); }));
el(gC, 'text', { x: XL - 18, y: YB + 10, class: 'ax', 'font-size': 28, 'text-anchor': 'end' }, '$0');
for (let yr = 2027; yr <= 2036; yr++) el(gC, 'line', { x1: tx(yr + '-10-16'), x2: tx(yr + '-10-16'), y1: YB, y2: YB + 10, stroke: DIM, 'stroke-width': 2 });
[['2026', NOW], ['2031', '2031-10-16'], ['2036', END]].forEach(([lb, d]) => el(gC, 'text', { x: tx(d), y: YB + 44, class: 'ax', 'font-size': 28, 'text-anchor': 'middle' }, lb));

/* today's value: a real bar on the first scale, a hairline by the end */
{ const bw = 30, x = tx(NOW) - bw / 2, r = el(gC, 'rect', { x, width: bw, fill: CR });
  /* its figure and whose it is (SpaceX's mark beside the figure) ride the top of the bar */
  const lb = el(gC, 'g'), tx0 = x + bw + 14;
  el(lb, 'text', { x: tx0, y: 0, class: 'fn', 'font-size': 40 }, fmt.usdT(sxVal));
  logo(lb, 'spacex', tx0 + 6 * 24 + 16, -26, 24);
  /* once the axis has climbed, the figure lifts clear of the path on a thin leader */
  const ld = el(gC, 'line', { stroke: DIM, 'stroke-width': 2 });
  H.on((t) => { const y = yv(sxVal, t), m = H.go(t, K.hundred, K.hundred + .9), ly = H.mix(Math.min(y + 30, YB - 14), YB - 110, m);
    r.setAttribute('y', y.toFixed(2)); r.setAttribute('height', (YB - y).toFixed(2)); lb.setAttribute('transform', `translate(0,${ly.toFixed(2)})`);
    ld.setAttribute('x1', (x + bw / 2).toFixed(2)); ld.setAttribute('y1', (y - 6).toFixed(2)); ld.setAttribute('x2', (tx0 - 4).toFixed(2)); ld.setAttribute('y2', (ly + 8).toFixed(2));
    ld.setAttribute('opacity', m.toFixed(3)); });
  const lw = el(gC, 'g'); lw.appendChild(lb); H.rise(lw, K.bigger, .5); }

/* everything above today greys back on "I'm not underwriting" */
const gClaims = el(s, 'g');
H.on((t) => gClaims.setAttribute('opacity', (1 - .55 * H.go(t, K.notours, K.notours + .8)).toFixed(3)));

/* Baron's band: a dashed range at ten years (context: tier X, so no credit) */
if (bLo !== null && bHi !== null) { const r = el(gClaims, 'rect', { x: tx(END) - 18, width: 36, fill: 'none', stroke: CR, 'stroke-width': 2, 'stroke-dasharray': '8 6' });
  const lb = el(gClaims, 'text', { x: tx(END) - 34, class: 'fn', 'font-size': 36, 'text-anchor': 'end' }, fmt.usdT(bLo, 0) + '–' + fmt.usdT(bHi, 0));
  H.on((t) => { const y0 = yv(bHi, t), y1 = yv(bLo, t); r.setAttribute('y', y0.toFixed(2)); r.setAttribute('height', (y1 - y0).toFixed(2));
    lb.setAttribute('y', ((y0 + y1) / 2 + 12).toFixed(2)); });
  H.fade(r, K.baron + .6, .5); H.rise(lb, K.baron + 1.0, .5); }

/* Musk's >$100T: a dashed rule at $100T ("more than" is the ">" in its figure; no fade, which read as a glow: Jarvis, 19 Oct),
   and the ten years as a dimension line */
if (hund !== null) { const g = el(gClaims, 'g');
  const ln = el(g, 'line', { x1: tx(NOW), x2: tx(END) + 18, stroke: CR, 'stroke-width': 3, 'stroke-dasharray': '12 8' });
  const lb = el(g, 'text', { x: tx(END) - 34, class: 'fn', 'font-size': 44, 'text-anchor': 'end' }, '>' + fmt.usdT(hund, 0));
  H.on((t) => { const y = yv(hund, t); ln.setAttribute('y1', y.toFixed(2)); ln.setAttribute('y2', y.toFixed(2));
    lb.setAttribute('y', (y - 18).toFixed(2)); });
  wipeX(ln, K.hundred + .7, .9, tx(NOW), tx(END) + 18); H.rise(lb, K.hundred + 1.0, .5);
  const dy = YT - 44, gd = el(gClaims, 'g');
  dim(gd, tx(NOW), dy, tx(END), dy, DIM);
  el(gd, 'text', { x: (tx(NOW) + tx(END)) / 2, y: dy - 16, class: 'fn', 'font-size': 32, 'text-anchor': 'middle', style: 'fill:rgba(245,241,229,.8)' }, '10 years');
  H.wipe(gd, K.years - .2, .8, 'x'); }

/* the path, ours: ten yearly steps from today's value, each about 48% on the last, drawn as a dashed staircase */
{ let d = '', v = sxVal; const P = [];
  for (let n = 0; n <= 10; n++) { P.push([tx((2026 + n) + '-10-16'), v]); v *= 1 + g48 / 100; }
  const path = el(s, 'path', { fill: 'none', stroke: CR, 'stroke-width': 3, 'stroke-dasharray': '10 7', 'stroke-linejoin': 'miter' });
  H.on((t) => { let dd = ''; P.forEach(([x, val], i) => { const y = yv(val, t);
      dd += i ? ` H${x.toFixed(1)} V${y.toFixed(1)}` : `M${x.toFixed(1)},${y.toFixed(1)}`; }); path.setAttribute('d', dd); });
  const gp = el(s, 'g'); gp.appendChild(path); wipeX(gp, K.curve, 4.2, tx(NOW) - 4, tx(END) + 4, H.ease.lin);
  const yEnd = (v) => YB - v / (110 * TR) * (YB - YT);         // the label lands after the last climb, on the final scale
  const lb = el(s, 'text', { x: tx('2027-10-16'), y: yEnd(P[4][1]) - 120, class: 'fn', 'font-size': 44 }, D('musk_claim_c_100t_implied_growth', '~' + g48 + '% a year'));
  const lg = el(s, 'g'); lg.appendChild(lb); ours(lb, CR, 10, 2); H.rise(lg, K.growth); }

/* ---------------- left: the two other claims, each on its own scale ---------------- */
const gL = el(s, 'g');
H.on((t) => gL.setAttribute('opacity', (1 - .6 * H.go(t, K.bet, K.bet + .8)).toFixed(3)));
/* SpaceX's revenue against the $1T target, on a revenue axis (never the value axis) */
{ const g = el(gL, 'g'), XA0 = 120, XA1 = 620, YA0 = 450, YA1 = 200, ty = tlin('2025-01-01', '2032-01-01', XA0 + 30, XA1);
  const yr = (v) => YA0 - v / (tgt || TR) * (YA0 - YA1);
  logo(g, 'spacex', 64, 116, 22);
  el(g, 'text', { x: 64 + logoW('spacex', 22) + 18, y: 138, class: 'nm', 'font-size': 32 }, 'revenue');
  el(g, 'line', { x1: XA0, x2: XA1, y1: YA0, y2: YA0, stroke: DIM, 'stroke-width': 2 });
  for (let y = 2025; y <= 2032; y++) el(g, 'line', { x1: ty(y + '-01-01'), x2: ty(y + '-01-01'), y1: YA0, y2: YA0 + 10, stroke: DIM, 'stroke-width': 2 });
  [2025].forEach(y => el(g, 'text', { x: ty(y + '-01-01'), y: YA0 + 42, class: 'ax', 'font-size': 28, 'text-anchor': 'middle' }, String(y)));
  const bx = ty('2025-01-01');
  el(g, 'rect', { x: bx - 12, y: yr(sxRev), width: 24, height: YA0 - yr(sxRev), fill: CR });
  el(g, 'text', { x: bx + 22, y: YA0 - 14, class: 'fn', 'font-size': 32 }, fmt.usdB(sxRev));
  H.fade(g, -1, .01);
  if (tgt !== null && tFrom !== null && tTo !== null) {
    const ya = yr(tgt), x31 = ty(tFrom + '-01-01'), x30 = ty(tTo + '-01-01');
    const gt = el(gL, 'g');
    el(gt, 'line', { x1: XA0, x2: x31 + 20, y1: ya, y2: ya, stroke: CR, 'stroke-width': 2, 'stroke-dasharray': '8 6' });
    const ghost = el(gt, 'g');
    el(ghost, 'circle', { cx: x31, cy: ya, r: 12, fill: 'none', stroke: DIM, 'stroke-width': 2, 'stroke-dasharray': '4 4' });
    el(ghost, 'text', { x: x31 + 4, y: ya - 22, class: 'ax', 'font-size': 28, opacity: .8 }, String(tFrom));
    const mk = el(gt, 'circle', { cy: ya, r: 12, fill: 'none', stroke: CR, 'stroke-width': 3 });
    const lb = el(gt, 'text', { y: ya - 26, class: 'fn', 'font-size': 40, 'text-anchor': 'middle' }, fmt.usdT(tgt, 0));
    const yl = el(gt, 'text', { y: YA0 + 42, class: 'ax', 'font-size': 28, 'text-anchor': 'middle' }, String(tTo));    // its year rides under it
    H.on((t) => { const u = H.go(t, K.moved, K.moved + 1.2), x = H.mix(x31, x30, u); mk.setAttribute('cx', x.toFixed(2)); lb.setAttribute('x', x.toFixed(2));
      yl.setAttribute('x', x30.toFixed(2)); yl.setAttribute('opacity', u.toFixed(3)); });
    H.show(ghost, K.moved, .3);
    H.wipe(gt, K.trillion - .2, .9, 'x'); }
}
/* Tesla's value, and the 80% Musk says will be Optimus (his claim: dashed) */
{ const g = el(gL, 'g'), y = 640, X = 120, W = 440;
  logo(g, 'tesla', 64, 560, 26);
  el(g, 'rect', { x: X, y, width: W, height: 56, fill: CR });
  el(g, 'text', { x: X + W + 18, y: y + 42, class: 'fn', 'font-size': 40 }, fmt.usdT(tsVal));
  if (opt !== null) { const go = el(g, 'g'), w = W * opt / 100;
    el(go, 'rect', { x: X, y: y - 8, width: w, height: 72, fill: 'none', stroke: CR, 'stroke-width': 2, 'stroke-dasharray': '8 6' });
    el(go, 'text', { x: X, y: y + 112, class: 'nm', 'font-size': 32 }, 'Optimus');
    el(go, 'text', { x: X + 140, y: y + 112, class: 'fn', 'font-size': 36 }, fmt.pct(opt));
    H.rise(go, K.optimus); }
  H.rise(g, K.optimus - .5); }

H.run();
</script>
