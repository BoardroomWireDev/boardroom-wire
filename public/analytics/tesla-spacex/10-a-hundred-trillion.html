<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A hundred trillion · Boardroom Wire</title>
<!-- TESLA-SPACEX · HERO 10 (V10) · A HUNDRED TRILLION (v2; Ive, 20 Oct 2026). Built from the approved style frame
     sf2-10-hundred-trillion.html (LOOK-tesla-spacex-v2.md; PICTURE-MAP V10). Jarvis's build notes: ">$100T inside title-safe at
     the top"; the revenue note "connected to its own small chart or dropped to its spoken moment": it now lives only on its words.
     Proxy 6 (the last design round): the climb's stage (the ruled wall with its $10T/$50T/$100T scale, the ten-year ground axis
     and today's block) stands from frame 0; the revenue note is its own small chart ($0 to $1T) under the posts, dimmed after "Last year".
     The idea: the climb on one scale, in 09's tower language. Today's SpaceX ($1.98T) a solid block on the ground; Baron's $20T to
     $50T a band on the back wall; Musk's >$100T a dashed plane over everything; our arithmetic a stair of ten dashed yearly towers,
     each 1.48 times the last, so today is a step at the foot of the stair. Every claim dashed; gold only on our underline.
     Timed to the recording: frame 0 = VO 575.56 ("Musk, however, thinks"); ends at VO 635.66 (11 control, "musk owns").
     Steps (board s; ?at= in this order, ?secs=):
       today 0.00 · revenue 7.66 ("reaching a trillion dollars in revenue"; out on "Last year" 12.97) · sweep 10.34 ("2031 to
       2030") · baron 21.92 ("Ron Baron's forecast") · hundred 29.42 ("100 trillion") · stair 37.72 ("getting from $2 trillion")
       · growth 45.38 ("48%")                                                                                     (secs 60.10)
     Receipts and windows ride in the clear area at the right, x 1280 to 1840, y 100 to 720 (#bw-slots): o44 3.51 (5.0 s), o45
     12.97 (4.0 s), o46 20.17 (5.0 s), o47 25.52 (7.0 s); windows o66 43.64 (4.5 s), o67 54.22 (4.0 s).
     Words: Revenue, Ron Baron (said). Figures: $1.98T, $1T, 2030, $20T to $50T, >$100T, ~48% a year (C).
     Render: bw render page --file=10-a-hundred-trillion.html --query="at=0,7.66,10.34,21.92,29.42,37.72,45.38&secs=60.10" --name=10-a-hundred-trillion
     Capture contract: BW.run via HERO.run; ?capture ?final ?still ?beats ?t=<secs|label> ?at= ?secs=. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="stage">
  <svg class="hero" id="s" viewBox="0 0 1920 1080"></svg>
  <div class="chrome"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js"></script>
<script src="shared/motion.js?v=5"></script>
<script src="assets/hero/sf.js"></script>
<script src="assets/hero/hero.js"></script>
<script src="assets/hero/iso.js"></script>
<script src="assets/hero/sf2.js"></script>
<script>
const H = HERO, s = document.getElementById('s'); defs2(s);
const K = H.steps([['today', 0], ['revenue', 7.66], ['sweep', 10.34], ['baron', 21.92], ['hundred', 29.42], ['stair', 37.72], ['growth', 45.38]], 60.10);
const REV_OUT = 12.97;                                                   // "Last year, he wrote": the revenue note leaves
const NOW = usd('spacex_market_cap_2026_10_16'), REV = usd('spacex_fy2025_revenue_total');
const T1 = fld('musk_claim_spacex_1t_revenue_2030_q2_call', 'n'), T1TO = fld('musk_claim_spacex_1t_revenue_2030_q2_call', 'to');
const T100 = fld('musk_claim_spacex_100t_10y_2026', 'n');
const BLO = fld('ron_baron_spacex_20t_50t_2026_10', 'lo'), BHI = fld('ron_baron_spacex_20t_50t_2026_10', 'hi');
const G = U('musk_claim_c_100t_implied_growth'), GD = D('musk_claim_c_100t_implied_growth');
const Y0 = +F('spacex_market_cap_2026_10_16').asOf.slice(0, 4);
const FP = 64, PITCH = 118, ZU = 1e11;                                   // footprint; one unit of height = $100 billion
const STEPS = 10, r = Math.pow(T100 / NOW, 1 / STEPS);                   // the stair's ratio: (100T / today)^(1/10), 1.48 to 2 dp
const WALL = -24, XE = STEPS * PITCH + FP;                               // the back wall's y; the stage's far end
/* proxy 6 (Jarvis, last round): the climb's stage stands from frame 0, the revenue note is its own small chart, the clear area at
   the right is 560 x 620 for the posts */
const V = fitView({ az: 24, elv: 16, world: [-4, WALL, XE + 4, FP, T100 / ZU + 6, 0], rect: [250, 190, 1240, 930] });
const CL = { x: 1280, y: 100, w: 560, h: 620 };                          // the posts' clear area
const root = el(s, 'g', { 'stroke-linejoin': 'round' }), over = el(s, 'g');
const CLAIM = 'rgba(245,241,229,.78)';
function render(t) {
  root.replaceChildren();
  const S = scene(), X1 = XE + 4, X0 = -4;
  /* the stage, from frame 0 at low ink: the back wall ruled every $10 trillion (heavier at $50T and $100T) with its scale at the
     left, and the ten-year axis on the ground, a tick a year; the claims fill it on their words */
  const st = H.go(t, 0, .8), wu = st + (1 - st) * 0, lift = H.go(t, K.baron - .6, K.baron + .4);
  for (let T = 10; T <= 100; T += 10) { const z = T * 1e12 / ZU, a = (T % 50 ? .07 : .16) + lift * .05;
    line3(root, V, [[X0, WALL, z], [X1, WALL, z]], { stroke: `rgba(245,241,229,${(a * st).toFixed(3)})`, sw: T % 50 ? 1.1 : 1.5 }); }
  line3(root, V, [[X0, WALL, 0], [X0, WALL, T100 / ZU]], { stroke: `rgba(245,241,229,${(.45 * st).toFixed(3)})`, sw: 1.6 });
  line3(root, V, [[X0, WALL, 0], [X1, WALL, 0], [X1, FP + 6, 0]], { stroke: `rgba(245,241,229,${(.25 * st).toFixed(3)})`, sw: 1.2 });
  line3(root, V, [[X0, FP + 6, 0], [X1, FP + 6, 0]], { stroke: `rgba(245,241,229,${(.5 * st).toFixed(3)})`, sw: 1.6 });
  for (let i = 0; i <= STEPS; i++) { const x = i * PITCH + FP / 2; line3(root, V, [[x, FP + 6, 0], [x, FP + 10, 0]], { stroke: `rgba(245,241,229,${(.6 * st).toFixed(3)})`, sw: 1.6 }); }
  /* Baron's forecast: a band on the back wall, its two edges dashed (his view, not ours) */
  const bu = H.go(t, K.baron, K.baron + 1.0);
  if (bu > 0) { const z0 = BLO / ZU, z1 = z0 + (BHI - BLO) / ZU * bu;
    el(root, 'polygon', { points: pts(V, [[X0, WALL, z0], [X1, WALL, z0], [X1, WALL, z1], [X0, WALL, z1]]), fill: 'rgba(245,241,229,.06)', stroke: 'none' });
    [z0, z1].forEach(z => line3(root, V, [[X0, WALL, z], [X1, WALL, z]], { stroke: CLAIM, sw: 1.6, dash: '10 8' })); }
  /* Musk's more than $100T: a dashed plane over everything */
  const hu = H.go(t, K.hundred, K.hundred + 1.0);
  if (hu > 0) { const z = T100 / ZU; wire(root, V, X0, WALL, z, (X1 - X0) * hu, FP - WALL, 0, { stroke: CLAIM, sw: 2, dash: '14 8' }); }
  /* today: SpaceX, a solid block on the ground (cream: a fact) */
  const tu = H.go(t, K.today, K.today + .6);
  box(S, V, 0, 0, 0, FP, FP, NOW / ZU * tu, { stroke: 'var(--bg)', fill: 'rgba(245,241,229,.9)', sx: 'rgba(245,241,229,.7)', sy: 'rgba(245,241,229,.8)', sw: 1.6, bias: 0 });
  /* revenue, on the same footprint and scale: 2025's, solid; Musk's $1 trillion target, dashed */
  /* our arithmetic of his number: ten yearly towers, each r times the last, dashed (hypothetical), drawn up the stair */
  for (let i = 1; i <= STEPS; i++) { const u = H.go(t, K.stair + (i - 1) * .22, K.stair + (i - 1) * .22 + .5); if (u <= 0) continue;
    const h = NOW * Math.pow(r, i) / ZU * u, x = i * PITCH;
    S.add(V.depth(x + FP, FP, 0) + i, (g) => wire(g, V, x, 0, 0, FP, FP, h, { stroke: i === STEPS ? CLAIM : 'rgba(245,241,229,.55)', sw: 1.6, dash: '6 6' })); }
  S.paint(root);
}
H.on(render);

/* the figures */
const X0b = -4;
function lab(p, tx, period, fig, a, cls = 'fn', size = 48, anchor = 'start', b = Infinity) {
  const g = el(over, 'g'), col = 'rgba(245,241,229,.5)';
  el(g, 'line', { x1: p[0], y1: p[1], x2: tx, y2: p[1], stroke: col, 'stroke-width': 2 }); el(g, 'circle', { cx: p[0], cy: p[1], r: 4.5, fill: col });
  const dx = anchor === 'start' ? 18 : -18;
  if (period) el(g, 'text', { x: tx + dx, y: p[1] - 12, class: 'ax', 'text-anchor': anchor }, period);
  const f = el(g, 'text', { x: tx + dx, y: p[1] + size * .9, class: cls, 'font-size': size, 'text-anchor': anchor }, fig);
  H.rise(g, a, .5); return [g, f];
}
/* today: below the ground line, clear of the wall's scale; an elbow leader down from the block */
{ const [px, py] = V.P(0, FP, NOW / ZU), g = el(over, 'g'), col = 'rgba(245,241,229,.5)', ty = py + 96, tx = 330;
  el(g, 'path', { d: `M${px},${py} V${ty} H${tx}`, fill: 'none', stroke: col, 'stroke-width': 2 }); el(g, 'circle', { cx: px, cy: py, r: 4.5, fill: col });
  el(g, 'text', { x: tx - 18, y: ty - 12, class: 'ax', 'text-anchor': 'end' }, fmt.day(F('spacex_market_cap_2026_10_16').asOf));
  /* proxy 6 facts: name whose value this is at the today step: SpaceX's mark over the date */
  logo(g, 'spacex', tx - 18 - logoW('spacex', 26), ty - 84, 26);
  const f = el(g, 'text', { x: tx - 18, y: ty + 46, class: 'fn', 'font-size': 52, 'text-anchor': 'end' }, D('spacex_market_cap_2026_10_16'));
  ours(f, 'rgba(245,241,229,.7)'); H.rise(g, K.today + .8, .5); }
/* revenue: its own small chart under the posts' clear area, on its own scale ($0 to $1 trillion): 2025's revenue a solid column (a
   sliver at this scale), Musk's 2030 target a dashed column at full height, the year turning 2031 to 2030 on its words. It stays,
   dimmed, after "Last year" */
{ const g = el(over, 'g'), x0 = 1420, yb = 960, hT = 170, cw = 84, xa = x0 + 40, xb = x0 + 190, col = 'rgba(245,241,229,.8)', LBL = 'fill:rgba(245,241,229,.85)';   /* proxy 7: label contrast */
  el(g, 'line', { x1: x0, y1: yb, x2: x0, y2: yb - hT, stroke: col, 'stroke-width': 2 });
  el(g, 'line', { x1: x0, y1: yb, x2: xb + cw + 30, y2: yb, stroke: col, 'stroke-width': 2 });
  [[0, '$0'], [1, fmt.usdT(T1, 0)]].forEach(([f, l]) => { const y = yb - hT * f; el(g, 'line', { x1: x0 - 10, y1: y, x2: x0, y2: y, stroke: col, 'stroke-width': 2 });
    el(g, 'text', { x: x0 - 18, y: y + 11, class: 'ax', 'text-anchor': 'end', style: LBL }, l); });
  const ha = Math.max(hT * REV / T1, 2.5);
  el(g, 'rect', { x: xa, y: yb - ha, width: cw, height: ha, fill: 'rgba(245,241,229,.9)' });
  el(g, 'rect', { x: xb, y: yb - hT, width: cw, height: hT, fill: 'none', stroke: CLAIM, 'stroke-width': 2, 'stroke-dasharray': '8 6' });
  el(g, 'text', { x: xa + cw / 2, y: yb - ha - 16, class: 'fn', 'font-size': 36, 'text-anchor': 'middle' }, fmt.usdB(REV, 1));
  el(g, 'text', { x: xa + cw / 2, y: yb + 42, class: 'ax', 'text-anchor': 'middle', style: LBL }, '2025');
  const FROMY = (F('musk_claim_spacex_1t_revenue_2030_q2_call') || {}).from, yr = el(g, 'text', { x: xb + cw / 2, y: yb + 42, class: 'ax', 'text-anchor': 'middle', style: LBL }, String(FROMY || T1TO));
  el(g, 'text', { x: xb + cw + 24, y: yb - hT + 30, class: 'nm', 'font-size': 36 }, 'Revenue');
  H.on((t) => { if (FROMY) yr.textContent = String(t >= K.sweep + .4 ? T1TO : FROMY);
    const u = H.go(t, K.revenue, K.revenue + .6) * (1 - .25 * H.go(t, REV_OUT, REV_OUT + .6));   /* steps back only slightly after "Last year": it must still read (proxy 7) */
    g.setAttribute('opacity', u.toFixed(3)); g.style.display = u < .002 ? 'none' : ''; }); }
/* the climb's scale at the left of the wall: $10T, $50T and $100T, from frame 0 */
[10, 50, 100].forEach(T => { const [x, y] = V.P(X0b, WALL, T * 1e12 / ZU);
  H.fade(el(over, 'text', { x: x - 16, y: y + 11, class: 'ax', 'text-anchor': 'end' }, '$' + T + 'T'), 0, .8); });
/* the years along the ground: every other year labelled, the ends always */
for (let i = 0; i <= STEPS; i += 2) { const [x, y] = V.P(i * PITCH + FP / 2, FP + 10, 0);
  H.fade(el(over, 'text', { x, y: y + 40, class: 'ax', 'text-anchor': 'middle' }, String(Y0 + i)), 0, .8); }
{ const [x, y] = V.P(X0b, WALL, (BLO + BHI) / 2 / ZU), g = el(over, 'g');
  el(g, 'text', { x: x + 24, y: y + 2, class: 'fn', 'font-size': 44, 'text-anchor': 'start' }, D('ron_baron_spacex_20t_50t_2026_10'));
  el(g, 'text', { x: x + 24, y: y + 50, class: 'nd', 'font-size': 36, 'text-anchor': 'start' }, 'Ron Baron'); H.rise(g, K.baron + .8, .5); }
{ const [x, y] = V.P(X0b, WALL, T100 / ZU), g = el(over, 'g');
  el(g, 'text', { x: x, y: Math.max(y - 26, 196), class: 'fh', 'font-size': 80, 'text-anchor': 'start', style: 'fill:var(--cream)' }, '>' + fmt.usdT(T100, 0)); H.rise(g, K.hundred + .6, .5); }
/* the stair's ratio, ours: on the last tower's top, with the years at its ends */
{ const i = 9, [x, y] = V.P(i * PITCH, FP / 2, NOW * Math.pow(r, i) / ZU), g = el(over, 'g');
  el(g, 'line', { x1: x - 12, y1: y, x2: x - 70, y2: y, stroke: 'rgba(212,175,55,.8)', 'stroke-width': 2 });
  const tx = el(g, 'text', { x: x - 84, y: y + 20, class: 'fh', 'font-size': 56, 'text-anchor': 'end' }, GD); ours(tx); H.rise(g, K.growth, .5); }
/* the receipts and windows ride in the clear area at the right (bw overlay) */
H.card('o44', 3.51, 3.51 + 5.0, CL, 'TechCrunch, 4 Aug 2026: $1T of revenue moved up to 2030');
H.card('o45', 12.97, 12.97 + 4.0, CL, "Musk's post, 1 Sep 2025: ~80% of Tesla's value (REVIEW-014)");
H.card('o46', 20.17, 20.17 + 5.0, CL, "The post relaying Baron's $20T to $50T");
H.card('o47', 25.52, 25.52 + 7.0, CL, "Musk's reply: more than $100T (REVIEW-002)");
H.slot(over, 'o66', 1280, 150, 560, 315, 43.64, 43.64 + 4.5, 'Super Heavy booster catch (REVIEW-008)');
H.slot(over, 'o67', 1280, 150, 560, 315, 54.22, 54.22 + 4.0, 'Musk on the McGregor stage (REQ-001)');
H.run();
</script>
