<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elon’s Debt Deal</title>
<!-- SPACEX Q3 · HERO 06 · THE RECEIPT (Ive, 27 Oct 2026). Video (ch 6) and the article's financing board.
     The idea: Musk's own sentence, checked. One receipt in the house style (EDITING-FRAMEWORK 18: one flat card, slightly
     tilted, the masthead, the date, the one sentence), the gold pen on what it prints: the $40B, and "investment grade and
     have Starlink & launch revenue". A leader runs from the pen to the filing: what Starlink and rockets brought in that
     quarter, on one $M scale, as filed. Beside it, always, the other side: Bloomberg the same day (the voice's words).
     The card is typeset from data.js (the post's verbatim text) until the capture lands (REQ-006 → stock-pack); then
     ?img=<stock-pack path> swaps the typeset body for the capture and the pen is re-placed on it (Open, in the report).
     Reference: anthropic-ipo 19-promise (receipts marked with the gold pen) and HOUSE-STYLE §6.5 (the filing line).
     Steps (?at=): card, pen, filing, other. Title: the chapter's name in the script. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/brand.css?v=5">
<link rel="stylesheet" href="shared/flagship.css?v=4">
<link rel="stylesheet" href="assets/heroes/hero.css?v=1">
<style>
  .r6-card { position: absolute; left: 120px; top: 300px; width: 1010px; z-index: 4; background: var(--cream); color: var(--ink);
    padding: 52px 60px 60px; transform: rotate(-1.4deg); transform-origin: 50% 50%; }
  .r6-mast { font-family: var(--sans); font-weight: 700; font-size: 32px; letter-spacing: -.01em; color: var(--ink); }
  .r6-date { font-family: var(--mono); font-weight: 500; font-size: 22px; color: rgba(10, 10, 15, .55); margin-top: 6px; }
  .r6-rule { height: 2px; background: rgba(10, 10, 15, .16); margin: 30px 0 30px; }
  .r6-body { font-family: var(--sans); font-weight: 500; font-size: 54px; line-height: 1.26; letter-spacing: -.018em; color: var(--ink); }
  .r6-pen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .r6-pen path { fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .r6-lead { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; z-index: 6; pointer-events: none; }
  .r6-other { position: absolute; left: 1250px; top: 300px; width: 550px; z-index: 4; padding-left: 26px; border-left: 3px solid var(--cream-dim); }
</style>
</head>
<body>
<div class="stage"><div class="chrome"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js?v=8"></script>
<script src="shared/motion.js?v=5"></script>
<script src="shared/flagship.js?v=4"></script>
<script src="assets/heroes/hero.js?v=1"></script>
<script>
const K = { post: 'musk_post_2026_10_25_spacex_40b_gpu_debt', bbg: 'bloomberg_spacex_40b_talks_ongoing',
            star: 'spacex_q3_2026_revenue_connectivity', rock: 'spacex_q3_2026_revenue_space' };
const KEYS = Object.values(K);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const day = (id) => { const [y, m, d] = String(BW.fig(id).asOf).split('-').map(Number); return d + ' ' + MON[m - 1] + ' ' + y; };
const period = (id) => BW.fig(id).label.split(', ').pop();

function build() {
  FX.head('SpaceX', 'How He Pays for It');
  /* no wordmark: brand marks never sit on a board (EDITING-FRAMEWORK 16); the site carries its own */
  const N = {};
  /* the receipt: masthead, date, the one sentence; the pen's two marks are spans of the post's own text */
  const q = BW.fig(K.post).quote || BW.val(K.post);   /* the post's own words, as data.js carries them */
  const body = q.replace(/\$40B/, '<span class="r6-m1">$&</span>')
                .replace(/we.re investment grade and have Starlink &(amp;)? launch revenue/, '<span class="r6-m2">$&</span>');
  N.card = BW.el('div', 'r6-card', document.querySelector('.stage'),
    `<div class="bw-m"><div class="r6-mast">${BW.src(BW.fig(K.post).src).name}</div></div>` +
    `<div class="bw-m"><div class="r6-date">${day(K.post)}</div></div><div class="r6-rule"></div>` +
    `<div class="r6-body">${body}</div>`);
  N.cardIn = [...N.card.querySelectorAll('.bw-m > div')];
  N.pen = BW.mk('svg', { class: 'r6-pen' }); N.card.appendChild(N.pen);
  N.p1 = BW.mk('path', {}, N.pen); N.p2 = [];

  /* the filing: what Starlink and rockets brought in that quarter, one $M scale */
  const FX0 = 1276, FX1 = 1800, S = H.lin(0, 6000, FX0, FX1), Y0 = 630;
  N.rows = [[K.star, 'Starlink', 'rgba(var(--cream-rgb), .62)'], [K.rock, 'Rockets', 'rgba(var(--cream-rgb), .30)']].map(([id, nm, fill], i) => {
    const y = Y0 + i * 156;
    return { id, bar: H.s('rect', { x: FX0, y: y + 44, width: S(H.v(id)) - FX0, height: 40, style: `fill: ${fill}`, 'data-k': id }),
      t: [H.t(FX0, y, nm, 'h-lbl'), H.t(FX1, y - 4, BW.val(id), 'h-num" style="font-size:38px', 'r'),
          H.t(FX1, y + 94, `${H.full(id)} <span class="h-faint">${period(id)}</span>`, 'h-tick', 'r')] };
  });
  N.fAx = H.s('line', { class: 'h-axis', x1: FX0, x2: FX0, y1: Y0 + 32, y2: Y0 + 252, style: 'stroke-width: 1.5' });
  /* the leader rides over the card, on its own layer */
  const LS = BW.mk('svg', { class: 'r6-lead', viewBox: '0 0 1920 1080' }); document.querySelector('.stage').appendChild(LS);
  N.lead = BW.mk('path', { style: 'fill: none; stroke: var(--gold); stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round' }, LS);

  /* the other side, the same day: Bloomberg's headline, verbatim from data.js (the article body is paywalled; capture pending) */
  N.other = BW.el('div', 'r6-other', document.querySelector('.stage'),
    `<div class="bw-m"><div class="h-lbl" style="font-size:34px">${BW.src(BW.fig(K.bbg).src).name}</div></div>` +
    `<div class="bw-m"><div class="h-tick" style="margin-top:6px">${day(K.bbg)}</div></div>` +
    `<div class="bw-m"><div class="h-lbl h-dimc" style="font-size:36px; margin-top:22px; white-space:normal; line-height:1.24">“${BW.val(K.bbg)}”</div></div>`);
  N.otherIn = [...N.other.querySelectorAll('.bw-m > div')];

  BW.provenance({ uses: KEYS });
  N.rows.forEach(r => { r.bar.style.pointerEvents = 'all'; FX.hover(r.bar, r.id, () => FX.tipFor(r.id)); });
  return N;
}

/* the pen is placed on the text as laid out (fonts in), measured with the card held flat */
function penLayout() {
  const c = N.card, keep = c.style.transform; c.style.transform = 'none';
  const cr = c.getBoundingClientRect(), k = cr.width / c.offsetWidth || 1;
  const rel = (r) => ({ x0: (r.left - cr.left) / k, x1: (r.right - cr.left) / k, y0: (r.top - cr.top) / k, y1: (r.bottom - cr.top) / k });
  /* $40B: one loop of the pen, a little off true, as a hand draws it */
  const a = rel(c.querySelector('.r6-m1').getBoundingClientRect()), cx = (a.x0 + a.x1) / 2, cy = (a.y0 + a.y1) / 2 + 2, rx = (a.x1 - a.x0) / 2 + 22, ry = (a.y1 - a.y0) / 2 + 6;
  N.p1.setAttribute('d', `M${cx + rx * .2},${cy - ry * 1.02} C${cx + rx * 1.15},${cy - ry * 1.05} ${cx + rx * 1.12},${cy + ry * 1.0} ${cx},${cy + ry * 1.02}` +
    ` C${cx - rx * 1.14},${cy + ry * 1.0} ${cx - rx * 1.1},${cy - ry * 1.08} ${cx + rx * .36},${cy - ry * .92}`);
  /* the claim: underlined line by line */
  N.p2.forEach(p => p.remove()); N.p2 = [];
  [...c.querySelector('.r6-m2').getClientRects()].forEach((r, i) => {
    const b = rel(r), y = b.y1 - 2;
    N.p2.push(BW.mk('path', { d: `M${b.x0 - 4},${y + 1} C${b.x0 + (b.x1 - b.x0) * .35},${y + 5} ${b.x0 + (b.x1 - b.x0) * .7},${y - 3} ${b.x1 + 6},${y}` }, N.pen));
  });
  c.style.transform = keep;
  /* the leader: from the end of the underline, in stage coordinates, to the filing */
  const sr = document.querySelector('.stage').getBoundingClientRect(), ks = sr.width / 1920;
  const far = N.p2.map(p => p.getBoundingClientRect()).sort((a, b) => b.right - a.right)[0];   /* the line that reaches furthest right */
  const x0 = (far.right - sr.left) / ks + 12, y0 = (far.bottom - sr.top) / ks - 4, y1 = 630 + 64 + 78;   /* between the two bars */
  N.lead.setAttribute('d', `M${x0},${y0} C${x0 + 90},${y0} ${1150},${y1} ${1258},${y1}`);
}

let N = null;
const T = H.at([['card', .3], ['pen', 2.4], ['filing', 4.4], ['other', 6.6]]);
function play() {
  const tl = gsap.timeline();
  if (!N) return tl.to({}, { duration: .1 });
  penLayout();
  H.open(tl, T.card + .8);
  Object.entries(T).forEach(([k, t]) => BW.mark(tl, k, t));
  H.fade(tl, N.card, T.card, .5);
  tl.fromTo(N.card, { y: 24 }, { y: 0, duration: .9, ease: 'power3.out' }, T.card);
  H.rise(tl, N.cardIn, T.card + .3);
  H.draw(tl, N.p1, T.pen, .7); H.draw(tl, N.p2, T.pen + .8, .7);
  H.draw(tl, N.lead, T.filing, .8); H.fade(tl, N.fAx, T.filing + .5);
  N.rows.forEach((r, i) => { H.grow(tl, r.bar, T.filing + .6 + i * .3, .9, '0% 50%', 'scaleX'); H.rise(tl, r.t, T.filing + .8 + i * .3); });
  H.fade(tl, N.other, T.other, .4); H.rise(tl, N.otherIn, T.other + .1, .6, .12);
  tl.to({}, { duration: .01 }, T.other + 2.5);
  return tl;
}
function rest() { H.rest(); if (N) { penLayout(); gsap.set(N.card, { clearProps: 'y' }); } }
if (H.need(KEYS)) N = build();
BW.run({ play, rest });
</script>
</body>
</html>
