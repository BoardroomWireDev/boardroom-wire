<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The waterline · Boardroom Wire</title>
<!-- META Q3 2026, 09, THE NUMBER AND THE WATERLINE (W1; Ive, 25 Oct 2026, pass 2 intro A), on the Print kit's clock
     (PRINT.custom, layer 5.6). One shot, style frames 02 to 04 (review\style-frames-pass2). Board 0 = timeline 0:10.20 (the cut
     off the data-centre film on "spending ... has"); the voice (cue-mapo-words.json):
       10.20            the zero line and the water-level mark are whole from frame 0 (the dissolve lands on picture)
       negative 10.50   -$2.1B drops out from under the line (the line clips it), and lands
       And 11.18        the camera pulls back off the number into the waterline; the number thins as it shrinks; the water
                        appears under the line (the level mark, short water dashes fading with depth)
       a company 13.16  the eight positive quarters draw in across "known for printing cash"
       ambitions 16.18  the camera starts to drift toward the waterline, slowly, gathering
       sinking 18.73    Q3 2026 goes under (gravity in, ~7% deep, a damped settle; the surface dips and rings) and the drift
                        becomes the dive: the camera rides it down to x3
       ship 19.23       the depth dimension and -$2.1B land, settled before the cut to Zuckerberg on "That's" (19.98)
     Nine quarters of free cash flow on one true linear scale; every figure a data.js key (fcf_quarters). Line and flat fill
     only: nothing glows, no haze, no particles. W1's test (w1-motion-test.mp4) held still ~5 s between bars and sink; fixed.
     Re-time: ?at=<line,number,pull,bars,drift,sink,depth>&secs=<length>. Shoot: ?final ?still ?t=<secs|step> ?capture ?beats.
       PASS 3 (26 Oct): board 0 = 10.95, after 35; −$2.1B arrives landed and is never re-landed; bars from 12.00 ("unusual").
       Lay: ?at=-1,-1,0.23,1.05,5.23,7.78,8.3&secs=9.03 (the defaults).
       bw render page --file=09-the-waterline.html --name=09-the-waterline --seconds=9.03 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/brand.css?v=5">
<link rel="stylesheet" href="assets/print/print.css?v=1">
</head>
<body>
<div class="stage">
  <svg class="print" viewBox="0 0 1920 1080"></svg>
  <div class="chrome"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js?v=1"></script>
<script src="shared/motion.js?v=5"></script>
<script src="assets/print/print.js?v=3"></script>
<script>
PRINT.custom((S, H) => {
  const s = H.svg(), k = H.steps(S.steps, S.secs), C = H.C;
  const NS = 'http://www.w3.org/2000/svg';
  const keys = H.list(S.list), n = keys.length;
  const Y = 700, PX = 520 / Math.max(...keys.map(H.V)), BWD = 116, STEP = 178, X0 = 170;
  const NSS = { 'vector-effect': 'non-scaling-stroke' };

  /* the water's drawing convention: short dashes, staggered, fading with depth */
  const defs = s.querySelector('defs');
  const pat = H.el(defs, 'pattern', { id: 'w1-water', width: 96, height: 30, patternUnits: 'userSpaceOnUse' });
  H.el(pat, 'line', { x1: 6, y1: 10, x2: 46, y2: 10, stroke: 'rgba(245,241,229,.20)', 'stroke-width': 1.5 });
  H.el(pat, 'line', { x1: 54, y1: 25, x2: 80, y2: 25, stroke: 'rgba(245,241,229,.13)', 'stroke-width': 1.5 });
  const gr = H.el(defs, 'linearGradient', { id: 'w1-fade', x1: 0, x2: 0, y1: Y, y2: Y + 300, gradientUnits: 'userSpaceOnUse' });
  H.el(gr, 'stop', { offset: 0, 'stop-color': 'white' }); H.el(gr, 'stop', { offset: 1, 'stop-color': 'white', 'stop-opacity': 0 });
  const mask = H.el(defs, 'mask', { id: 'w1-deep', maskUnits: 'userSpaceOnUse', x: -2000, y: 0, width: 6000, height: 5000 });
  H.el(mask, 'rect', { x: -2000, y: Y, width: 6000, height: 300, fill: 'url(#w1-fade)' });

  /* the world, under one camera */
  const W = H.el(s, 'g');
  const water = H.el(W, 'g');
  H.el(water, 'rect', { x: -2000, y: Y, width: 6000, height: 4000, fill: 'rgba(245,241,229,.025)' });
  H.el(water, 'rect', { x: -2000, y: Y + 6, width: 6000, height: 4000, fill: 'url(#w1-water)', mask: 'url(#w1-deep)' });
  H.show(water, k.pull + .15, .9);

  /* the eight quarters above the water, and Q3 2026 */
  const last = keys[n - 1], xq = X0 + (n - 1) * STEP, hq = Math.abs(H.V(last)) * PX;
  const S0 = 2.4;                                      /* the close-up: frame 02's line at y 470 and its 300 px figure */
  const clip = H.el(defs, 'clipPath', { id: 'w1-under' });
  H.el(clip, 'rect', { x: -2000, y: Y, width: 6000, height: 4000 });
  const numG = H.el(W, 'g');
  const numIn = H.el(H.el(numG, 'g', { 'clip-path': 'url(#w1-under)' }), 'g');
  /* pass 3 (26 Oct): ONE −$2.1B for the whole shot. It arrives landed from 35 (clear of the line: its top ~50 px under it at
     x2.4), stays in the world as the camera pulls back and the bars rise behind it, and on "sinking" it travels down with the
     bar to become the depth figure (the old fig and label, same place and size: W1's last frame, which 33 opens on, is intact) */
  const F0 = 300 / S0, NY = Y + 292 / S0, LYB = Y + 396 / S0;
  const num = H.el(numIn, 'text', { x: xq + BWD / 2, y: NY, class: 'fh', 'font-size': F0, style: `fill:${C.red}` }, H.disp(last));
  H.tip(num, H.tipText(last));
  const numL = H.el(numG, 'text', { x: xq + BWD / 2, y: LYB, class: 'ax', 'font-size': 40 / S0, style: 'fill:rgba(245,241,229,.62);font-family:var(--sans)' }, H.F(last).label);
  H.on((t) => { const u = H.go(t, k.number, k.number + .5, H.ease.out); numIn.setAttribute('transform', `translate(0,${(-(1 - u) * 130).toFixed(2)})`); });
  H.show(numL, k.number + .35, .4);
  const bars = keys.slice(0, -1).map((key, i) => {
    const x = X0 + i * STEP, h = H.V(key) * PX, g = H.el(W, 'g');
    const r = H.el(g, 'rect', { x, y: Y - h, width: BWD, height: h, fill: 'rgba(245,241,229,.10)', stroke: 'rgba(245,241,229,.55)', 'stroke-width': 1.5, ...NSS });
    H.tip(r, H.tipText(key));
    const v = H.el(g, 'text', { x: x + BWD / 2, y: Y - h - 18, class: 'fn', 'font-size': 32, 'text-anchor': 'middle', opacity: .78 }, H.disp(key));
    const q = H.el(g, 'text', { x: x + BWD / 2, y: Y - h - 62, class: 'ax', 'font-size': 32, 'text-anchor': 'middle' }, H.F(key).label);
    const at = k.bars + i * .33;               /* from the pull through "printing cash" (pass 3: never an empty axis) */
    H.grow(r, at, .7, x, Y, 'y', H.ease.out);
    H.show(v, at + .45, .4, .78); H.show(q, at + .45, .4);
    return r;
  });

  /* Q3 2026: the sink. Gravity in (t^2 to 107% of its depth in 0.45 s), then a damped spring back to the true depth */
  const sinkR = H.el(W, 'rect', { x: xq, y: Y, width: BWD, height: 0, fill: C.red });
  H.tip(sinkR, H.tipText(last));
  const depth = (t) => {
    const u = t - k.sink; if (u <= 0) return 0;
    if (u < .45) return 1.07 * (u / .45) * (u / .45);
    const v = u - .45; return 1 + .07 * Math.exp(-5 * v) * Math.cos(2 * Math.PI * v / .42);
  };
  H.on((t) => { const d = depth(t); sinkR.setAttribute('height', (hq * d).toFixed(2)); sinkR.style.display = d <= 0 ? 'none' : ''; });

  /* the surface: one line, with a small dip where the bar goes in, ringing out */
  const surf = H.el(W, 'path', { fill: 'none', stroke: 'var(--cream)', 'stroke-width': 2.4, ...NSS });
  const xc = xq + BWD / 2;
  H.on((t) => {
    const u = t - k.sink - .3, A = u <= 0 ? 0 : -4 * Math.exp(-3.2 * u) * Math.sin(2 * Math.PI * u / .55);
    /* pass 2 review: the line is whole from frame 0, so the dissolve in lands on picture, not on bare ink */
    let d = `M -2000 ${Y} L ${xc - 420} ${Y}`;
    for (let x = xc - 420; x <= xc + 420; x += 6) { const g = Math.exp(-Math.pow((x - xc) / 140, 2)); d += ` L ${x} ${(Y + A * g).toFixed(2)}`; }
    surf.setAttribute('d', d + ` L 6000 ${Y}`);
  });
  /* the water level mark and the zero */
  const lvl = H.el(W, 'g');
  const tx = 1839;
  H.el(lvl, 'path', { d: `M${tx - 16},${Y - 28} L${tx + 16},${Y - 28} L${tx},${Y} Z`, fill: 'none', stroke: 'var(--cream)', 'stroke-width': 2, ...NSS });
  H.el(lvl, 'line', { x1: tx - 22, x2: tx + 22, y1: Y + 12, y2: Y + 12, stroke: 'var(--cream)', 'stroke-width': 2, ...NSS });
  H.el(lvl, 'line', { x1: tx - 12, x2: tx + 12, y1: Y + 22, y2: Y + 22, stroke: 'var(--cream)', 'stroke-width': 2, ...NSS });
  H.show(lvl, -1, .01);
  H.show(H.el(W, 'text', { x: 96, y: Y - 14, class: 'ax', 'font-size': 32 }, '$0'), k.pull + .6, .4);

  /* the depth, measured on "ship": a dimension line from the surface to the bar's foot, and the figure under it */
  const dx = xq + BWD + 12, dimG = H.el(W, 'g');
  const L = (a) => H.el(dimG, 'line', Object.assign({ stroke: C.red, 'stroke-width': 2, ...NSS }, a));
  L({ x1: dx, x2: dx, y1: Y, y2: Y + hq });
  L({ x1: dx - 3, x2: dx + 3, y1: Y + hq, y2: Y + hq });
  L({ x1: xq + BWD + 1.5, x2: dx + 3, y1: Y + hq, y2: Y + hq, 'stroke-dasharray': '4 4' });
  H.el(dimG, 'path', { d: `M${dx},${Y + hq} l-2,-4.7 l4,0 Z`, fill: C.red });
  H.el(dimG, 'path', { d: `M${dx},${Y} l-2,4.7 l4,0 Z`, fill: C.red });
  H.show(dimG, k.depth, .4);
  /* the depth figure is the same −$2.1B, left-aligned throughout (as 33 redraws it, at x = xq and xq + 1.3); while it holds it is
     centred on Q3 2026 by its advance width per unit of font size, measured once */
  const wN = H.tw(num) / F0, wL = H.tw(numL) / (40 / S0);

  /* the camera, one shot: close on the number; the pull-back to the whole board; from "ambitions" a drift toward the water that
     gathers into the dive as the bar goes under, and settles at x3 on "ship". The drift covers 30% of the move (in log scale)
     by "sinking" and arrives there still moving; a Hermite out-segment carries that speed into the dive and lands at rest. */
  const P0 = { cx: xc, cy: Y + (540 - 470) / S0, s: S0 }, P1 = { cx: 960, cy: 540, s: 1 }, A2 = { cx: xc - 60, cy: Y + 110, s: 3 };
  const cam = (a, b, u) => ({ cx: H.mix(a.cx, b.cx, u), cy: H.mix(a.cy, b.cy, u), s: a.s * Math.pow(b.s / a.s, u) });
  const T1 = k.drift, T3 = k.sink + 1.07, QS = (k.sink - T1) / (T3 - T1), m0 = (.3 * 2 / QS) * (1 - QS) / .7;
  const glide = (q) => {
    if (q <= 0) return 0; if (q >= 1) return 1;
    if (q < QS) return .3 * (q / QS) * (q / QS);
    const r2 = (q - QS) / (1 - QS), h10 = r2 * r2 * r2 - 2 * r2 * r2 + r2, h01 = -2 * r2 * r2 * r2 + 3 * r2 * r2;
    return .3 + .7 * (h10 * m0 + h01);
  };
  H.on((t) => {
    const up = H.go(t, k.pull, k.pull + 1.8, H.ease.io);
    const c = t < k.drift ? cam(P0, P1, up) : cam(P1, A2, glide((t - T1) / (T3 - T1)));
    W.setAttribute('transform', `translate(960,540) scale(${c.s.toFixed(4)}) translate(${(-c.cx).toFixed(2)},${(-c.cy).toFixed(2)})`);
    lvl.setAttribute('transform', `translate(${tx},${Y}) scale(${(1 / c.s).toFixed(4)}) translate(${-tx},${-Y})`);   /* a symbol keeps its drawn size */
    /* the number's three places: LANDED (35's last frame, centred, x2.4), HELD (from the pull: 80 px at x1, right-aligned under
       Q3 2026 and low enough that the sinking bar never reaches it), and DEPTH (W1's last frame, under the bar's foot) */
    const v = H.go(t, k.sink + .1, k.depth + .35, H.ease.io), XR = xq + BWD + 20;
    const fNh = H.mix(F0, 80, up), fN = H.mix(fNh, 50, v);
    const xNh = H.mix(xq + BWD / 2 - wN * F0 / 2, XR - wN * 80, up), yNh = H.mix(NY, Y + 172, up);
    num.setAttribute('font-size', fN.toFixed(3)); num.setAttribute('x', H.mix(xNh, xq, v).toFixed(2)); num.setAttribute('y', H.mix(yNh, Y + hq + 50, v).toFixed(2));
    const fLh = H.mix(40 / S0, 32 / c.s, up), fL = H.mix(fLh, 11, v);    /* the label holds at 32 px on screen */
    const xLh = H.mix(xq + BWD / 2 - wL * fLh / 2, XR - wL * fLh, up), yLh = H.mix(LYB, Y + 214, up);
    numL.setAttribute('font-size', fL.toFixed(3)); numL.setAttribute('x', H.mix(xLh, xq + 1.3, v).toFixed(2)); numL.setAttribute('y', H.mix(yLh, Y + hq + 66.7, v).toFixed(2));
  });
})({ list: 'fcf_quarters',
     steps: [['line', -1], ['number', -1], ['pull', 0.23], ['bars', 1.05], ['drift', 5.23], ['sink', 7.78], ['depth', 8.3]], secs: 9.03 });
</script>
</body>
</html>
