<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse Wonder</title>
<!-- META Q3 2026 · HERO · MUSE WONDER (NEW-3, 4:15-4:55; Ive's builder, 25 Oct 2026). Builds once for video and web.
     The idea: Meta's own words for Wonder (the date, "our first frontier model", Prometheus), then one independent read on a
     true zero-based scale: Artificial Analysis puts Wonder at 56, Claude Opus 5.5 at 58 (estimates, so hatched). Then who gets
     it: Spark at 48 joins, and a tier marker (a rule in the tier colour, the word) sets Wonder paid and Spark free, with Meta's
     (pass 2: no receipt; the newsroom's "will soon" line is off until a dated capture of Zuckerberg's 12 Oct post exists). Refined 25 Oct (Ive's refiner): names in a fixed column left of the scale, values in one
     column past it, so no type touches a rule; type >= 32 px, ticks 28.
     Every figure, date and quote is a data.js key. Shoot: ?final ?still ?t=<secs|label> ?capture.
     Re-time on the VO: ?at=<intro,prometheus,index,tiers,lands>  (defaults 0, 2.0, 8.0, 14.0, 17.0; picture ~19 s).
     ?brand=dim|end|0. ?strict shows the key of every line that has no data.js row yet.
     Render: node <nb-tools>\shoot.mjs <outdir> "hero-wonder.html?final=>end.png"  (video: BW capture via ?capture, as the other hero-*.html) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/brand.css?v=5">
<link rel="stylesheet" href="assets/hero/hero.css?v=1">
</head>
<body>
<div class="stage">
  <svg class="hero" viewBox="0 0 1920 1080">
    <defs>
      <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="var(--bg)"></rect><line x1="0" y1="0" x2="0" y2="12" stroke="var(--gold)" stroke-width="4"></line>
      </pattern>
      <pattern id="hatchc" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="var(--bg)"></rect><line x1="0" y1="0" x2="0" y2="12" stroke="var(--cream)" stroke-opacity=".5" stroke-width="3"></line>
      </pattern>
    </defs>
    <g id="world"></g>
  </svg>
  <div class="chrome"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js?v=1"></script>
<script src="shared/motion.js?v=5"></script>
<script src="assets/hero/hero.js?v=1"></script>
<script>
const S = HERO.steps({ intro: 0, prometheus: 2.0, index: 8.0, tiers: 14.0, lands: 17.0 });
const { mk, mark, fig } = HERO;
const W = document.getElementById('world');
const SRC = BW_DATA.sources, NAMES = BW_DATA.names;
const model = (f) => f ? f.label.split(', Intelligence Index')[0] : '';

function build() {
  W.innerHTML = '';
  const tl = gsap.timeline();
  const name = fig('meta_wonder_first_frontier'), date = fig('wonder_launch'), prom = fig('wonder_trained_prometheus');
  const won = fig('aa_wonder_full_index'), opus = fig('aa_opus55_index'), spark = fig('aa_muse_spark_13_index');

  /* ---------- the header: the mark, the name, the date ---------- */
  const MH = 46;
  const logo = mark(W, 'muse', 120, 54, MH, 'gold');
  const nameT = mk('text', { x: 120 + HERO.markW('muse', MH) + 18, y: 93, class: 'w', 'font-size': 44, 'font-weight': 600 }, W, name.label);
  const hero = mk('text', { x: 112, y: 230, class: 'nh', 'font-size': 124, 'word-spacing': '-.3em' }, W, date.display);
  const heroL = mk('text', { x: 120, y: 286, class: 'wd', 'font-size': 32 }, W, date.label);

  /* Meta's words, each with its speaker or source on its last line; the block spans the date's cap height to its label's baseline */
  /* the date's rendered right edge, in viewBox units (SVG text metrics ignore the negative word-spacing, the rendered box does not) */
  const svgR = W.ownerSVGElement.getBoundingClientRect(), hR = hero.getBoundingClientRect();
  const dateEnd = (hR.right - svgR.left) * 1920 / svgR.width;
  const QX = Math.round(dateEnd + 100);                   /* the rule sits 64 px past the date's last figure, the words 36 past the rule */
  const q1 = mk('g', {}, W);
  const q1t = mk('text', { x: QX, y: 170, class: 'wq', 'font-size': 36 }, q1, '“' + name.display + '”');
  mk('tspan', { dx: 22, class: 'wd', 'font-size': 32 }, q1t, NAMES.mark_zuckerberg);
  const q2 = mk('g', {}, W);
  const q2t = HERO.wrap(q2, '“' + prom.display + '”', QX, 242, 36, 560, 'wq', {}, 44 / 36);
  mk('tspan', { dx: 22, class: 'wd', 'font-size': 32 }, q2t, SRC[prom.src].name);
  const qrule = mk('line', { x1: QX - 36, x2: QX - 36, y1: 140, y2: 296, class: 'rule' }, W);

  /* ---------- the index: one true zero-based scale ---------- */
  /* the names sit in their own column left of the scale, so no name ever touches a rule */
  const NX = 120, NFS = 34;
  const nmOf = [opus, won, spark].map(model);
  const probe = mk('text', { x: 0, y: -100, class: 'w', 'font-size': NFS }, W);
  const nameW = Math.max(...nmOf.map(t => { probe.textContent = t; return probe.getComputedTextLength(); }));
  probe.remove();
  const X0 = Math.round(NX + nameW + 48), X1 = 1480, VMAX = 60, k = (X1 - X0) / VMAX;
  const vx = (v) => X0 + v * k;
  const VX = X1 + 92;                                       /* the values: one right-aligned column past the scale */
  const TX = VX + 60;                                       /* the tier markers */
  const cap = mk('text', { x: NX, y: 392, class: 'wd', 'font-size': 32 }, W, SRC[won.src].name + ' Intelligence Index');
  const ROW0 = 444, PITCH = 112, BH = 70;
  const GT = ROW0 - 16;                                     /* the grid starts just above the first bar */
  const AXY = ROW0 + 2 * PITCH + BH + 16;                   /* the zero baseline under the last bar */
  const grid = mk('g', {}, W);
  const ticks = [];
  for (let v = 0; v <= VMAX; v += 10) {
    const x = vx(v);
    if (v) mk('line', { x1: x, x2: x, y1: GT, y2: AXY, class: 'rule', style: '--w:1.5px' }, grid);
    ticks.push(mk('text', { x, y: AXY + 38, 'text-anchor': 'middle', class: 'ax', 'font-size': 28 }, W, String(v)));
  }
  const axis = mk('line', { x1: X0, x2: X1, y1: AXY, y2: AXY, class: 'hair', style: '--w:1.5px' }, W);
  const zero = mk('line', { x1: X0, x2: X0, y1: GT, y2: AXY, class: 'hair', style: '--w:1.5px' }, W);

  /* rows, highest first: Opus, Wonder, Spark (so the two Muse rows sit together for the tiers) */
  function row(i, f, fillId, stroke, numCls) {
    const by = ROW0 + i * PITCH, cy = by + BH / 2;
    const g = mk('g', {}, W);
    const nm = mk('text', { x: NX, y: cy + 12, class: 'w', 'font-size': NFS }, g, nmOf[i]);
    const bar = mk('rect', { x: X0, y: by, width: f.v * k, height: BH, fill: `url(#${fillId})`, stroke, 'stroke-width': 2 }, g);
    const num = mk('text', { x: VX, y: cy + 17, 'text-anchor': 'end', class: numCls, 'font-size': 48 }, g, f.display);
    return { g, nm, bar, num, w: f.v * k, by, cy };
  }
  const rO = row(0, opus, 'hatchc', 'var(--cream)', 'n');
  const rW = row(1, won, 'hatch', 'var(--gold)', 'n gold');
  const rS = row(2, spark, 'hatchc', 'var(--cream)', 'n');

  /* ---------- the tiers: who gets which model (a rule in the tier's colour, the bar's height, the word on its centre) ---------- */
  function tier(r, label, tone) {
    const g = mk('g', {}, W);
    const p = mk('line', { x1: TX, x2: TX, y1: r.cy - 22, y2: r.cy + 22, stroke: `var(--${tone})`, 'stroke-width': 4 }, g);
    const t = mk('text', { x: TX + 24, y: r.cy + 12, class: 'w' + (tone === 'gold' ? ' gold' : ''), 'font-size': 34, 'font-weight': 600 }, g, label);
    return { g, p, t };
  }
  /* pass 1 (25 Oct): no 'paid' mark on the Full row: Wonder Full (Max) is Muse Code's model, not the Muse app's */
  const bFree = tier(rS, 'free', 'cream');

  /* pass 2 (Jarvis, 25 Oct): the newsroom's "will soon" line is off. It does not print the claim the voice makes ("for now,
     Wonder only powers Muse for people who pay"). The receipt returns only as a dated capture of Zuckerberg's own 12 Oct post
     (zuck_wonder_subscribe_today), when the footage desk delivers one; until then the tier marks carry the point. */
  const rec = mk('g', {}, W);

  /* ---------- the timeline ---------- */
  BW.mark(tl, 'intro', S.intro);
  HERO.rise(tl, [logo, nameT], S.intro + .1, { dy: 16 });
  HERO.rise(tl, [hero, heroL], S.intro + .4);

  BW.mark(tl, 'prometheus', S.prometheus);
  HERO.draw(tl, qrule, S.prometheus, .6);
  HERO.rise(tl, [q1], S.prometheus + .1, { dy: 18 });
  HERO.rise(tl, [q2], S.prometheus + 2.2, { dy: 18 });

  BW.mark(tl, 'index', S.index);
  HERO.fade(tl, [cap], S.index, .5);
  HERO.draw(tl, axis, S.index + .1, .8);
  HERO.draw(tl, zero, S.index + .1, .5);
  HERO.fade(tl, Array.from(grid.children).concat(ticks), S.index + .4, .6);
  const grow = (r, at) => {
    HERO.rise(tl, [r.nm], at, { dy: 14 });
    tl.fromTo(r.bar, { attr: { width: 0 }, opacity: 0 }, { attr: { width: r.w }, opacity: 1, duration: 1.2, ease: 'power2.inOut', immediateRender: true }, at + .2);
    HERO.rise(tl, [r.num], at + 1.2, { dy: 14 });
  };
  grow(rW, S.index + .8);
  grow(rO, S.index + 1.3);

  BW.mark(tl, 'tiers', S.tiers);
  tl.to(rO.g, { opacity: .45, duration: .6, ease: 'power2.out' }, S.tiers);   /* Opus steps back, still legible */
  grow(rS, S.tiers);
  HERO.draw(tl, bFree.p, S.tiers + 1.7, .4);
  HERO.rise(tl, [bFree.t], S.tiers + 1.8, { dy: 14 });
  HERO.rise(tl, [rec], S.tiers + 2.0, { dy: 16 });

  BW.mark(tl, 'lands', S.lands);
  const END = Math.max(S.lands, S.tiers + 2.7);
  tl.to(rO.g, { opacity: .7, duration: .8, ease: 'power2.inOut' }, END);     /* the comparison comes back for the hold */
  HERO.credit(tl, .4);
  HERO.brand(tl, END);
  tl.to({}, { duration: .1 }, END + .8);
  return tl;
}
function play() { return build(); }
function rest() { const tl = build(); tl.progress(1); tl.pause(); }
/* the layout measures type: load the faces it measures before the first build (web fonts load lazily in SVG text,
   so fonts.ready alone resolves before they exist); capped, so a font that never arrives cannot hold the page */
const FACES = ['500 34px Inter', '400 32px Inter', '600 40px "IBM Plex Mono"', '700 124px "IBM Plex Mono"'];
Promise.race([Promise.all(FACES.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(() => BW.run({ play, rest }));
</script>
</body>
</html>
