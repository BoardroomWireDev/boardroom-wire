<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Stock</title>
<!-- META Q3 2026, 26, NEW-9 THE STOCK, 21-22 OCT (Ive, 25 Oct 2026), on the Print kit's clock (PRINT.custom, layer 5.5).
     GAPS-locked gap 6, 7:29.22, 15.8 s. The voice: "Initially, markets reacted positively to the call, with Meta's stock rising
     in after-hours trading. But then it took a turn, and by the end of next day's close, it was down almost 7%. All of the
     media coverage tied it to their spending."
     One true scale in percent from the 21 Oct close (0). Proxy pass 1 (25 Oct): the after-hours move is direction only (a chevron
     on "reacted positively", 1.3 s), because sources disagree on its size (CNBC about 2.5%, Investing.com +0.95%) and data.js
     forbids either without its time. The turn is a red dimension line close to close, 0 to −6.98% (data.js, heygotrade; no CNBC
     "nearly 7%" row exists yet). Then CNBC's own sentence on the selloff, credited, with the spending in gold. The scale and the
     zero level land by 0.5 s (the visual check failed a bare axis).
     Re-time: ?at=<up,turn,down,media>&secs=<length>. Shoot: ?final ?still ?t=<secs|step> ?capture ?beats.
       bw render page --file=26-the-stock.html --name=26-the-stock --seconds=17.8 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/brand.css?v=5">
<link rel="stylesheet" href="assets/print/print.css?v=1">
</head>
<body>
<div class="stage">
  <svg class="print" viewBox="0 0 1920 1080"></svg>
  <div class="chrome"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="shared/data.js?v=1"></script>
<script src="shared/motion.js?v=5"></script>
<script src="assets/print/print.js?v=2"></script>
<script>
PRINT.custom((S, H) => {
  const s = H.svg(), k = H.steps(S.steps, S.secs), C = H.C, MINUS = '−';
  const dn = +H.F(S.down).v;                                                       // percent, as data.js keeps it
  /* pass 1 (25 Oct): the after-hours move is shown as direction only; data.js forbids its size without a time stamp */
  const lo = Math.floor(Math.min(0, dn) / 2) * 2, hi = 4;                          // a domain on 2-point ticks
  const XA = 200, XB = 1040, y = H.lin(hi, lo, 250, 790), pct = (v) => (v > 0 ? '+' : v < 0 ? MINUS : '') + Math.abs(v) + '%';
  const chart = H.el(s, 'g');
  /* the scale, drawn at a third from frame 0 (rule 17) */
  const ax = H.el(chart, 'g');
  for (let v = hi; v >= lo; v -= 2) {
    H.el(ax, 'line', { x1: XA, x2: XB, y1: y(v), y2: y(v), stroke: v === 0 ? C.zero : 'rgba(245,241,229,.13)', 'stroke-width': v === 0 ? 4 : 2 });   /* pass 3: heavier, for a phone */
    H.el(ax, 'text', { x: XA - 22, y: y(v) + 13, class: 'ax', 'font-size': 38, 'text-anchor': 'end' }, v === 0 ? '0' : pct(v));
  }
  H.show(ax, 0, .4);                                /* pass 2 (visual FAIL): the scale and the zero level are drawn by 0.4 s */
  /* the stations: the 21 Oct close (the zero), after hours that evening, the 22 Oct close */
  const X = [270, 430, 1000], BW2 = 64;
  const level = (x, v, col, dash) => H.el(chart, 'line', { x1: x - BW2, x2: x + BW2, y1: y(v), y2: y(v), stroke: col, 'stroke-width': 12, 'stroke-dasharray': dash || null });
  const dim = (x, v0, v1, col) => { const g = H.el(chart, 'g');
    H.el(g, 'line', { x1: x, x2: x, y1: y(v0), y2: y(v1), stroke: col, 'stroke-width': 5 });
    const d = v1 > v0 ? -1 : 1; H.el(g, 'path', { d: `M${x - 11},${y(v1) - d * 16} L${x},${y(v1)} L${x + 11},${y(v1) - d * 16}`, fill: 'none', stroke: col, 'stroke-width': 5 });
    return g; };
  const z = level(X[0], 0, 'rgba(245,241,229,.7)'); H.show(z, 0, .4);
  /* up after hours: direction only, so the chevron sits beside its date label, OFF the % scale (pass 2: on the scale it read as
     a level); placed after the labels are set, below */
  /* the turn, to the next day's close (a loss: red), dimensioned close to close from the zero, which is what −6.98% measures */
  H.draw(dim(X[2], 0, dn, C.red), k.turn + .3, k.down - k.turn - .3, H.ease.io);
  const l2 = level(X[2], dn, C.red); H.tip(l2, H.tipText(S.down)); H.show(l2, k.down - .2, .4);
  H.rise(H.el(chart, 'text', { x: X[2] - BW2 - 24, y: y(dn) + 22, class: 'fh', 'font-size': 64, 'text-anchor': 'end', style: 'fill:var(--red)' }, H.disp(S.down)), k.down, .6, 20);   /* data.js display */
  /* the stations' periods and line items, from data.js labels, set from each level's left edge */
  let upDate = null;
  [[X[1], S.up], [X[2], S.down]].forEach(([x, key], i) => {
    const g = H.el(chart, 'g');
    const d = H.el(g, 'text', { x: x - BW2, y: 868, class: 'ax', 'font-size': 40, style: 'fill:rgba(245,241,229,.75)' }, H.label(key));
    H.el(g, 'text', { x: x - BW2, y: 914, class: 'nd', 'font-size': 34 }, H.name(key));
    if (!i) upDate = d;
    H.show(g, i ? k.turn - .1 : k.up, .5);   /* final fixes: 22 Oct's label is up before the drop draws, so the fall never reads as after hours */
  });
  const cx = X[1] - BW2 + Math.max(H.tw(upDate), 268) + 48, cy = 852;
  const ch = H.el(chart, 'path', { d: `M${cx - 24},${cy + 10} L${cx},${cy - 16} L${cx + 24},${cy + 10}`, fill: 'none', stroke: C.cream, 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  H.rise(ch, k.up + .2, .5, 14);
  H.on((t) => chart.setAttribute('opacity', (1 - .45 * H.go(t, k.media, k.media + .8)).toFixed(3)));
  /* CNBC's sentence on the selloff, its words verbatim (data.js display), the spending in gold */
  const txt = H.F(S.quote).display, gold = S.gold, gi = txt.indexOf(gold);
  const words = [];
  txt.split(' ').forEach((w, i, a) => { const at = a.slice(0, i).join(' ').length + (i ? 1 : 0); words.push({ w, g: gi >= 0 && at >= gi && at < gi + gold.length }); });
  const QX = 1200, QW = 560, FS = 38, LH = FS * 1.34, g = H.el(s, 'g');
  H.el(g, 'text', { x: QX, y: 300, class: 'nm', 'font-size': 32, style: 'font-weight:600' }, H.name(S.quote));
  H.el(g, 'text', { x: QX, y: 344, class: 'ax', 'font-size': 32 }, H.label(S.quote));
  H.el(g, 'line', { x1: QX, x2: QX + QW, y1: 372, y2: 372, stroke: 'rgba(245,241,229,.18)', 'stroke-width': 2 });
  let line = H.el(g, 'text', { x: QX, y: 430, class: 'qt', 'font-size': FS }), n = 0;
  words.forEach(({ w, g: isG }) => {
    const ts = H.el(line, 'tspan', isG ? { class: 'qg' } : {}, (line.childNodes.length ? ' ' : '') + w);
    if (H.tw(line) > QW && line.childNodes.length > 1) { line.removeChild(ts); n++;
      line = H.el(g, 'text', { x: QX, y: 430 + n * LH, class: 'qt', 'font-size': FS }); H.el(line, 'tspan', isG ? { class: 'qg' } : {}, w); }
  });
  /* one run per colour on each line, so a line reads as a line (bw words reads text runs) */
  g.querySelectorAll('text').forEach(tx => { [...tx.childNodes].forEach(ts => { const p = ts.previousSibling;
    if (p && p.getAttribute('class') === ts.getAttribute('class')) { p.textContent += ts.textContent; ts.remove(); } }); });
  H.tip(g, H.tipText(S.quote)); H.rise(g, k.media, .7, 24);
})({ up: 'meta_after_hours_21_oct_2026_cnbc', down: 'meta_share_price_change_22_oct_2026', quote: 'meta_selloff_capex_attribution_r',
     gold: 'negative free cash flow',
     /* board 0 = 7:29.73; "rising" 3.97, "took a turn" 7.16, "down almost 7%" 10.8-11.4, "All of the media" 12.96 */
     steps: [['up', 3.97], ['turn', 7.16], ['down', 11.0], ['media', 12.96]], secs: 17.8 });
</script>
</body>
</html>
